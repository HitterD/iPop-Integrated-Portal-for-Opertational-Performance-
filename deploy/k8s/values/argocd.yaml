# Argo CD manages itself after bootstrap (same chart + values the installer used).
global:
  domain: argocd-ipop.santos.co.id
configs:
  params:
    server.insecure: true          # TLS ends at Zoraxy; inside the LAN it is plain http
  cm:
    timeout.reconciliation: 120s
    # k3s's HelmChartConfig has no status of its own (k3s's helm job applies it): report it healthy.
    resource.customizations.health.helm.cattle.io_HelmChartConfig: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Applied by k3s"
      return hs
dex: { enabled: false }
notifications: { enabled: false }
applicationSet: { replicas: 1 }
redis:
  resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 192Mi } }
controller:
  resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1Gi } }
repoServer:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
server:
  resources: { requests: { cpu: 25m, memory: 96Mi }, limits: { memory: 256Mi } }
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: kube-system-ict-only@kubernetescrd
    extraHosts:
      - name: argocd.192.168.2.89.nip.io
        path: /
