# Longhorn: replicated volumes for things that must survive a node (iPop uploads, Redis, ONLYOFFICE data).
# Postgres does NOT use Longhorn: CloudNativePG replicates itself onto local-path disks.
persistence:
  defaultClass: false               # local-path stays the default; pick "longhorn" explicitly
  defaultClassReplicaCount: 2       # 2 copies across 3 nodes: survives one node, saves disk
  reclaimPolicy: Retain
defaultSettings:
  defaultReplicaCount: 2
  storageMinimalAvailablePercentage: 15
  replicaSoftAntiAffinity: false    # never two copies on one node
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  defaultDataLocality: best-effort
  # ipop-data is ReadWriteMany (shared over NFS by a share-manager pod). Without this, losing the node
  # that ran the share-manager stalled the API's volume for ~5 min (measured); with it ~20-30 s.
  rwxVolumeFastFailover: true
longhornUI:
  replicas: 1
ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn-ipop.santos.co.id   # also via longhorn.192.168.2.89.nip.io (platform/longhorn-nip.yaml)
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-ict-only@kubernetescrd,longhorn-system-longhorn-auth@kubernetescrd
# 3 of each CSI sidecar (one per node, leader-elected): with 1, a node failure that also took the
# attacher blocked every volume move for ~5 min (measured).
csi:
  attacherReplicaCount: 3
  provisionerReplicaCount: 3
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2
# Argo CD runs Helm hooks before regular resources; Longhorn's pre-upgrade hook needs its service
# account first, so it never starts. Argo upgrades are already ordered; skip the hook.
preUpgradeChecker:
  jobEnabled: false
# Volume backups (iPop uploads, ONLYOFFICE data) to the S3 bucket "longhorn-backups" on the Synology.
defaultBackupStore:
  backupTarget: s3://longhorn-backups@garage/
  backupTargetCredentialSecret: backup-s3
  pollInterval: "300"
