apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: git@github.com:HitterD/iPop-Integrated-Portal-for-Opertational-Performance-.git
    targetRevision: main
    path: deploy/k8s/apps/ops
  destination:
    server: https://kubernetes.default.svc
    namespace: ipop
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
