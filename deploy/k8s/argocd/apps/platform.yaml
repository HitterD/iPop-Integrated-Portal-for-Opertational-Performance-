apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@github.com:HitterD/iPop-Integrated-Portal-for-Opertational-Performance-.git
    targetRevision: IT18/deploy-prod-k3s   # TEST PHASE; back to main once CI secrets exist
    path: deploy/k8s/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
