apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ipop
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:HitterD/iPop-Integrated-Portal-for-Opertational-Performance-.git
    targetRevision: IT18/deploy-prod-k3s   # TEST PHASE; back to main once CI secrets exist
    path: deploy/k8s/apps/ipop
  destination:
    server: https://kubernetes.default.svc
    namespace: ipop
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  # CNPG fills in defaults (archive_mode, log_*, monitoring queries…) and the plugin "enabled" flag;
  # they are not drift. Only hides them from the OutOfSync status; our own values still apply.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .spec.postgresql.parameters
        - .spec.monitoring
        - .spec.plugins[].enabled
        - .spec.bootstrap.initdb.encoding
        - .spec.bootstrap.initdb.localeCType
        - .spec.bootstrap.initdb.localeCollate
