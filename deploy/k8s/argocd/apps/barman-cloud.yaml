apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.1
      helm:
        releaseName: barman-cloud
        valueFiles: [$values/deploy/k8s/values/barman-cloud.yaml]
    - repoURL: git@github.com:HitterD/iPop-Integrated-Portal-for-Opertational-Performance-.git
      targetRevision: IT18/deploy-prod-k3s   # TEST PHASE; back to main once CI secrets exist
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
