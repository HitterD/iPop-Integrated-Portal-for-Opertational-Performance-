apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.6
      helm:
        releaseName: argocd
        valueFiles: [$values/deploy/k8s/values/argocd.yaml]
    - repoURL: git@github.com:HitterD/iPop-Integrated-Portal-for-Opertational-Performance-.git
      targetRevision: IT18/deploy-prod-k3s   # TEST PHASE; back to main once CI secrets exist
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
