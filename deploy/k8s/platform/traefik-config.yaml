# k3s's bundled Traefik, tuned for iPop:
# - only Zoraxy (192.168.2.2) may set X-Forwarded-* (avoids the duplicate-header ONLYOFFICE error -4 we had on NPM)
# - client IPs preserved: Traefik on every node's own network (no ServiceLB NAT)
# - metrics for Prometheus, access log to Loki
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # One Traefik on every node, listening on the node's own ports 80/443 (hostNetwork). The VIP lands on a
    # node, and that node's Traefik sees the real client address — needed for the ICT-only dashboard rule
    # and the client IP in iPop's audit log. (k3s ServiceLB / klipper always NATs the source address.)
    deployment:
      kind: DaemonSet
    hostNetwork: true
    updateStrategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
    service:
      enabled: false
    securityContext:
      capabilities: { add: [NET_BIND_SERVICE], drop: [ALL] }
      runAsNonRoot: false
      runAsUser: 0
      readOnlyRootFilesystem: true
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    ports:
      metrics:
        port: 9101               # node_exporter already owns 9100 on the host network
      traefik:
        port: 8081               # keep 8080 free on the nodes
      web:
        port: 80
        forwardedHeaders:
          trustedIPs: ["192.168.2.2/32", "192.168.2.3/32"]
        transport:
          respondingTimeouts:
            readTimeout: 0        # long uploads (mail attachments up to 500 MB)
            writeTimeout: 0
            idleTimeout: 3600s    # SignalR / LiveKit websockets
      websecure:
        port: 443
        forwardedHeaders:
          trustedIPs: ["192.168.2.2/32", "192.168.2.3/32"]
        transport:               # same as web: Zoraxy must use this https upstream (see apps/ipop/ingress.yaml)
          respondingTimeouts:
            readTimeout: 0
            writeTimeout: 0
            idleTimeout: 3600s
    # No Service (hostNetwork): publish the node IPs on Ingress objects so Argo CD sees them as healthy.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
    additionalArguments:
      - "--providers.kubernetesingress.ingressendpoint.ip=192.168.2.89"
    logs:
      access:
        enabled: true
    metrics:
      prometheus:
        serviceMonitor:
          enabled: false      # no Service any more (hostNetwork); platform/monitors.yaml scrapes the pods
    # Each browser holds four SignalR WebSockets. The realistic 1,028-user ramp OOM-killed
    # the VIP node's Traefik at 256 MiB while API/DB remained healthy (2026-11-09).
    # Size for the concentrated VIP traffic, not an assumed one-third split over three pods.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
