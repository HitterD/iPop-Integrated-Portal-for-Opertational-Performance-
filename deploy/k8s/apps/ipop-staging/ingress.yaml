# Same routing as prod, on the staging host. LiveKit and ONLYOFFICE are prod's (namespace ipop).
# ExternalName is NOT usable here: the Traefik CRD provider rejects it ("externalName services not allowed"),
# which silently dropped the whole IngressRoute - /rtc fell through to the Web catch-all and calls, screen share
# and server recording could not work on staging. A headless Service plus an explicit EndpointSlice keeps the
# routes namespace-local without ExternalName.
apiVersion: v1
kind: Service
metadata: { name: livekit }
spec: { ports: [{ port: 7880, name: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: onlyoffice }
spec: { ports: [{ port: 80, name: http }] }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: livekit
  labels: { kubernetes.io/service-name: livekit }
addressType: IPv4
ports: [{ port: 7880, name: http, protocol: TCP }]
endpoints:
  - addresses: [10.43.18.46]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: onlyoffice
  labels: { kubernetes.io/service-name: onlyoffice }
addressType: IPv4
ports: [{ port: 80, name: http, protocol: TCP }]
endpoints:
  - addresses: [10.43.223.227]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: strip-onlyoffice }
spec: { stripPrefix: { prefixes: ["/onlyoffice"] } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: onlyoffice-headers }
spec: { headers: { customRequestHeaders: { X-Forwarded-Prefix: /onlyoffice } } }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: ipop-staging }
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`) && (PathPrefix(`/api`) || PathPrefix(`/hubs`) || PathPrefix(`/connect`) || Path(`/healthz`))
      priority: 100
      services: [{ name: ipop-api, port: 80 }]
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`) && PathPrefix(`/rtc`)
      priority: 100
      services: [{ name: livekit, port: 7880 }]
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`) && PathPrefix(`/onlyoffice`)
      priority: 100
      middlewares: [{ name: onlyoffice-headers }, { name: strip-onlyoffice }]
      services: [{ name: onlyoffice, port: 80 }]
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`)
      priority: 10
      services: [{ name: ipop-web, port: 80 }]
---
# Same routes over HTTPS. The Nutanix network between the VMs and the rest of the LAN silently drops
# plain-HTTP TCP streams that carry a Windows executable (e.g. the Notifier installer, an .exe mail
# attachment): the transfer stalls after ~128 KB and retransmits forever. TLS hides the payload, so the
# reverse proxy (Zoraxy) must use this https upstream. Measured 2026-11-09, see docs/deploy/k3s.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: ipop-staging-tls }
spec:
  entryPoints: [websecure]
  tls: {}                  # Traefik default certificate; Zoraxy talks to it with "skip TLS verify"
  routes:
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`) && (PathPrefix(`/api`) || PathPrefix(`/hubs`) || PathPrefix(`/connect`) || Path(`/healthz`))
      priority: 100
      services: [{ name: ipop-api, port: 80 }]
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`) && PathPrefix(`/rtc`)
      priority: 100
      services: [{ name: livekit, port: 7880 }]
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`) && PathPrefix(`/onlyoffice`)
      priority: 100
      middlewares: [{ name: onlyoffice-headers }, { name: strip-onlyoffice }]
      services: [{ name: onlyoffice, port: 80 }]
    - kind: Rule
      match: Host(`staging.192.168.2.89.nip.io`)
      priority: 10
      services: [{ name: ipop-web, port: 80 }]
