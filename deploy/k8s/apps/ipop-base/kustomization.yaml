# Shared by prod (../ipop) and staging (../ipop-staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - redis.yaml
  - config.yaml
  - storage.yaml
  - migrate-job.yaml
  - api.yaml
  - web.yaml
# Internal services (iDesk, NAS with SJA certs) are signed by SJA-ROOT-CA. Windows trusted it through the
# machine store; Linux containers need it explicitly (otherwise "PartialChain" on every iDesk call).
configMapGenerator:
  - name: sja-root-ca
    files: [sja-root-ca.crt]
generatorOptions:
  disableNameSuffixHash: true
