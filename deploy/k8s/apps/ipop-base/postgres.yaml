# PostgreSQL 17 by CloudNativePG: primary + 1 streaming replica on different nodes.
# If the primary's node dies, CNPG promotes the replica (~30 s) and service ipop-db-rw follows it.
# Local disks (local-path), not Longhorn: the replica already is the second copy.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ipop-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true          # restore + manual psql; password in secret ipop-db-superuser
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      timezone: "UTC"
      archive_timeout: "60s"
  bootstrap:
    initdb:
      database: ipop
      owner: ipop
      secret:
        name: ipop-db-app              # created by bootstrap/secrets.sh
  storage:
    storageClass: local-path
    size: 40Gi
  walStorage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 4Gi }
  # Ubuntu 26.04 (AppArmor 5): containerd's default profile denies signals between processes in the
  # same container (peer label "cri-containerd.apparmor.d//&unconfined"), and PostgreSQL's
  # postmaster/checkpointer talk by signals ("could not signal for checkpoint: Permission denied").
  # Only the database pods run unconfined; everything else keeps the default profile.
  # The rest is CNPG's own default pod security context, kept as is.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 26
    runAsGroup: 26
    fsGroup: 26
    seccompProfile: { type: RuntimeDefault }
    appArmorProfile: { type: Unconfined }
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # Default is 300 s: the primary's pod would stay "on" a dead node for 5 min before CNPG promotes
    # the replica. 10 s matches the API; measured failover then is the promotion itself (~20 s).
    tolerations:
      - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
      - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
  monitoring:
    enablePodMonitor: true
  # Continuous WAL archiving to S3 on the NAS (db-backup.yaml). archive_timeout caps the data a total
  # loss could cost at ~1 minute even when the database is quiet.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nas-s3
