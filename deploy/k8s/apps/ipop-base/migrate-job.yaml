# Runs EF migrations + reference seeds once per release (Argo CD Sync hook, wave 0): after the database,
# Redis and config (wave -2) are healthy and before the API rolls (wave 1). A failed migration stops
# the sync, so the old API keeps running on the old schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: ipop-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: ipop-migrate }
    spec:
      # Ubuntu 26.04 / AppArmor 5: containerd's default profile treats threads of one container as
      # different peers and denies signals between them. .NET suspends threads for GC with signals,
      # so the runtime aborted at random (general protection fault in libc abort). Unconfined fixes it.
      securityContext:
        appArmorProfile: { type: Unconfined }
      restartPolicy: Never
      imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: migrate
          image: ipop-api
          imagePullPolicy: IfNotPresent
          args: ["--migrate-only"]
          envFrom:
            - configMapRef: { name: ipop-api-env }
            - secretRef: { name: ipop-api-secrets }
            - secretRef: { name: ipop-api-integrations, optional: true }   # bootstrap/secrets-integrations.sh
          env:
            - { name: Workers__Outbound, value: "false" }
            # SSO setup reads its keys from the database while the app is being built; on a fresh,
            # unmigrated database that table does not exist yet. Migrations never need SSO.
            - { name: Oidc__Enabled, value: "false" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
