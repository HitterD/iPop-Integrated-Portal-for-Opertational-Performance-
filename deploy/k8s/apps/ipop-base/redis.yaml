# Redis for the SignalR backplane. It only relays live messages (nothing is stored), so a single
# pod is enough: if its node dies Kubernetes restarts it elsewhere in ~1 min and the clients reconnect.
# (Sentinel only pays off once the API runs several replicas; see docs/deploy/k3s/README.md.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels: { app.kubernetes.io/name: redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      tolerations:
        # Leave a dead node after 10 s instead of the default 5 min (measured: Redis stayed bound
        # to a dead node for ~5.5 min, taking SignalR realtime down with it).
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379, name: redis }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 384Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379, targetPort: redis, name: redis }]
