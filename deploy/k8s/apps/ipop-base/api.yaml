# iPop API: ONE replica on purpose. The code keeps presence, calls, SSO flows, Notifier pairing and
# ONLYOFFICE versions in memory and its ~25 background workers have no leader lock, so two copies
# would send mail twice and lose calls. Recreate = the old pod stops before the new one starts.
# High availability comes from Kubernetes moving the pod when a node dies (~1–2 min).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipop-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels: { app.kubernetes.io/name: ipop-api }
spec:
  replicas: 1
  strategy: { type: Recreate }
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: ipop-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ipop-api }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      terminationGracePeriodSeconds: 45   # host ShutdownTimeout is 25 s; leaves room for in-flight sends
      # Leave the media node to LiveKit when possible.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions: [{ key: ipop/media, operator: NotIn, values: ["true"] }]
      tolerations:
        # Leave a dead node after 10 s instead of the default 5 min.
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
      # Ubuntu 26.04 / AppArmor 5: containerd's default profile treats threads of one container as
      # different peers and denies signals between them. .NET suspends threads for GC with signals,
      # so the runtime aborted at random (general protection fault in libc abort). Unconfined fixes it.
      securityContext:
        fsGroup: 1654
        appArmorProfile: { type: Unconfined }
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: ipop-api
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: ipop-api-env }
            - secretRef: { name: ipop-api-secrets }
            - secretRef: { name: ipop-api-integrations, optional: true }   # bootstrap/secrets-integrations.sh
            - secretRef: { name: ipop-dp-cert-env, optional: true }         # DataProtection__KeyCertificatePassword
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: firebase, mountPath: /secrets/firebase, readOnly: true }
            # Certificate that encrypts the DataProtection key ring (secret ipop-dp-cert: dp.pfx + password).
            # Optional: without it the key ring stays unencrypted as before (the configured path is then missing).
            - { name: dp-cert, mountPath: /secrets/dp, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          # Liveness has no DB call (a DB failover must not restart the API) but fails when a background
          # worker died (WorkerWatchdog), so the pod restarts and the worker comes back.
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # 1 replica serves everyone (~1000 users): 4 GiB leaves headroom for SignalR connections and
            # Argon2 (HashGate caps it at 3 × 64 MB). Nodes have 15 GiB, ~6 GiB in use.
            requests: { cpu: "1", memory: 1536Mi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ipop-data }
        - name: firebase
          secret:
            secretName: ipop-firebase
            optional: true
        - name: dp-cert
          secret:
            secretName: ipop-dp-cert
            optional: true
            items: [{ key: dp.pfx, path: dp.pfx }]
---
apiVersion: v1
kind: Service
metadata:
  name: ipop-api
  labels: { app.kubernetes.io/name: ipop-api }
spec:
  selector: { app.kubernetes.io/name: ipop-api }
  ports: [{ port: 80, targetPort: http, name: http }]
