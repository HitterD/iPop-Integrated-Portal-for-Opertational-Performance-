# Runs EF migrations + reference seeds once per release (Argo CD Sync hook, wave 0): after the database,
# Redis and config (wave -2) are healthy and before the API rolls (wave 1). A failed migration stops
# the sync, so the old API keeps running on the old schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: ipop-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: ipop-migrate }
    spec:
      restartPolicy: Never
      imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: migrate
          image: ipop-api
          imagePullPolicy: IfNotPresent
          args: ["--migrate-only"]
          envFrom:
            - configMapRef: { name: ipop-api-env }
            - secretRef: { name: ipop-api-secrets }
            - secretRef: { name: ipop-api-integrations, optional: true }   # bootstrap/secrets-integrations.sh
          env:
            - { name: Workers__Outbound, value: "false" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
