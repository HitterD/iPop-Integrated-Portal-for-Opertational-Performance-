# iPop Web (Blazor WASM host): stateless, 2 replicas on different nodes, rolling update with no downtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipop-web
  labels: { app.kubernetes.io/name: ipop-web }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: ipop-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ipop-web }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: ipop-web }
      containers:
        - name: web
          image: ipop-web
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: ipop-web-env }
          volumeMounts:
            # Notifier installer + APK, read-only from the shared volume.
            - { name: data, mountPath: /data, readOnly: true }
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ipop-data, readOnly: true }
---
apiVersion: v1
kind: Service
metadata:
  name: ipop-web
  labels: { app.kubernetes.io/name: ipop-web }
spec:
  selector: { app.kubernetes.io/name: ipop-web }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ipop-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ipop-web }
