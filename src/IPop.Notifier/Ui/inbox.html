<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self' about:">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="files.css">
<link rel="stylesheet" href="inbox.css">
</head>
<body>
<!-- Small flyout (480×720): docs/mockups/notifier/priority.html screen 1 -->
<div id="small">
  <div class="ihead" id="ihead" data-drag>
    <span class="logo"><img src="ipop-mark.png" alt=""></span>
    <div class="ht"><h3>Notifications</h3><div class="s" data-unread-text>…</div></div>
    <div class="sbox" id="sbox" data-nodrag><button class="sbtn" title="Search"><i data-lucide="search"></i></button><input id="sq" placeholder="Search notifications" aria-label="Search notifications"><button class="sx" title="Close search"><i data-lucide="x"></i></button></div>
    <div class="tools">
      <button class="ib" data-all title="Mark all as read"><i data-lucide="check-check"></i></button>
      <button class="ib" data-gear title="Settings"><i data-lucide="settings"></i></button>
      <button class="ib" id="moreBtn" title="More" aria-haspopup="menu" aria-expanded="false"><i data-lucide="ellipsis"></i></button>
    </div>
    <!-- 1.5.1: Devices (ICT only) and Maximize live here; a double-click on the header still maximizes -->
    <div class="menu" id="moreMenu" role="menu" hidden>
      <button role="menuitem" data-maxitem><i data-lucide="maximize-2"></i><span>Maximize</span></button>
      <button role="menuitem" data-devices hidden><i data-lucide="monitor"></i><span>Devices (ICT)</span></button>
    </div>
  </div>
  <div class="strip" data-conn><i></i><span>Reconnecting to iPop… your notifications are safe</span></div>
  <div class="summary" id="summary"></div>
  <div class="chips slider" id="chips"><span class="thumb"></span>
    <button class="on" data-f="all">All <span class="badge g zero" data-count="all"></span></button>
    <button data-f="act">Needs action <span class="badge act zero" data-count="act"></span></button>
    <button data-f="msg">Messages <span class="badge g zero" data-count="msg"></span></button>
    <button data-f="info">Info <span class="badge g zero" data-count="info"></span></button>
  </div>
  <div class="ilist" id="smallList"></div>
  <div class="ifoot"><span class="sw" data-pt title="Popups"></span><span class="lbl" data-pt-label>Popups on</span><button class="btn g s" data-open><i data-lucide="arrow-up-right"></i>Open iPop</button></div>
</div>

<!-- Maximized (html.max): screen 2, three panes -->
<div id="wide">
  <div class="tbar" data-drag><div class="t"><img src="ipop-mark.png" alt="">iPop Notifier</div>
    <button class="tb" data-devices title="Devices (ICT)" hidden><i data-lucide="monitor"></i></button>
    <button class="tb" data-gear title="Settings"><i data-lucide="settings"></i></button>
    <button class="tb" data-min title="Minimize"><i data-lucide="minus"></i></button><button class="tb" data-max title="Restore"></button><button class="tb x" data-close title="Close"><i data-lucide="x"></i></button></div>
  <div class="wgrid" id="wgrid">
    <aside class="side">
      <div class="brand"><img src="ipop-mark.png" alt=""><div><b>Notifications</b><span data-unread-text>…</span></div></div>
      <div class="navlist slider" id="navlist"><span class="thumb"></span></div>
      <div class="foot"><span class="sw" data-pt title="Popups"></span><span data-pt-label>Popups on</span></div>
    </aside>
    <div class="lpane" id="lpane">
      <div class="ltool"><label class="search"><i data-lucide="search"></i><input id="wq" placeholder="Search notifications" aria-label="Search notifications"></label>
        <div class="seg slider" data-seg><span class="thumb"></span><button class="on" data-v="list"><i data-lucide="rows-3"></i>List</button><button data-v="table"><i data-lucide="table-2"></i>Table</button></div></div>
      <div class="strip" data-conn><i></i><span>Reconnecting to iPop… your notifications are safe</span></div>
      <div class="lhead"><h4 id="lTitle">Needs action</h4><span class="c" id="lCount"></span><button class="mk" data-all><i data-lucide="check-check"></i>Mark all read</button></div>
      <div class="ilist" id="wideList"></div>
      <div class="khint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>E</kbd> read · <kbd>S</kbd> snooze</div>
    </div>
    <div class="rpane" id="rpane"></div>
    <div class="tpane" id="tpane" hidden>
      <div class="ltool"><label class="search" style="max-width:420px"><i data-lucide="search"></i><input id="tq" placeholder="Search notifications" aria-label="Search notifications"></label><span style="flex:1"></span>
        <button class="mk" data-all><i data-lucide="check-check"></i>Mark all read</button>
        <div class="seg slider" data-seg><span class="thumb"></span><button data-v="list"><i data-lucide="rows-3"></i>List</button><button class="on" data-v="table"><i data-lucide="table-2"></i>Table</button></div></div>
      <div class="tscroll"><table id="ntable"></table></div>
    </div>
  </div>
</div>
<script src="lucide.min.js"></script>
<script src="bridge.js"></script>
<script src="tiers.js"></script>
<script src="inbox-model.js"></script>
<script src="files.js"></script>
<script src="inbox.js"></script>
</body>
</html>
