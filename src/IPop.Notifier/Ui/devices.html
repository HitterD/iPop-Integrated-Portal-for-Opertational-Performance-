<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="app.css">
<style>
/* ICT / Admin devices (mockup v2 §3). Remote help is phase 3: shown as "coming", not wired. */
body{display:flex;flex-direction:column}
.console{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0;animation:winIn .4s var(--spring)}
.left{border-right:.5px solid var(--sep);background:var(--glass-2);display:flex;flex-direction:column;min-height:0}
.left .h{padding:14px;display:flex;align-items:center;gap:8px;font-weight:700}
.left .h img{width:22px;height:22px;border-radius:6px}
.lock{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:#6f8290;padding:2px 8px;border-radius:999px}
.srch{margin:0 14px 10px;height:34px;border-radius:9px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--ink-3)}
.srch input{flex:1;border:0;background:none;outline:none;font-size:13px}
.cnt{padding:0 14px 8px;font-size:11.5px;color:var(--ink-3)}
.devs{flex:1;overflow:auto}
.dev{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-top:.5px solid var(--sep);transition:background .15s}
.dev:hover,.dev.on{background:var(--fill)}
.pc{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#6f8290;color:#fff;font-size:16px;flex:none;position:relative}
.pc i{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#34c759;box-shadow:0 0 0 2px var(--card)}
.pc i.off{background:var(--ink-4)}
.dev .m{min-width:0}
.dev b{display:block;font-size:13.5px}.dev small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{padding:18px 22px;overflow:auto}
.right h3{font-size:20px;margin-bottom:2px}
.sub{color:var(--ink-3);font-size:13px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13.5px;margin-bottom:16px}
.kv span:nth-child(odd){color:var(--ink-3)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{height:38px;padding:0 16px;border-radius:10px;background:var(--fill);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:transform .12s var(--spring)}
.acts button:active{transform:scale(.97)}
.acts button.p{background:var(--green);color:#fff}
.acts button:disabled{opacity:.5;cursor:default}
.note{margin-top:14px;font-size:12.5px;color:var(--ink-3)}
.empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
</style>
</head>
<body>
<div class="ttl" data-drag><span class="ic"><img src="ipop-mark.webp" alt=""></span><b>Devices</b><button class="wc" data-min></button><button class="wc x" data-close></button></div>
<div class="console">
  <div class="left">
    <div class="h"><img src="ipop-mark.webp" alt="">Devices<span class="lock">ICT only</span></div>
    <label class="srch">🔎<input id="q" placeholder="Search name, NIK, PC, IP…"></label>
    <div class="cnt" id="cnt"></div>
    <div class="devs" id="devs"></div>
  </div>
  <div class="right" id="detail"><div class="empty">Choose a computer</div></div>
</div>
<script src="bridge.js"></script>
<script src="devices.js"></script>
</body>
</html>
