<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="remote-kit.css">
<style>
/* Unattended access password (1.8.0, mockup ipop-remote-v2 prop-password / prop-password-wrong), 440×460. */
body{display:flex;flex-direction:column}
.dlgwin{flex:1;min-height:0}
.fld input{flex:1;width:0;min-width:0;border:0;background:none;outline:none;letter-spacing:.2em;font-size:19px}
.fld button{display:grid;place-items:center}
.row2.rem{cursor:pointer}
.ask{align-self:flex-start;color:var(--accent-ink);font-weight:650;font-size:13px;display:flex;gap:6px;align-items:center}
.dlgwin .acts button{display:flex;align-items:center;justify-content:center;gap:2px}
.dlgwin .acts button:disabled{opacity:.6;cursor:default}
</style>
<link rel="stylesheet" href="remote-v3.css">
<link rel="stylesheet" href="remote-password-v3.css">
</head>
<body>
<div class="ttl" data-drag><span class="logo"><img src="ipop-mark.png" alt=""></span><b>iPop Notifier: Remote</b><button class="wc x" data-close title="Close"></button></div>
<div class="dlgwin"><div class="body"><div class="ic" id="ic"><i data-lucide="key-round"></i></div><h3 id="title">Enter access password</h3>
<p id="text"></p>
<label class="fld f" id="fld"><i data-lucide="lock"></i><input type="password" id="pw" maxlength="200" autocomplete="off"><button type="button" id="eye" title="Show password"><i data-lucide="eye"></i></button></label>
<div class="row2 rem" id="remember"><span class="cb"><i data-lucide="check"></i></span>Remember for this session</div><div class="row2" style="color:var(--ink-3)"><i data-lucide="scroll-text"></i><span id="logged">This connection is logged</span></div>
<div class="acts"><button id="cancel">Cancel</button><button class="p" id="go"><i data-lucide="screen-share"></i>Connect</button></div>
<button class="ask" id="askUser"><i data-lucide="bell-ring"></i>Ask the user instead</button></div></div>
<script src="lucide.min.js"></script>
<script src="bridge.js"></script>
<script src="remote-password.js"></script>
</body>
</html>
