<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="app.css">
<style>
/* First start (mockup v1 §8 left) */
html,body{overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 0%,#1a4a37 0%,#123528 60%,#0d2a1f 100%);color:#fff;display:flex;flex-direction:column}
/* iPop's gold batik kopi on the forest green (same tile as the sidebar/topbar, IPop.Web friendly.css),
   strongest round the edges and calm behind the form. */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background:url("batik.svg") 0 0 / 54px 54px repeat;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 48%,transparent 0,rgba(0,0,0,.35) 55%,#000 100%);
          mask-image:radial-gradient(ellipse 70% 60% at 50% 48%,transparent 0,rgba(0,0,0,.35) 55%,#000 100%)}
form{padding:20px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 24px 50px -24px rgba(0,0,0,.6);backdrop-filter:blur(14px)}
.bar{height:36px;display:flex;justify-content:flex-end;padding:2px 2px 0;flex:none}
.bar .wc{color:rgba(255,255,255,.7)}
.bar .wc:hover{background:rgba(255,255,255,.12)}
.box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:0 30px 24px;overflow:hidden auto;min-height:0;scrollbar-width:none;animation:winIn .5s var(--spring)}
.lg{width:84px;height:84px;position:relative;flex:none;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.6);animation:popIn .6s var(--pop) both}
.lg img{width:60px;height:60px}
h4{font-size:26px;margin:16px 0 4px;position:relative}
p{position:relative;opacity:.8;font-size:14.5px;margin-bottom:18px;text-align:center;line-height:1.45}
form{width:340px;display:flex;flex-direction:column;gap:12px}
input{height:48px;border-radius:12px;font-size:15px !important;border:0;background:rgba(255,255,255,.12);color:#fff;padding:0 14px;outline:none;font-size:14px;transition:background .2s,box-shadow .2s}
input:focus{background:rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
input::placeholder{color:rgba(255,255,255,.55)}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.85;cursor:pointer}
.chk .sw{transform:scale(.8)}
.go{height:48px;border-radius:12px;background:#fff;color:#123528;font-weight:700;font-size:15px;transition:transform .15s var(--spring),opacity .2s}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.6}
.err{min-height:18px;font-size:12.5px;color:#ffb4ab;text-align:center}
.err.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
small{position:relative;margin-top:18px;opacity:.6;font-size:12px;text-align:center;max-width:300px;line-height:1.45}
.box::-webkit-scrollbar{display:none}
.adv{margin-top:8px;font-size:11.5px;opacity:.5;cursor:pointer;text-decoration:underline}
#server{display:none}
.showsrv #server{display:block}
</style>
</head>
<body>
<div class="bar" data-drag><button class="wc" data-min></button><button class="wc x" data-close></button></div>
<div class="box" data-drag>
  <div class="lg"><img src="ipop-mark.webp" alt=""></div>
  <h4>iPop Notifier</h4>
  <p>Sign in once with your employee ID.<br>Notifications from iPop and iDesk in one place.</p>
  <form id="f" autocomplete="off">
    <input id="nik" placeholder="Employee ID (NIK)" inputmode="numeric" autofocus>
    <input id="pw" type="password" placeholder="iPop password">
    <input id="server" placeholder="Server address">
    <label class="chk"><span class="sw on" id="auto"></span>Start with Windows</label>
    <div class="err" id="err"></div>
    <button class="go" id="go">Sign in</button>
  </form>
  <small>You stay signed in. iDesk and other company apps open without asking again.</small>
  <span class="adv" id="adv">Server…</span>
</div>
<script src="lucide.min.js"></script>
<script src="bridge.js"></script>
<script src="signin.js"></script>
</body>
</html>
