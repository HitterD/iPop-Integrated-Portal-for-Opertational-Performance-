<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'>
<defs>
  <!-- A natural coffee bean: rounded ends, one side a touch fuller, soft S crease that stops short of the tips. -->
  <path id='shape' d='M-15.5 0.4C-15.5-6 -8.8-9.6 0.4-9.6C9.4-9.6 15.5-5.6 15.5 0.2C15.5 6 9 9.2 -0.2 9.2C-9 9.2 -15.5 6.4 -15.5 0.4Z'/>
  <path id='crease' d='M-10.5 1.1C-6.5-1.9 -2.6 2.6 1.4 0.3C4.8-1.6 8 -1.3 10.6-0.2'/>
  <g id='link' fill='none' stroke='#e3ad3c' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'>
    <use href='#shape'/><use href='#crease'/>
  </g>
  <mask id='cut' maskUnits='userSpaceOnUse' x='-17' y='-11' width='34' height='22'>
    <rect x='-17' y='-11' width='34' height='22' fill='#fff'/>
    <use href='#crease' fill='none' stroke='#000' stroke-width='2.4' stroke-linecap='round'/>
  </mask>
  <g id='bean'><use href='#shape' fill='#e3ad3c' mask='url(#cut)' transform='scale(.56)'/></g>
  <g id='knot'><circle r='3.4' fill='none' stroke='#e3ad3c' stroke-width='1.4'/><circle r='1.2' fill='#e3ad3c'/></g>
</defs>
<use href='#link' transform='translate(20 20) rotate(45)'/>
<use href='#link' transform='translate(60 20) rotate(-45)'/>
<use href='#link' transform='translate(20 60) rotate(-45)'/>
<use href='#link' transform='translate(60 60) rotate(45)'/>
<use href='#bean' transform='translate(40 0) rotate(-12)'/><use href='#bean' transform='translate(40 80) rotate(-12)'/>
<use href='#bean' transform='translate(0 40) rotate(78)'/><use href='#bean' transform='translate(80 40) rotate(78)'/>
<use href='#knot' transform='translate(40 40)'/>
<use href='#knot'/><use href='#knot' transform='translate(80 0)'/><use href='#knot' transform='translate(0 80)'/><use href='#knot' transform='translate(80 80)'/>
</svg>
