<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'>
<defs>
  <!-- Outlined bean link: lens outline with an S crease, like the chain on the shirt. -->
  <g id='link' fill='none' stroke='#e3ad3c' stroke-width='1.7' stroke-linecap='round'>
    <path d='M-17 0C-11-9 11-9 17 0C11 9-11 9-17 0Z'/>
    <path d='M-12 1.2C-6-3.2-2 3.6 3 0S9-2.4 12-0.6'/>
  </g>
  <!-- Solid bean with its crease cut out. -->
  <mask id='cr' maskUnits='userSpaceOnUse' x='-11' y='-8' width='22' height='16'>
    <rect x='-11' y='-8' width='22' height='16' fill='#fff'/>
    <path d='M-8.5 0.7C-5-2.4-2 2.6 1.5-0.3S6-1.6 8.5-0.2' fill='none' stroke='#000' stroke-width='1.6' stroke-linecap='round'/>
  </mask>
  <ellipse id='bean' rx='8.6' ry='6' fill='#e3ad3c' mask='url(#cr)'/>
  <!-- Knot where links meet. -->
  <g id='knot'><circle r='3.6' fill='none' stroke='#e3ad3c' stroke-width='1.5'/><circle r='1.3' fill='#e3ad3c'/></g>
</defs>
<use href='#link' transform='translate(20 20) rotate(45)'/>
<use href='#link' transform='translate(60 20) rotate(-45)'/>
<use href='#link' transform='translate(20 60) rotate(-45)'/>
<use href='#link' transform='translate(60 60) rotate(45)'/>
<use href='#bean' transform='translate(40 0)'/><use href='#bean' transform='translate(40 80)'/>
<use href='#bean' transform='translate(0 40) rotate(90)'/><use href='#bean' transform='translate(80 40) rotate(90)'/>
<use href='#knot' transform='translate(40 40)'/>
<use href='#knot' transform='translate(0 0)'/><use href='#knot' transform='translate(80 0)'/>
<use href='#knot' transform='translate(0 80)'/><use href='#knot' transform='translate(80 80)'/>
</svg>
