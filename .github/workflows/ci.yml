name: CI

# Tests on every PR and push to main. deploy.yml builds images only after this passes on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fake_utc:
        description: "UTC start time for the test clock (HH:MM:SS today); default 05:00:00 = 12:00 WIB"
        required: false
        default: "05:00:00"
  workflow_call:
    secrets:
      DEVEXPRESS_NUGET_FEED:
        required: true
      DEVEXPRESS_LICENSE:
        required: true

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET tests
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
      DOTNET_NOLOGO: "1"
      # DevExpress reads its license from this variable at build time.
      DevExpress_License: ${{ secrets.DEVEXPRESS_LICENSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fonts for DevExpress PDF rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1 libfreetype6 fonts-dejavu-core fonts-liberation
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: DevExpress package feed
        env:
          DX_FEED: ${{ secrets.DEVEXPRESS_NUGET_FEED }}
        run: |
          if [ -z "$DX_FEED" ]; then echo "::error::Secret DEVEXPRESS_NUGET_FEED is not set (see docs/deploy/k3s/03-github-secrets.md)"; exit 1; fi
          dotnet nuget add source "$DX_FEED" -n devexpress
      - name: Fake clock for the tests (libfaketime)
        run: sudo apt-get install -y -qq faketime
      - name: Build
        run: dotnet build tests/IPop.Tests/IPop.Tests.csproj -c Release
      # Room bookings follow the same-office-day rule (WIB), and many tests book "now + N minutes". Pushed between
      # ~22:00 and 01:00 WIB those cross midnight and CI went red. The test process starts at a fixed time of day
      # (12:00 WIB by default, away from the hour edges tests book on) and then runs normally; the build above keeps the real clock.
      - name: Test
        env:
          FAKE_UTC: ${{ inputs.fake_utc || '05:00:00' }}
        run: |
          # Only the test host gets the fake clock (relative offset): preloading it into vstest.console as well broke
          # the console <-> testhost handshake.
          off=$(( $(date -u -d "$(date -u +%F) $FAKE_UTC" +%s) - $(date -u +%s) ))
          cat > faketime.runsettings <<XML
          <RunSettings><RunConfiguration><EnvironmentVariables>
            <LD_PRELOAD>/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1</LD_PRELOAD>
            <FAKETIME>$(printf "%+d" "$off")</FAKETIME>
            <FAKETIME_DONT_FAKE_MONOTONIC>1</FAKETIME_DONT_FAKE_MONOTONIC>
            <DONT_FAKE_MONOTONIC>1</DONT_FAKE_MONOTONIC>
            <NO_FAKE_STAT>1</NO_FAKE_STAT>
          </EnvironmentVariables></RunConfiguration></RunSettings>
          XML
          echo "Test host clock offset: ${off}s (starts at $FAKE_UTC UTC)"
          dotnet test tests/IPop.Tests/IPop.Tests.csproj -c Release --no-build --settings faketime.runsettings

  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run node tests
        run: |
          set -e
          for f in tests/*.test.cjs tests/*.test.mjs; do echo "== $f"; node "$f"; done
