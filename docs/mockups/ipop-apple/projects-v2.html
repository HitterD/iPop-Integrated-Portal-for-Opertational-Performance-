<meta charset="utf-8">
<title>iPop Projects v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed app frame (like the Whiteboard) inside a mockup stage; iPop menu + project list slide away in full screen. */
:root{
  --frame:#173a2c;--frame-2:#21493a;--frame-ink:#e9f1ec;--frame-ink-2:#a8c0b3;
  --canvas:#f3f2ee;--surface:#fff;--surface-2:#faf9f7;--surface-3:#f1efea;--line:#ebe8e3;--line-2:#dcd8d0;
  --ink:#1c1f23;--ink-2:#5b636b;--ink-3:#8b9198;--accent:#2e9d6b;--accent-soft:#e3f4eb;--on-accent:#fff;
  --danger:#d8452e;--danger-soft:#fdeeea;--warn:#b97f05;--warn-soft:#fdf5e2;--info:#2f6fed;--info-soft:#ecf2ff;--violet:#7c4dd6;--violet-soft:#f1ebfd;
  --s-todo:#b9bcc0;--s-doing:#fdab3d;--s-stuck:#e2445c;--s-review:#579bfc;--s-done:#00c875;--s-wait:#a25ddc;
  --wknd:rgba(28,31,35,.035);--freeze:rgba(124,77,214,.07);--scrim:rgba(15,22,18,.36);
  --sh-pop:0 18px 44px -14px rgba(20,24,22,.28),0 2px 6px rgba(20,24,22,.06);--sh-card:0 1px 2px rgba(20,24,22,.05),0 4px 14px -6px rgba(20,24,22,.08);
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --frame:#0c1d16;--frame-2:#163126;--frame-ink:#e3ece7;--frame-ink-2:#8fa79a;
  --canvas:#15181b;--surface:#1e2225;--surface-2:#23272b;--surface-3:#2a2f33;--line:#2e3338;--line-2:#3b4147;
  --ink:#eceef0;--ink-2:#a9b0b7;--ink-3:#7d848b;--accent:#45c486;--accent-soft:rgba(69,196,134,.15);--on-accent:#06150d;
  --danger:#ff7a63;--danger-soft:rgba(255,122,99,.13);--warn:#e7b44a;--warn-soft:rgba(231,180,74,.14);--info:#7aa7ff;--info-soft:rgba(122,167,255,.14);--violet:#b69cff;--violet-soft:rgba(182,156,255,.14);
  --s-todo:#6d7379;--wknd:rgba(255,255,255,.03);--freeze:rgba(182,156,255,.08);--scrim:rgba(0,0,0,.5);
  --sh-pop:0 18px 44px -14px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);--sh-card:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --frame:#0c1d16;--frame-2:#163126;--frame-ink:#e3ece7;--frame-ink-2:#8fa79a;
  --canvas:#15181b;--surface:#1e2225;--surface-2:#23272b;--surface-3:#2a2f33;--line:#2e3338;--line-2:#3b4147;
  --ink:#eceef0;--ink-2:#a9b0b7;--ink-3:#7d848b;--accent:#45c486;--accent-soft:rgba(69,196,134,.15);--on-accent:#06150d;
  --danger:#ff7a63;--danger-soft:rgba(255,122,99,.13);--warn:#e7b44a;--warn-soft:rgba(231,180,74,.14);--info:#7aa7ff;--info-soft:rgba(122,167,255,.14);--violet:#b69cff;--violet-soft:rgba(182,156,255,.14);
  --s-todo:#6d7379;--wknd:rgba(255,255,255,.03);--freeze:rgba(182,156,255,.08);--scrim:rgba(0,0,0,.5);
  --sh-pop:0 18px 44px -14px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);--sh-card:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- mockup chrome ---------- */
.mk{position:sticky;top:env(safe-area-inset-top,0px);z-index:200;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mk b{margin-right:6px;font-size:14px}
.mk .grp-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 2px 0 8px}
.mk button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;transition:transform .14s var(--ease),background .2s,color .2s,border-color .2s}
.mk button:hover{background:var(--surface-3)}
.mk button:active{transform:scale(.95)}
.mk button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mk .sp{flex:1}
.stage{padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.scroller{width:min(1680px,100%);overflow-x:auto;border-radius:18px}
.capwrap{padding-block:6px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:12px;margin:0 auto;width:min(1680px,100%);color:var(--ink-2);font-size:13px}
.cap>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;min-width:0;animation:rise .4s var(--ease) backwards}
.cap>div:nth-child(2){animation-delay:.04s}.cap>div:nth-child(3){animation-delay:.08s}.cap>div:nth-child(4){animation-delay:.12s}
.cap h3{margin:0 0 5px;font-size:13.5px;color:var(--ink);text-wrap:balance}
.cap .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.cap .tag.try{background:var(--info-soft);color:var(--info)}.cap .tag.idea{background:var(--violet-soft);color:var(--violet)}.cap .tag.skip{background:var(--surface-3);color:var(--ink-3)}
.cap ul{margin:4px 0 0;padding-left:18px}.cap li{margin:2px 0}
.cap.hide{display:none}

/* ---------- animations ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}}
@keyframes popc{from{opacity:0;transform:scale(.96)}}
@keyframes flash{0%{filter:brightness(1.35) saturate(1.2);transform:scale(.96)}60%{transform:scale(1.02)}100%{filter:none;transform:none}}
@keyframes burst{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-done) 70%,transparent)}to{box-shadow:0 0 0 14px transparent}}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
@keyframes slideup{from{transform:translate(-50%,16px);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes strike{from{width:0}to{width:100%}}
.rise{animation:rise .38s var(--ease) backwards}
.flash{animation:flash .5s var(--spring)}
.burst{animation:burst .7s var(--ease)}

/* ---------- app frame ---------- */
.app{--sbw:208px;--rw:236px;position:relative;display:grid;grid-template-columns:var(--sbw) var(--rw) minmax(0,1fr);height:max(660px,calc(100vh - 128px));min-width:1180px;
  background:var(--frame);border-radius:18px;overflow:hidden;box-shadow:var(--sh-pop);border:1px solid var(--line);transition:grid-template-columns .5s var(--smooth)}
.app.fs{--sbw:0px;--rw:0px}
.app.fs.railon{--rw:236px}
.side{min-width:0;overflow:hidden;padding:16px 0 12px 12px;color:var(--frame-ink);display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;padding:0 8px 14px}
.lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4cc98a,#1f7a53);display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.side h6{margin:12px 10px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--frame-ink-2);font-weight:650}
.si{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:11px 0 0 11px;font-size:14px;color:var(--frame-ink);transition:background .15s,transform .15s var(--ease)}
.si:hover{background:var(--frame-2);transform:translateX(2px)}
.si.on{background:var(--canvas);color:var(--ink);font-weight:700}
.si.on svg{color:var(--accent)}
.si .n{margin-left:auto;margin-right:12px;font-size:11px;background:rgba(255,255,255,.14);padding:0 7px;border-radius:9px}
.prail{min-width:0;overflow:hidden;background:var(--surface-2);border-right:1px solid var(--line)}
.prail-in{width:236px;padding:14px 10px;display:flex;flex-direction:column;gap:2px;height:100%;overflow:auto}
.content{min-width:0;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden;position:relative}
.search{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);font-size:12.5px;min-width:0;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px}
.prail h6{margin:12px 8px 4px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:650;display:flex}
.prail h6 span{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none}
.pi{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--ink-2);transition:background .15s;cursor:pointer;white-space:nowrap}
.pi:hover{background:var(--surface-3)}
.pi.on{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:var(--sh-card)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.pi .pc{margin-left:auto;font-size:11px;color:var(--ink-3)}
.railbtn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:13px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.railbtn.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.railbtn .bd{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;border-radius:9px;padding:0 6px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;white-space:nowrap;transition:transform .14s var(--ease),background .15s,box-shadow .2s,filter .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}
.btn.pri:hover{filter:brightness(1.07);box-shadow:0 4px 14px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm.icon{width:28px}
.btn .badge{background:var(--accent-soft);color:var(--accent);font-size:11px;border-radius:7px;padding:0 6px;font-weight:700}
.av{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--c);border:2px solid var(--surface);margin-left:-6px;flex:none;transition:margin .25s var(--spring)}
.av:first-child{margin-left:0}
.avs{display:flex}
.avs:hover .av:not(:first-child){margin-left:-1px}
.av.sm{width:24px;height:24px;font-size:9.5px;border-width:0;margin:0 1px;border-radius:7px}
.av.xs{width:20px;height:20px;font-size:8.5px;border-width:0;margin:0;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);border:1px solid transparent;background:none;white-space:nowrap;transition:background .15s,transform .14s var(--ease)}
.chip:hover{background:var(--surface-3)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--info-soft);color:var(--info);font-weight:600}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--surface-3);border-radius:9px;position:relative}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;font-size:12px;color:var(--ink-2);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--ink);font-weight:650}
.seg .knob{position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.1);transition:left .3s var(--smooth),width .3s var(--smooth)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);background:none;border:0;padding:0 4px;white-space:nowrap}
.tog i{width:30px;height:18px;border-radius:9px;background:var(--line-2);position:relative;transition:background .25s;flex:none}
.tog i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .3s var(--spring);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on i{background:var(--accent)}.tog.on i::after{left:14px}
.cb{width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:5px;background:var(--surface);display:inline-grid;place-items:center;padding:0;flex:none;transition:background .2s,border-color .2s,transform .2s var(--spring)}
.cb:hover{border-color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent);transform:scale(1.06)}
.cb.on::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- project header ---------- */
.ph{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px 0}
.crumb{font-size:12px;color:var(--ink-3);display:flex;gap:5px;align-items:center;min-height:28px}
.crumb>button:not(.btn){border:0;background:none;padding:0;color:var(--ink-3)}
.crumb>button:not(.btn):hover{color:var(--ink)}
.titlerow{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.titlerow h1{margin:0;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;border:0;white-space:nowrap;transition:background .3s,color .3s,transform .15s var(--spring)}
.health:active{transform:scale(.94)}
.health i{width:7px;height:7px;border-radius:50%;background:currentColor}
.health.h0{background:var(--accent-soft);color:var(--accent)}.health.h1{background:var(--warn-soft);color:var(--warn)}.health.h2{background:var(--danger-soft);color:var(--danger)}
.sp{flex:1}
.progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.pbar-big{width:240px;height:7px;border-radius:9px;background:var(--surface-3);overflow:hidden;display:flex;flex:none}
.pbar-big i{display:block;height:100%;transition:width .6s var(--smooth)}
.vtabs{display:flex;align-items:flex-end;gap:2px;position:relative;overflow-x:auto;scrollbar-width:none}
.vt{display:flex;align-items:center;gap:7px;padding:8px 12px 10px;font-size:13px;color:var(--ink-2);position:relative;border:0;background:none;border-radius:8px 8px 0 0;white-space:nowrap;transition:color .15s,background .15s}
.vt:hover{color:var(--ink);background:var(--surface-3)}
.vt.on{color:var(--ink);font-weight:650}
.vt.on svg{color:var(--accent)}
.vt.add{color:var(--accent);font-weight:650}
.vt.add.open{background:var(--accent-soft)}
.vt.newtab{animation:pop .45s var(--spring)}
.tab-ind{position:absolute;bottom:0;height:2.5px;border-radius:2px;background:var(--accent);transition:left .35s var(--smooth),width .35s var(--smooth)}
.fsbtn .kbd{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:0 4px;margin-left:2px}

/* ---------- toolbar + body ---------- */
.tb{display:flex;align-items:center;gap:6px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;scrollbar-width:none}
.tb .search{flex:0 0 210px}
.pv{flex:1;display:flex;flex-direction:column;min-height:0}
.pv.in{animation:fade .25s var(--ease)}
.body{flex:1;overflow:auto;padding:14px 20px 90px}

/* ---------- table ---------- */
.grp{margin-bottom:18px}
.gh{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-weight:700;font-size:15px;border:0;background:none;padding:2px 4px;border-radius:7px;color:var(--gc)}
.gh:hover{background:var(--surface-3)}
.gh .cv{transition:transform .3s var(--smooth)}
.grp.collapsed .gh .cv{transform:rotate(-90deg)}
.gh small{font-weight:500;color:var(--ink-3);font-size:12px}
.gbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s var(--smooth),opacity .3s}
.grp.collapsed .gbody{grid-template-rows:0fr;opacity:.3}
.gbody>div{overflow:hidden;min-height:0}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-card)}
.row,.sumrow{display:grid;grid-template-columns:6px 34px minmax(240px,1fr) 92px 132px 104px 150px 84px 112px 38px;align-items:stretch}
.row{border-bottom:1px solid var(--line);min-height:40px;transition:background .15s}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--info-soft)}
.row>div{display:flex;align-items:center;padding:0 10px;border-left:1px solid var(--line);min-width:0}
.row>div:nth-child(1),.row>div:nth-child(2){border-left:0;padding:0}
.row>div:nth-child(2){justify-content:center}
.row.head{min-height:34px;background:var(--surface-2)}
.row.head>div{font-size:11.5px;color:var(--ink-3);font-weight:650;justify-content:center}
.row.head>div:nth-child(3){justify-content:flex-start}
.tname{gap:8px;justify-content:space-between;cursor:pointer}
.tname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname .meta{display:flex;gap:8px;color:var(--ink-3);font-size:11.5px;align-items:center;flex:none}
.tname .meta span{display:inline-flex;gap:3px;align-items:center}
.tname .meta svg{width:13px;height:13px}
.tname .open{opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .2s var(--ease);color:var(--ink-2);display:inline-flex;align-items:center;gap:3px;font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;background:var(--surface)}
.row:hover .tname .open{opacity:1;transform:none}
.cell-c{justify-content:center}
.row>div.stc{padding:0;overflow:hidden}
.st{width:100%;height:100%;min-height:40px;border:0;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px;white-space:nowrap;transition:filter .15s,background .3s}
.st:hover{filter:brightness(1.08)}
.st.todo,.pill.todo{background:var(--s-todo)}.st.doing,.pill.doing{background:var(--s-doing)}.st.stuck,.pill.stuck{background:var(--s-stuck)}.st.review,.pill.review{background:var(--s-review)}.st.done,.pill.done{background:var(--s-done)}.st.wait,.pill.wait{background:var(--s-wait)}
.pill{display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:11.5px;height:24px;padding:0 10px;border-radius:7px;white-space:nowrap;border:0;flex:none}
.due{gap:5px;white-space:nowrap;justify-content:center}
.row.late .due{color:var(--danger);font-weight:600}
.tl{width:100%;height:20px;border-radius:10px;background:var(--surface-3);overflow:hidden;position:relative;font-size:11px;display:grid;place-items:center;font-weight:600;color:var(--ink-2)}
.tl i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;opacity:.35}
.tl span{position:relative}
.pri-p{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.p-h{background:var(--danger-soft);color:var(--danger)}.p-m{background:var(--warn-soft);color:var(--warn)}.p-l{background:var(--info-soft);color:var(--info)}
.pbar{width:100%;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.pbar b{flex:1;height:6px;border-radius:9px;background:var(--surface-3);position:relative;overflow:hidden}
.pbar b i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:9px;transition:width .6s var(--smooth)}
.pbar span{width:32px;text-align:right}
.addrow{display:grid;grid-template-columns:6px 34px 1fr;min-height:38px;border-bottom:1px solid var(--line)}
.addrow input{border:0;outline:0;background:none;padding:0 10px;font-size:13px;color:var(--ink)}
.addrow input::placeholder{color:var(--ink-3)}
.addrow:focus-within{background:var(--surface-2)}
.sumrow{min-height:32px;background:var(--surface-2)}
.sumrow>div{display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:var(--ink-3)}
.dist{width:100%;height:16px;border-radius:5px;overflow:hidden;display:flex}
.dist i{display:block;height:100%;transition:width .5s var(--smooth)}
.sub .tname .t{padding-left:22px;color:var(--ink-2)}
.colplus{justify-content:center;color:var(--ink-3)}
.colplus button{border:0;background:none;color:var(--ink-3);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;transition:background .15s,transform .25s var(--spring)}
.colplus button:hover{background:var(--surface-3);color:var(--accent);transform:rotate(90deg)}

/* ---------- popovers / toasts / panel ---------- */
.pop{position:absolute;z-index:160;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-pop);animation:pop .3s var(--spring);transform-origin:top left}
.stpop{width:220px;padding:8px;display:flex;flex-direction:column;gap:5px}
.stpop .pill{height:32px;border-radius:9px;font-size:13px;width:100%;transition:transform .15s var(--spring),filter .15s}
.stpop .pill:hover{transform:scale(1.03);filter:brightness(1.06)}
.stpop .pill.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink-3)}
.stpop .edit{border:0;background:none;color:var(--ink-2);font-size:12.5px;padding:6px;border-radius:8px;display:flex;gap:6px;align-items:center;justify-content:center;border-top:1px solid var(--line);margin-top:3px}
.stpop .edit:hover{color:var(--accent)}
.colpop{width:300px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.colpop h5,.menu h5{grid-column:1/-1;margin:2px 4px 6px;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.mi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:0;background:none;font-size:13px;text-align:left;transition:background .12s}
.mi:hover{background:var(--surface-3)}
.mi .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
.mi .ic svg{width:13px;height:13px}
.menu{width:240px;padding:6px;display:flex;flex-direction:column}
.vp{width:660px;padding:12px;transform-origin:top right}
.vp .opts{display:flex;gap:16px;margin:10px 4px 4px;font-size:12.5px;color:var(--ink-2)}
.vp .opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.vp h5{margin:14px 6px 6px;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.vo{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;border:0;background:none;text-align:left;transition:background .12s,transform .15s var(--ease),opacity .2s}
.vo:hover{background:var(--surface-3)}
.vo:active{transform:scale(.97)}
.vo .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;transition:transform .25s var(--spring)}
.vo:hover .ic{transform:rotate(-6deg) scale(1.08)}
.vo .ic svg{width:15px;height:15px}
.vo b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.vo small{font-size:11.5px;color:var(--ink-3);display:block;line-height:1.25}
.new{font-size:9.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;letter-spacing:.03em}
.p2{font-size:9.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);border-radius:5px;padding:0 5px}
.vo.added{opacity:.55}
.vo.hidden{display:none}
.vp .hint{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:170;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-pop);border-radius:14px;padding:11px 12px 11px 14px;display:flex;gap:12px;align-items:center;max-width:680px;animation:slideup .4s var(--spring);font-size:13px}
.toast .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.toast.warn .ic{background:var(--warn-soft);color:var(--warn)}
.toast p{margin:0;flex:1;color:var(--ink-2)}
.toast p b{color:var(--ink)}
.toast.out{opacity:0;transform:translate(-50%,10px);transition:opacity .25s,transform .25s}
.bulk{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:110;background:var(--ink);color:var(--surface);border-radius:14px;padding:6px 6px 6px 14px;display:flex;gap:4px;align-items:center;box-shadow:var(--sh-pop);animation:slideup .35s var(--spring);font-size:13px}
.bulk b{margin-right:8px}
.bulk button{border:0;background:none;color:inherit;padding:6px 10px;border-radius:9px;display:flex;gap:6px;align-items:center;font-size:12.5px;opacity:.9}
.bulk button:hover{background:rgba(127,127,127,.25);opacity:1}
.tip{position:absolute;z-index:130;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;box-shadow:var(--sh-pop);animation:fade .15s;max-width:280px}
.tip b{display:block;font-size:12.5px}
.tip span{opacity:.75}
.panel{position:absolute;top:0;right:0;bottom:0;width:480px;z-index:90;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-pop);display:flex;flex-direction:column;animation:slidein .4s var(--smooth)}
.panel-h{padding:14px 18px 0;border-bottom:1px solid var(--line)}
.panel-h .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.panel-h h2{margin:6px 0 10px;font-size:18px;line-height:1.3;text-wrap:balance}
.ptabs{display:flex;gap:2px;position:relative}
.panel-b{flex:1;overflow:auto;padding:14px 18px 30px;display:flex;flex-direction:column;gap:16px}
.kvs{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center;font-size:13px}
.kvs>span:nth-child(odd){color:var(--ink-3);font-size:12.5px}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.sec h4 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink-2)}
.cl{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;font-size:13px;position:relative}
.cl:hover{background:var(--surface-2)}
.cl .tx{position:relative}
.cl.done .tx{color:var(--ink-3)}
.cl.done .tx::after{content:"";position:absolute;left:0;top:50%;height:1.5px;background:var(--ink-3);width:100%;animation:strike .35s var(--ease)}
.dep{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:6px}
.dep .k{font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);padding:0 6px;border-radius:6px;white-space:nowrap}
.timer{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.timer .clock{font-size:20px;font-weight:700;letter-spacing:-.01em}
.run{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;display:inline-block;margin-right:5px}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fthumb{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:11.5px;display:flex;flex-direction:column;gap:6px;background:var(--surface);cursor:pointer;min-width:0;transition:transform .2s var(--ease),box-shadow .2s}
.fthumb:hover{transform:translateY(-2px);box-shadow:var(--sh-card)}
.fthumb .th{height:58px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.upd{display:flex;gap:10px;font-size:13px}
.upd .bub{background:var(--surface-2);border-radius:4px 12px 12px 12px;padding:9px 11px;flex:1}
.upd .bub small{color:var(--ink-3);font-size:11.5px}
.mention{color:var(--info);font-weight:600}
.react{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line-2);border-radius:999px;padding:0 7px;font-size:12px;background:var(--surface);margin-top:6px;transition:transform .2s var(--spring),background .2s}
.react.on{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.react:active{transform:scale(1.15)}
.composer{border:1px solid var(--line-2);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;color:var(--ink-3);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer input{flex:1;border:0;outline:0;background:none}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;align-items:start}
.col{background:var(--surface-2);border-radius:14px;padding:10px;border:1px solid var(--line);min-height:200px;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.col.over{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.01)}
.colh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:8px}
.colh i{width:10px;height:10px;border-radius:3px}
.colh small{color:var(--ink-3);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;box-shadow:var(--sh-card);font-size:13px;cursor:grab;transition:transform .2s var(--ease),box-shadow .2s,opacity .2s}
.kc:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(0,0,0,.25)}
.kc.dragging{opacity:.4;transform:rotate(2deg) scale(.98)}
.kc.landed{animation:flash .5s var(--spring)}
.kc .gtag{font-size:11px;color:var(--ink-3);display:flex;gap:5px;align-items:center;margin-bottom:4px}
.kc .gtag i{width:7px;height:7px;border-radius:2px}
.kc .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.kc .ft .owners{margin-left:auto;display:flex;gap:2px}
.kc.late .dd{color:var(--danger);font-weight:600}

/* ---------- gantt ---------- */
.gwrap{flex:1;overflow:auto;position:relative;background:var(--surface)}
.gin{display:grid;grid-template-columns:var(--gl) max-content;min-width:100%}
.gleft{position:sticky;left:0;z-index:6;background:var(--surface);border-right:1px solid var(--line-2);box-shadow:4px 0 10px -8px rgba(0,0,0,.25)}
.gr-row{display:grid;grid-template-columns:var(--gcols);height:34px;align-items:center;border-bottom:1px solid var(--line);font-size:12.5px;padding:0 8px;gap:6px;white-space:nowrap;transition:background .15s}
.gr-row>span{overflow:hidden;text-overflow:ellipsis}
.gr-row.h{position:sticky;top:0;z-index:7;background:var(--surface-2);height:52px;font-size:11px;color:var(--ink-3);font-weight:650;align-items:end;padding-bottom:8px}
.gr-row.g{font-weight:700;background:var(--surface-2);cursor:pointer}
.gr-row.g .cv{transition:transform .3s var(--smooth);width:14px;height:14px;vertical-align:-2px}
.gr-row.g.col .cv{transform:rotate(-90deg)}
.gr-row .w{color:var(--ink-3)}
.gr-row.crit-row .nm{color:var(--danger)}
.gr-row:hover{background:var(--surface-3)}
.var-p{color:var(--danger);font-weight:600}.var-n{color:var(--accent);font-weight:600}
.gright{position:relative}
.ghead{position:sticky;top:0;z-index:5;height:52px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ghead .mo,.ghead .wk{position:absolute;font-size:11px;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line);padding-left:6px}
.ghead .mo{top:0;height:24px;line-height:24px;font-weight:700;color:var(--ink)}
.ghead .wk{top:24px;height:28px;line-height:28px;color:var(--ink-3)}
.ghead .wk b{color:var(--ink-2);font-weight:650}
.gbodyx{position:relative}
.grid-bg{position:absolute;inset:0}
.grid-bg .rowline{position:absolute;left:0;right:0;height:34px;border-bottom:1px solid var(--line)}
.grid-bg .rowline.g{background:var(--surface-2)}
.freeze{position:absolute;top:0;bottom:0;background:var(--freeze);border-left:1px dashed var(--violet);border-right:1px dashed var(--violet);z-index:1}
.freeze span{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;color:var(--violet);white-space:nowrap;background:var(--surface);padding:0 5px;border-radius:5px}
.gbodyx .today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:4}
.gbodyx .today span{position:absolute;top:4px;left:4px;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:0 5px;border-radius:5px;white-space:nowrap}
.gb{position:absolute;height:18px;border-radius:6px;font-size:10.5px;color:#fff;display:flex;align-items:center;padding:0 6px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:grab;z-index:3;touch-action:none;transition:box-shadow .2s,transform .2s var(--ease),background .3s,outline-color .2s}
.gb:hover{box-shadow:0 4px 12px -2px rgba(0,0,0,.3);transform:translateY(-1px)}
.gb.dragging{cursor:grabbing;transform:translateY(-2px) scale(1.02);box-shadow:0 10px 24px -6px rgba(0,0,0,.4)}
.gb.hl-b{outline:2px solid var(--info);outline-offset:1px}
.gb .done{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.18);border-radius:6px 0 0 6px}
.gb span{position:relative}
.gb.crit{background:var(--danger)!important}
.gb .hand{position:absolute;right:-5px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-2);opacity:0;transition:opacity .15s}
.gb:hover .hand{opacity:1}
.glabel{position:absolute;font-size:11px;color:var(--ink-2);white-space:nowrap;z-index:2;pointer-events:none;transition:opacity .2s}
.base{position:absolute;height:5px;border-radius:3px;background:var(--ink-3);opacity:.45;z-index:2}
.slack{position:absolute;height:2px;border-top:2px dashed var(--ink-3);opacity:.6;z-index:2}
.gsum{position:absolute;height:7px;background:var(--ink-2);border-radius:2px;z-index:2}
.gsum::before,.gsum::after{content:"";position:absolute;top:7px;border:5px solid transparent;border-top-color:var(--ink-2)}
.gsum::before{left:0;border-left-color:var(--ink-2)}.gsum::after{right:0;border-right-color:var(--ink-2)}
.ms{position:absolute;width:14px;height:14px;transform:rotate(45deg);background:var(--violet);border-radius:2px;z-index:3;cursor:grab;transition:transform .2s var(--spring)}
.ms:hover{transform:rotate(45deg) scale(1.2)}
.ms.crit{background:var(--danger)}
.dl{position:absolute;z-index:3;color:var(--danger);display:flex;align-items:center}
.dl svg{width:13px;height:13px}
.cons{display:inline-flex;color:var(--info);vertical-align:-1px}
.cons svg{width:12px;height:12px}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.arrows path{fill:none;stroke:var(--ink-3);stroke-width:1.4}
.arrows path.crit{stroke:var(--danger);stroke-width:1.6}
.arrows path.conf{stroke:var(--danger);stroke-dasharray:4 3;animation:pulse 1s infinite}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--ink-3);padding:8px 20px;border-top:1px solid var(--line);background:var(--surface)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-card);min-width:0;animation:rise .4s var(--ease) backwards}
.ov .card:nth-child(2){animation-delay:.03s}.ov .card:nth-child(3){animation-delay:.06s}.ov .card:nth-child(4){animation-delay:.09s}.ov .card:nth-child(5){animation-delay:.12s}.ov .card:nth-child(6){animation-delay:.15s}.ov .card:nth-child(7){animation-delay:.18s}
.card h4{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;align-items:center;gap:8px}
.card h4 small{color:var(--ink-3);font-weight:500;margin-left:auto}
.card .cb-in{padding:14px 16px}
.c4{grid-column:span 4}.c8{grid-column:span 8}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--surface-3) 0)}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--ink-3)}
.ring b{display:block;font-size:24px;color:var(--ink);line-height:1}
.mst{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.mst:last-child{border:0}
.mst .dia{width:11px;height:11px;transform:rotate(45deg);border-radius:2px;background:var(--violet);margin-left:3px}
.mst.ok .dia{background:var(--s-done)}.mst.risk .dia{background:var(--danger)}
.risk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.risk:last-child{border:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi small{color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}
.kpi.r b{color:var(--danger)}.kpi.g b{color:var(--accent)}.kpi.w b{color:var(--warn)}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line)}
.chart .plan{stroke:var(--ink-3);stroke-dasharray:4 4;fill:none;stroke-width:1.6}
.chart .done{stroke:var(--accent);fill:none;stroke-width:2.4}
.chart .area{fill:var(--accent-soft)}
.chart .now{stroke:var(--accent);stroke-width:1}
.feed{display:flex;gap:10px;font-size:13px;padding:7px 0}
.feed small{display:block;color:var(--ink-3);font-size:11.5px}
.goal{font-size:15px;line-height:1.5;margin:0;max-width:70ch}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}

/* ---------- workload ---------- */
.wl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh-card)}
.wl-row{display:grid;grid-template-columns:220px repeat(8,1fr);border-bottom:1px solid var(--line);align-items:stretch;min-height:52px}
.wl-row:last-child{border:0}
.wl-row.h{min-height:38px;background:var(--surface-2);font-size:11.5px;color:var(--ink-3);font-weight:650}
.wl-row>div{display:flex;align-items:center;padding:0 10px;border-left:1px solid var(--line);gap:8px}
.wl-row>div:first-child{border-left:0}
.wl-row.h>div{justify-content:center}.wl-row.h>div:first-child{justify-content:flex-start}
.load{width:100%;height:36px;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;font-weight:650;border:0;line-height:1.2;transition:background .4s,color .4s,transform .2s var(--spring)}
.load small{font-size:10px;font-weight:500;opacity:.8}
.load.l0{background:var(--surface-2);color:var(--ink-3)}
.load.l1{background:var(--accent-soft);color:var(--accent)}
.load.l2{background:color-mix(in srgb,var(--s-done) 32%,var(--surface));color:var(--ink)}
.load.l3{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.load.l3:hover{transform:scale(1.05)}
.load.off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface-3) 6px 8px)}

/* ---------- calendar ---------- */
.calg{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.calg .dh{padding:8px 10px;font-size:11.5px;color:var(--ink-3);font-weight:650;background:var(--surface-2);border-bottom:1px solid var(--line)}

function ganttAfter(){

}
function keepScroll(){const gw=$('#gwrap');if(gw)S._gscroll=[gw.scrollLeft,gw.scrollTop]}
function segKnob(){$$('.seg').forEach(s=>{const k=$('.knob',s),on=$('button.on',s);if(k&&on){k.style.left=on.offsetLeft+'px';k.style.width=on.offsetWidth+'px'}})}
function succs(id){return DEPS.filter(d=>d[0]===id).map(d=>d[1])}
function shiftChain(id,moved){succs(id).forEach(s=>{const A=T(id),B=T(s);const need=(A.ms?A.st:end(A)+1)-B.st;if(need>0){B.st+=need;moved.add(s);shiftChain(s,moved)}})}
function conflicts(id){return succs(id).filter(s=>{const A=T(id),B=T(s);return (A.ms?A.st:end(A)+1)>B.st})}
let drag=null;
function ganttDown(e){
 const b=e.target.closest('.gb,.ms');if(!b)return;const id=b.dataset.gid;const t=T(id);
 drag={id,b,x0:e.clientX,st0:t.st,left0:parseFloat(b.style.left),days:0};b.classList.add('dragging');try{b.setPointerCapture(e.pointerId)}catch(_){}hideTip();e.preventDefault();
}

 const px=PX[S.zoom];drag.days=Math.round((e.clientX-drag.x0)/px);drag.b.style.left=(drag.left0+drag.days*px)+'px';

}
function ganttUp(){
 if(!drag)return;const {id,days,st0}=drag;drag.b.classList.remove('dragging');drag=null;hideTip();
 keepScroll();
 if(!days){renderPV();openPanel(id);return}
 const snap=allT().map(t=>[t.id,t.st]);const t=T(id);t.st=st0+days;
 const cf=conflicts(id);S.conf=new Set();
 if(cf.length){
  const moved=new Set();const tmp=allT().map(x=>[x.id,x.st]);shiftChain(id,moved);const goLive=T('m2').st;tmp.forEach(([i,s])=>T(i).st=s);
  cf.forEach(s=>S.conf.add(id+'>'+s));renderPV();
  const gl=goLive!==T('m2').st?`Go-live moves to <b>${fdw(goLive)}</b>.`:`Go-live stays on <b>${fdw(goLive)}</b>.`;
  toast(`<b>Move "${esc(t.n)}" ${days} day${Math.abs(days)>1?'s':''} later?</b><br>${moved.size} task${moved.size>1?'s':''} waiting for it will move too. ${gl}`,{kind:'warn',ms:0,actions:[
   {l:'Only this task',f:()=>{toast('Moved only this task. The dashed red links show what now overlaps.',{actions:[{l:'Undo',f:()=>undo(snap)}]})}},
   {l:'Move all',pri:1,f:()=>{const m=new Set();shiftChain(id,m);S.conf=new Set();keepScroll();renderPV();updHeaderProgress();toast(`Moved ${m.size+1} tasks. Go-live is now <b>${fdw(T('m2').st)}</b>. Owners were notified.`,{actions:[{l:'Undo',f:()=>undo(snap)}]})}}]});
 }else{renderPV();toast(`Moved "<b>${esc(t.n)}</b>" ${days>0?days+' days later':-days+' days earlier'}. Nothing else had to move.`,{actions:[{l:'Undo',f:()=>undo(snap)}]})}
}
function undo(snap){snap.forEach(([i,s])=>T(i).st=s);S.conf=new Set();keepScroll();renderPV();updHeaderProgress();toast('Undone.',{ms:1800})}

document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c)return;e.preventDefault();const t=T(e.dataTransfer.getData('text/plain'));if(!t)return;const old=t.s;if(old===c.dataset.s){c.classList.remove('over');return}t.s=c.dataset.s;t.landed=1;renderPV();updHeaderProgress();
 toast(`Moved to <b>${SL[t.s]}</b>.`,{actions:[{l:'Undo',f:()=>{t.s=old;renderPV();updHeaderProgress()}}]})});
// gantt pointer
document.addEventListener('pointerdown',e=>{if(e.button===0&&e.target.closest('#gwrap .gb,#gwrap .ms'))ganttDown(e)});
document.addEventListener('pointermove',e=>{if(drag)ganttMove(e);else if(e.target.closest&&e.target.closest('#gwrap'))ganttMove(e);else if($('.tip'))hideTip()});
document.addEventListener('pointerup',ganttUp);
document.addEventListener('mouseover',e=>{const r=e.target.closest&&e.target.closest('.gr-row[data-hid]');const id=r?r.dataset.hid:null;if(id!==S._hov){S._hov=id;$$('.gb.hl-b').forEach(b=>b.classList.remove('hl-b'));if(id){const b=$(`.gb[data-gid="${id}"]`);b&&b.classList.add('hl-b')}}});
setInterval(()=>{if(!S.timerOn)return;S.timerSec++;const c=$('#clock');if(c){const s=S.timerSec;c.textContent=`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}},1000);
addEventListener('resize',()=>{moveInd(true);segKnob()});

let start='table';try{const s=localStorage.getItem('pmv2s');if(s&&SCREENS.some(([,it])=>it.some(([k])=>k===s)))start=s}catch(_){}
go(start);
