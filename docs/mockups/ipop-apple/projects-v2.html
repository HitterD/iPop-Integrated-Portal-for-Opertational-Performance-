<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects v2 mockup</title>
<style>
:root{
  --frame:#173a2c;--frame-2:#21493a;--frame-line:rgba(255,255,255,.1);--frame-ink:#e9f1ec;--frame-ink-2:#a8c0b3;
  --canvas:#f3f2ee;--surface:#fff;--surface-2:#faf9f7;--surface-3:#f2f0ec;--line:#ebe8e3;--line-2:#dfdbd4;
  --ink:#1c1f23;--ink-2:#5d646c;--ink-3:#8f949a;--accent:#2e9d6b;--accent-soft:#e3f4eb;
  --danger:#d8452e;--danger-soft:#fdeeea;--warn:#c98a06;--warn-soft:#fdf5e2;--info:#2f6fed;--info-soft:#ecf2ff;--violet:#7c4dd6;--violet-soft:#f1ebfd;
  --s-todo:#c4c4c4;--s-doing:#fdab3d;--s-stuck:#e2445c;--s-review:#579bfc;--s-done:#00c875;--s-wait:#a25ddc;
  --sh-pop:0 18px 44px -14px rgba(20,24,22,.28);--sh-card:0 1px 2px rgba(20,24,22,.05),0 4px 14px -6px rgba(20,24,22,.08);
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme=dark]{
  --frame:#0c1d16;--frame-2:#163126;--frame-ink:#e3ece7;--frame-ink-2:#8fa79a;
  --canvas:#16191c;--surface:#1f2326;--surface-2:#24282c;--surface-3:#2a2f33;--line:#2f3439;--line-2:#3a4046;
  --ink:#eceef0;--ink-2:#a8afb6;--ink-3:#7c838a;--accent:#45c486;--accent-soft:rgba(69,196,134,.15);
  --danger:#ff7a63;--danger-soft:rgba(255,122,99,.13);--warn:#e7b44a;--warn-soft:rgba(231,180,74,.14);--info:#7aa7ff;--info-soft:rgba(122,167,255,.14);--violet:#b69cff;--violet-soft:rgba(182,156,255,.14);
  --sh-pop:0 18px 44px -14px rgba(0,0,0,.7);--sh-card:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font:13.5px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
/* mockup nav */
.mk{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.mk b{margin-right:8px}
.mk button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:transform .12s var(--ease)}
.mk button:active{transform:scale(.96)}
.mk button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mk .sp{flex:1}
.stage{padding:22px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.screen{display:none;width:min(1440px,100%)}
.screen.on{display:block;animation:rise .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.cap{width:min(1440px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;color:var(--ink-2);font-size:13px}
.cap>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.cap h3{margin:0 0 5px;font-size:13.5px;color:var(--ink)}
.cap .tag{display:inline-block;font-size:11px;font-weight:650;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.cap .tag.old{background:var(--surface-3);color:var(--ink-3)}
.cap ul{margin:4px 0 0;padding-left:18px}
/* app window */
.win{border-radius:18px;overflow:hidden;box-shadow:var(--sh-pop);border:1px solid var(--line);display:grid;grid-template-columns:208px 1fr;height:820px;background:var(--frame);position:relative}
.side{padding:16px 0 12px 12px;color:var(--frame-ink);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;padding:0 8px 14px}
.brand .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4cc98a,#1f7a53);display:grid;place-items:center;color:#fff;font-size:14px}
.side h6{margin:12px 10px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--frame-ink-2);font-weight:650}
.si{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:11px 0 0 11px;font-size:14px;color:var(--frame-ink);cursor:pointer;transition:background .15s}
.si:hover{background:var(--frame-2)}
.si.on{background:var(--canvas);color:var(--ink);font-weight:700}
.si.on svg{color:var(--accent)}
.si .n{margin-left:auto;margin-right:12px;font-size:11px;background:rgba(255,255,255,.14);padding:0 7px;border-radius:9px}
.main{background:var(--canvas);display:grid;grid-template-columns:236px 1fr;min-width:0;border-radius:18px 0 0 0;overflow:hidden}
/* project rail */
.prail{background:var(--surface-2);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.prail .top{display:flex;gap:6px;margin-bottom:8px}
.search{flex:1;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
.prail h6{margin:12px 8px 4px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:650;display:flex;align-items:center}
.prail h6 span{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0}
.pi{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink-2);transition:background .15s}
.pi:hover{background:var(--surface-3)}
.pi.on{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:var(--sh-card)}
.pi .dot{width:10px;height:10px;border-radius:3px;flex:none}
.pi .pc{margin-left:auto;font-size:11px;color:var(--ink-3)}
.mywork{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:13px;cursor:pointer;margin-bottom:2px}
.mywork .bd{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;border-radius:9px;padding:0 6px}
/* content */
.content{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ph{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 22px 0}
.crumb{font-size:12px;color:var(--ink-3);display:flex;gap:5px;align-items:center}
.titlerow{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.titlerow h1{margin:0;font-size:22px;letter-spacing:-.01em}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.health i{width:7px;height:7px;border-radius:50%;background:currentColor}
.titlerow .sp{flex:1}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-6px}
.av:first-child{margin-left:0}
.av.sm{width:24px;height:24px;font-size:10px;border-width:0;margin:0;border-radius:7px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .12s var(--ease),background .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.progress .bar{width:220px;height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden;display:flex}
.progress .bar i{display:block;height:100%}
/* views tabs */
.vtabs{display:flex;align-items:center;gap:2px;position:relative}
.vt{display:flex;align-items:center;gap:7px;padding:9px 12px 11px;font-size:13px;color:var(--ink-2);cursor:pointer;position:relative;border-radius:8px 8px 0 0;transition:color .15s,background .15s}
.vt:hover{color:var(--ink);background:var(--surface-3)}
.vt.on{color:var(--ink);font-weight:650}
.vt.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;border-radius:2px;background:var(--accent)}
.vt .pin{width:12px;height:12px;color:var(--ink-3)}
.vt.add{color:var(--accent);font-weight:650}
.vt.add.open{background:var(--accent-soft)}
/* toolbar */
.tb{display:flex;align-items:center;gap:6px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.tb .sp{flex:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border:1px solid transparent;transition:background .15s}
.chip:hover{background:var(--surface-3)}
.chip.on{background:var(--info-soft);color:var(--info);border-color:transparent;font-weight:600}
.body{flex:1;overflow:auto;padding:16px 22px 30px}
/* monday table */
.grp{margin-bottom:22px}
.gh{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-weight:700;font-size:15px}
.gh .cv{transition:transform .2s}
.gh small{font-weight:500;color:var(--ink-3);font-size:12px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-card)}
.row{display:grid;grid-template-columns:6px 30px minmax(200px,1fr) 76px 118px 92px 132px 72px 84px 34px;align-items:stretch;border-bottom:1px solid var(--line);min-height:40px;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row>div{display:flex;align-items:center;padding:0 10px;border-left:1px solid var(--line);min-width:0;font-size:13px}
.row>div:nth-child(1),.row>div:nth-child(2){border-left:0;padding:0}
.row>div:nth-child(2){justify-content:center}
.row .gc{padding:0!important;border-left:0!important}
.row.head{min-height:34px;background:var(--surface-2)}
.row.head>div{font-size:11.5px;color:var(--ink-3);font-weight:650;justify-content:center}
.row.head>div:nth-child(3){justify-content:flex-start}
.cb{width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:4px}
.tname{gap:8px;justify-content:space-between}
.tname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname .meta{display:flex;gap:8px;color:var(--ink-3);font-size:11.5px;align-items:center;flex:none}
.tname .meta span{display:inline-flex;gap:3px;align-items:center}
.tname .meta svg{width:13px;height:13px}
.tname .open{opacity:0;transition:opacity .15s;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;background:var(--surface)}
.row:hover .tname .open{opacity:1}
.cell-c{justify-content:center!important}
.st{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px;padding:0;margin:0 -10px;white-space:nowrap;cursor:pointer;transition:filter .15s}
.row>div.stc{padding:0;overflow:hidden}
.st:hover{filter:brightness(1.07)}
.st.todo{background:var(--s-todo)}.st.doing{background:var(--s-doing)}.st.stuck{background:var(--s-stuck)}.st.review{background:var(--s-review)}.st.done{background:var(--s-done)}.st.wait{background:var(--s-wait)}
.due{gap:5px;white-space:nowrap}
.due.late{color:var(--danger);font-weight:600}
.tl{width:100%;height:20px;border-radius:10px;background:var(--surface-3);overflow:hidden;position:relative;font-size:11px;color:#fff;display:grid;place-items:center;font-weight:600}
.tl i{position:absolute;left:0;top:0;bottom:0;border-radius:10px}
.tl span{position:relative}
.pri-p{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.p-h{background:var(--danger-soft);color:var(--danger)}.p-m{background:var(--warn-soft);color:var(--warn)}.p-l{background:var(--info-soft);color:var(--info)}
.pbar{width:100%;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.pbar b{flex:1;height:6px;border-radius:9px;background:var(--surface-3);position:relative;overflow:hidden}
.pbar b i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:9px}
.addrow{display:grid;grid-template-columns:6px 30px 1fr;min-height:38px;border-top:1px solid var(--line)}
.addrow div:last-child{display:flex;align-items:center;padding:0 10px;color:var(--ink-3);font-size:13px}
.sumrow{display:grid;grid-template-columns:6px 30px minmax(200px,1fr) 76px 118px 92px 132px 72px 84px 34px;min-height:34px;background:var(--surface-2);border-top:1px solid var(--line)}
.sumrow>div{display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:var(--ink-3)}
.dist{width:100%;height:18px;border-radius:5px;overflow:hidden;display:flex}
.dist i{display:block;height:100%}
.sub{background:var(--surface-2)}
.sub .tname{padding-left:30px!important}
.colplus{justify-content:center!important;color:var(--ink-3);cursor:pointer}
/* popover */
.pop{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-pop);animation:pop .28s var(--spring);transform-origin:top left}
.vp{width:640px;padding:12px;right:22px;top:134px;transform-origin:top right}
.vp .sr{display:flex;align-items:center;gap:8px;height:38px;border-radius:10px;border:1px solid var(--line-2);padding:0 12px;color:var(--ink-3);font-size:13.5px}
.vp .opts{display:flex;gap:16px;margin:10px 4px 4px;font-size:12.5px;color:var(--ink-2)}
.vp .opts label{display:flex;align-items:center;gap:6px}
.vp h5{margin:14px 6px 6px;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.vo{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:background .12s}
.vo:hover{background:var(--surface-3)}
.vo .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.vo .ic svg{width:15px;height:15px}
.vo b{font-size:13px;font-weight:600;display:block}
.vo small{font-size:11.5px;color:var(--ink-3);display:block;line-height:1.25}
.vo .new{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-left:4px}
.vo.added{opacity:.55}
.vo.added small::after{content:" · Added";font-weight:600}
.vp .hint{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
/* gantt */
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-card);display:grid;grid-template-columns:340px 1fr}
.gl{border-right:1px solid var(--line)}
.gl .r,.gr .r{height:36px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-size:12.5px}
.gl .r{display:grid;grid-template-columns:44px 1fr 62px 56px;padding:0 10px;gap:6px}
.gl .r.h,.gr .r.h{height:44px;background:var(--surface-2);font-size:11px;color:var(--ink-3);font-weight:650}
.gl .r.g{font-weight:700;background:var(--surface-2)}
.gl .wbs{color:var(--ink-3);font-variant-numeric:tabular-nums}
.gr{position:relative;overflow:hidden}
.gr .r.h{display:grid;grid-template-columns:repeat(8,1fr)}
.gr .r.h div{border-left:1px solid var(--line);height:100%;display:flex;flex-direction:column;justify-content:center;padding-left:8px}
.gr .r.h b{color:var(--ink);font-size:11.5px}
.gr .cols{position:absolute;inset:44px 0 0 0;display:grid;grid-template-columns:repeat(8,1fr);pointer-events:none}
.gr .cols div{border-left:1px dashed var(--line)}
.gr .cols div.we{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}
.gb{position:absolute;height:18px;border-radius:6px;font-size:11px;color:#fff;display:flex;align-items:center;padding:0 8px;font-weight:600;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12);cursor:grab}
.gb .done{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28);border-radius:6px 0 0 6px}
.gb span{position:relative}
.gb.crit{background:var(--danger)!important}
.base{position:absolute;height:5px;border-radius:3px;background:var(--ink-3);opacity:.45}
.gsum{position:absolute;height:8px;background:var(--ink-2);border-radius:2px}
.gsum::before,.gsum::after{content:"";position:absolute;bottom:-5px;border:5px solid transparent;border-top-color:var(--ink-2)}
.gsum::before{left:0;border-left-color:var(--ink-2)}.gsum::after{right:0;border-right-color:var(--ink-2)}
.ms{position:absolute;width:14px;height:14px;transform:rotate(45deg);background:var(--violet);border-radius:2px}
.today{position:absolute;top:44px;bottom:0;width:2px;background:var(--accent)}
.today::before{content:"Today";position:absolute;top:2px;left:4px;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:0 5px;border-radius:5px}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-pop);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;width:600px;animation:pop .35s var(--spring);font-size:13px}
.toast .ic{width:34px;height:34px;border-radius:10px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none}
.toast p{margin:0;flex:1;color:var(--ink-2)}
.toast b{color:var(--ink)}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--surface-3);border-radius:9px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-size:12px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tog{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.tog i{width:28px;height:16px;border-radius:9px;background:var(--line-2);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s var(--spring)}
.tog.on i{background:var(--accent)}.tog.on i::after{left:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:90px;font-size:11.5px;color:var(--ink-3);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* modal */
.scrim{position:absolute;inset:0;border-radius:18px;background:rgba(15,20,18,.38);backdrop-filter:blur(2px);z-index:60;display:grid;place-items:center}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--sh-pop);animation:pop .32s var(--spring);overflow:hidden;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:17px}
.mh .sp{flex:1}
.steps{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.steps span{display:inline-flex;gap:6px;align-items:center}
.steps em{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:11px;font-weight:700}
.steps .on{color:var(--ink);font-weight:650}.steps .on em{background:var(--accent);color:#fff}
.steps .ok em{background:var(--accent-soft);color:var(--accent)}
.steps hr{width:22px;border:0;border-top:1px solid var(--line-2);margin:0}
.mf{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.mf .sp{flex:1}
.tc{display:grid;grid-template-columns:190px 1fr 320px;height:560px}
.tc .cats{border-right:1px solid var(--line);padding:12px 8px;background:var(--surface-2)}
.tc .cats .pi .pc{font-size:11px}
.tc .cards{padding:14px;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s,border-color .15s;background:var(--surface)}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--sh-card)}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.thumb{height:74px;border-radius:8px;background:var(--surface-2);margin-bottom:8px;padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.thumb i{display:block;height:7px;border-radius:4px}
.tcard b{font-size:13px;display:block}
.tcard small{color:var(--ink-3);font-size:11.5px}
.tcard .used{float:right;font-size:11px;color:var(--ink-3)}
.tprev{border-left:1px solid var(--line);padding:16px;overflow:auto}
.tprev h3{margin:0 0 4px;font-size:16px}
.tprev p{margin:0 0 12px;color:var(--ink-2);font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.kv div{background:var(--surface-2);border-radius:9px;padding:8px;font-size:11px;color:var(--ink-3)}
.kv b{display:block;font-size:15px;color:var(--ink)}
.tprev h5{margin:12px 0 6px;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.plist{font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.plist div{display:flex;gap:8px;align-items:center}
.plist i{width:8px;height:8px;border-radius:2px;flex:none}
.plist small{margin-left:auto;color:var(--ink-3)}
.vchips{display:flex;flex-wrap:wrap;gap:5px}
.vchips span{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-2)}
/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f label{font-size:12.5px;font-weight:650}
.f .in{height:38px;border-radius:10px;border:1px solid var(--line-2);display:flex;align-items:center;padding:0 12px;font-size:13.5px;gap:8px;background:var(--surface)}
.f .in.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .in.ta{height:64px;align-items:flex-start;padding-top:9px;color:var(--ink-2)}
.f small{color:var(--ink-3);font-size:11.5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600}
.role{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.role b{font-size:13px}.role small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:400}
.pick{white-space:nowrap;display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line-2);border-radius:10px;padding:0 8px;font-size:13px}
.pick .ph2{color:var(--ink-3)}
/* status editor */
.sel{display:grid;grid-template-columns:18px 26px 1fr 170px 26px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sw{width:22px;height:22px;border-radius:6px}
.sel .nm{height:34px;border:1px solid var(--line-2);border-radius:9px;display:flex;align-items:center;padding:0 10px;font-size:13px}
.sel .dd{height:34px;border:1px solid var(--line-2);border-radius:9px;display:flex;align-items:center;padding:0 10px;font-size:12.5px;justify-content:space-between;color:var(--ink-2)}
.palette{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0 4px 54px;width:max-content}
.palette i{width:22px;height:22px;border-radius:6px;cursor:pointer;transition:transform .15s var(--spring)}
.palette i:hover{transform:scale(1.15)}
/* my work */
.mwgrid{display:grid;grid-template-columns:1fr 320px;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-card)}
.card h4{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:8px}
.card h4 small{color:var(--ink-3);font-weight:500}
.mwi{display:grid;grid-template-columns:18px 1fr 150px 110px 90px;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.mwi:last-child{border-bottom:0}
.mwi .pj{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12px}
.mwi .pj i{width:8px;height:8px;border-radius:2px}
.st.pill{height:24px;border-radius:7px;margin:0;font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}
.kpi.r b{color:var(--danger)}
/* form view */
.fv{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;background:var(--surface);font-size:13px}
.fq .map{margin-left:auto;font-size:11.5px;color:var(--ink-3);display:flex;gap:5px;align-items:center}
.fq .grip{color:var(--ink-3)}
.pubform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--sh-card)}
.pubform h3{margin:0 0 4px;font-size:18px}
.pubform p{margin:0 0 16px;color:var(--ink-2);font-size:13px}
/* close */
.close-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) 0 82%,var(--surface-3) 0);display:grid;place-items:center}
.ring div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--ink-3)}
.ring b{display:block;font-size:24px;color:var(--ink)}
.lesson{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.lesson:last-child{border:0}
/* board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.col{background:var(--surface-2);border-radius:14px;padding:10px;border:1px solid var(--line)}
.colh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:8px}
.colh i{width:10px;height:10px;border-radius:3px}
.colh small{color:var(--ink-3);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;box-shadow:var(--sh-card);font-size:13px;transition:transform .15s var(--ease)}
.kc:hover{transform:translateY(-2px)}
.kc .gtag{font-size:11px;color:var(--ink-3);display:flex;gap:5px;align-items:center;margin-bottom:4px}
.kc .gtag i{width:7px;height:7px;border-radius:2px}
.kc .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.kc .ft .av{margin-left:auto}
.kc.drag{transform:rotate(2deg) translateY(-3px);box-shadow:var(--sh-pop)}
/* phone */
.phone{width:360px;height:740px;border-radius:44px;background:#000;padding:12px;box-shadow:var(--sh-pop)}
.phone .scr{background:var(--canvas);border-radius:34px;height:100%;overflow:hidden;display:flex;flex-direction:column}
.phwrap{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 <span class="chip">${ic('user')}Person</span><span class="chip on">${ic('filter')}Status: not Done ${ic('x','width:12px;height:12px')}</span><span class="chip">${ic('table')}Group by: Phase</span><span class="chip">${ic('eye')}Hide</span>
 <span class="sp"></span>${extra}<span class="chip">${ic('save')}Save view</span></div>`;
}
const row=(t,sub=false)=>`<div class="row ${sub?'sub':''}"><div class="gc" style="background:${t.g}"></div><div><span class="cb"></span></div>
 <div class="tname"><span class="t">${sub?'↳ ':''}${t.n}</span><span class="meta">${t.sub?`<span>${ic('list')}${t.sub}</span>`:''}${t.c?`<span>${ic('msg')}${t.c}</span>`:''}${t.f?`<span>${ic('clip')}${t.f}</span>`:''}<span class="open">${ic('chevr','width:12px;height:12px')}Open</span></span></div>
 <div class="cell-c">${t.o.map(o=>av(o,'sm')).join('')||`<span style="color:var(--ink-3)">${ic('user')}</span>`}</div>
 <div class="stc"><div class="st ${t.s}">${ST[t.s]}</div></div>
 <div class="due cell-c ${t.late?'late':''}">${t.late?ic('alert','width:13px;height:13px'):''}${t.d}</div>
 <div><div class="tl"><i style="width:${t.tl}%;background:${t.g}"></i><span style="color:${t.tl>=60?"#fff":"var(--ink-2)"}">${t.r}</span></div></div>
 <div class="cell-c">${t.p?`<span class="pri-p p-${t.p[0].toLowerCase()}">${t.p}</span>`:''}</div>
 <div><div class="pbar"><b><i style="width:${t.pc}%"></i></b>${t.pc}%</div></div><div></div></div>`;
function group(name,color,count,range,rows,dist){
 return `<div class="grp"><div class="gh" style="color:${color}">${ic('chev')}${name}<small>${count} tasks · ${range}</small></div><div class="tbl">
 <div class="row head"><div class="gc" style="background:${color}"></div><div><span class="cb"></span></div><div>Task</div><div>Owner</div><div>Status</div><div>Due</div><div>Timeline</div><div>Priority</div><div>Progress</div><div class="colplus" title="Add column">${ic('plus')}</div></div>
 ${rows}<div class="addrow"><div style="background:${color};opacity:.5"></div><div></div><div>+ Add task</div></div>
 <div class="sumrow"><div></div><div></div><div></div><div></div><div><div class="dist">${dist}</div></div><div></div><div style="justify-content:center">${range}</div><div></div><div></div><div></div></div></div></div>`;
}

function ganttScreen(){
 const rows=[
  ['1','Planning','',''], ['1.1','Kick-off meeting','4d','100%'],['1.2','Map current process','6d','100%'],['1.3','Sign scope & budget','5d','90%'],
  ['2','Build & data migration','',''],['2.1','Data migration — item master','6d','40%'],['2.2','Configure warehouse locations','7d','55%'],['2.3','Clean vendor list','4d','30%'],['2.4','Write user guide','8d','0%'],
  ['3','Go-live','',''],['3.1','Training for warehouse staff','7d','0%'],['3.2','◆ Go-live','0d','']];
 const L=rows.map(r=>`<div class="r ${r[2]===''&&r[0].length===1?'g':''}"><span class="wbs">${r[0]}</span><span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${r[1]}</span><span style="color:var(--ink-3)">${r[2]}</span><span style="color:var(--ink-3)">${r[3]}</span></div>`).join('');
 // x in %, rows top = 44 + i*36
 const y=i=>44+i*36+9;
 const bars=[
  [0,'sum',2,30],[1,'b',2,8,'#00c875',100],[2,'b',9,10,'#00c875',100],[3,'b',19,10,'#579bfc',90,1],
  [4,'sum',27,48],[5,'b',27,12,'#e2445c',40,1],[6,'b',39,14,'#fdab3d',55,1],[7,'b',39,9,'#fdab3d',30],[8,'b',55,15,'#c4c4c4',0],
  [9,'sum',75,22],[10,'b',75,14,'#579bfc',0,1]];
 const base=[[3,17,10],[5,22,11],[6,33,14],[10,68,14]];
 let B=bars.map(([i,t,x,w,c,pc,cr])=>t==='sum'?`<div class="gsum" style="top:${y(i)+4}px;left:${x}%;width:${w}%"></div>`:
  `<div class="gb ${cr&&crit?'crit':''}" style="top:${y(i)}px;left:${x}%;width:${w}%;background:${c}"><i class="done" style="width:${pc}%"></i><span>${pc?pc+'%':''}</span></div>`).join('');
 B+=base.map(([i,x,w])=>`<div class="base" style="top:${y(i)+21}px;left:${x}%;width:${w}%"></div>`).join('');
 B+=`<div class="ms" style="top:${y(11)+2}px;left:90%"></div><span style="position:absolute;top:${y(11)}px;right:12%;font-size:11px;font-weight:650;white-space:nowrap">Go-live · 31 Jan</span>`;
 B+=`<div class="today" style="left:33%"></div>`;
 const arrows=`<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible" viewBox="0 0 1000 476" preserveAspectRatio="none">
  <defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--danger)"/></marker></defs>
  <path d="M290 ${y(3)+9} H300 V${y(5)+9} H270" stroke="var(--danger)" stroke-width="1.6" fill="none" marker-end="url(#ah)" vector-effect="non-scaling-stroke"/>
  <path d="M390 ${y(5)+9} H395 V${y(6)+9} H390" stroke="var(--danger)" stroke-width="1.6" fill="none" marker-end="url(#ah)" vector-effect="non-scaling-stroke"/>
  <path d="M530 ${y(6)+9} H540 V${y(10)+9} H750" stroke="var(--danger)" stroke-width="1.6" fill="none" marker-end="url(#ah)" vector-effect="non-scaling-stroke"/></svg>`;
 const weeks=['4 Nov','11 Nov','18 Nov','25 Nov','2 Dec','9 Dec','16 Dec','6 Jan'];
 const g=`<div class="gantt"><div class="gl"><div class="r h"><span>WBS</span><span>Task</span><span>Duration</span><span>Done</span></div>${L}</div>
 <div class="gr"><div class="r h">${weeks.map((w,i)=>`<div><b>Week ${i+45>52?i-6:i+45}</b>${w}</div>`).join('')}</div><div class="cols">${weeks.map((_,i)=>`<div class="${i==6?'we':''}"></div>`).join('')}</div>${arrows}${B}</div></div>
 <div class="legend"><span><i style="width:14px;height:8px;border-radius:3px;background:var(--danger)"></i>Critical path — a delay here delays go-live</span><span><i style="width:14px;height:4px;border-radius:3px;background:var(--ink-3);opacity:.5"></i>Baseline (plan locked 8 Nov)</span><span><i style="width:9px;height:9px;transform:rotate(45deg);background:var(--violet)"></i>Milestone</span><span>Drag a bar to move · drag its edge to resize · drag from the dot to link</span></div>`;
 const ex=`<div class="seg"><button>Day</button><button class="on">Week</button><button>Month</button></div><span class="tog ${crit?'on':''}"><i></i>Critical path</span><span class="tog on"><i></i>Baseline</span><span class="tog"><i></i>WBS numbers</span>`;
 return shell(header('gantt')+`<div class="tb"><div class="search" style="flex:0 0 200px">${ic('search')}Search tasks</div><span class="chip">${ic('user')}Person</span>${ex}<span class="sp"></span><span class="chip">${ic('flag')}Set baseline</span><span class="chip">Export PDF</span></div>
 <div class="body">${g}</div>
 <div class="toast"><span class="ic">${ic('alert')}</span><p><b>Move "Data migration" 3 days later?</b><br>4 tasks that depend on it will move too. Go-live moves to <b>5 Feb</b>.</p><button class="btn sm">Only this task</button><button class="btn pri sm">Move all</button></div>`);
}

 ${S.map(([s,n,stg],i)=>`<div class="sel"><span style="color:var(--ink-3)">${ic('grip')}</span><span class="sw" style="background:var(--s-${s})"></span><div class="nm" ${i==3?'style="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)"':''}>${n}</div><div class="dd">${stg}${ic('chev','width:14px;height:14px')}</div><span style="color:var(--ink-3)">${ic('x','width:14px;height:14px')}</span></div>${i==3?`<div class="palette">${['#c4c4c4','#fdab3d','#e2445c','#a25ddc','#579bfc','#00c875','#0e9aa7','#e05a9b','#c98a06','#5d646c'].map(c=>`<i style="background:${c}"></i>`).join('')}</div>`:''}`).join('')}
 <button class="btn ghost" style="margin-top:8px;color:var(--accent)">${ic('plus')}Add status</button>
 <div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);display:flex;gap:8px">${ic('alert','color:var(--warn)')}<span>Deleting a status that is in use asks where its 3 tasks should go.</span></div></div>
 <div class="mf"><span style="font-size:12px;color:var(--ink-3)">Opened by clicking any status cell → "Edit statuses"</span><span class="sp"></span><span style="font-size:12px;color:var(--accent);display:flex;gap:4px;align-items:center">${ic('check','width:14px;height:14px')}Saved</span><button class="btn">Close</button></div></div></div>`;
 return shell(header('table')+toolbar()+'<div class="body"></div>'+m);
}
function myWork(){
 const it=(n,pj,pc,s,d,late)=>`<div class="mwi"><span class="cb"></span><span>${n}</span><span class="pj"><i style="background:${pc}"></i>${pj}</span><div class="st pill ${s}">${ST[s]}</div><span style="${late?'color:var(--danger);font-weight:600':'color:var(--ink-2)'}">${d}</span></div>`;
 const body=`<div class="ph" style="padding-bottom:14px"><div class="titlerow" style="margin:0"><h1>My work</h1><span class="sp"></span><div class="seg"><button class="on">List</button><button>Calendar</button></div><button class="btn pri">${ic('plus')}New task</button></div><div style="color:var(--ink-3);font-size:12.5px">Every task assigned to you, from all projects.</div></div>
 <div class="body"><div class="kpis"><div class="kpi r"><small>Late</small><b>3</b></div><div class="kpi"><small>Due today</small><b>2</b></div><div class="kpi"><small>This week</small><b>7</b></div><div class="kpi"><small>Done this week</small><b style="color:var(--accent)">9</b></div></div>
 <div class="mwgrid"><div class="card"><h4 style="color:var(--danger)">Late <small>3</small></h4>
 ${it('Data migration — item master','ERP Rollout Sepanjang','#2e9d6b','stuck','15 Nov',1)}${it('Approve printer for barcode labels','ERP Rollout Sepanjang','#2e9d6b','wait','16 Nov',1)}${it('Collect NDA forms','Onboarding Batch Dec','#e2445c','doing','16 Nov',1)}
 <h4>Today <small>2</small></h4>${it('Sign scope & budget','ERP Rollout Sepanjang','#2e9d6b','review','Today')}${it('CCTV camera 14 re-aim','CCTV Plant 2','#fdab3d','doing','Today')}
 <h4>This week <small>7</small></h4>${it('Clean vendor list (SAP export)','ERP Rollout Sepanjang','#2e9d6b','doing','Mon 25 Nov')}${it('Book venue for gathering','Annual Gathering','#00c875','todo','Wed 27 Nov')}
 <h4>Later <small>12</small></h4></div>
 <div class="card"><h4>Waiting on me</h4><div style="padding:12px 16px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px">
 <div>${av('RS','sm')} <b>Rina</b> mentioned you in <b>Clean vendor list</b><br><span style="color:var(--ink-3);font-size:12px">"Pak, yang duplikat dihapus atau digabung?" · 10 min</span></div>
 <div>${av('DW','sm')} <b>Dewi</b> marked <b>Data migration</b> as Stuck<br><span style="color:var(--ink-3);font-size:12px">Blocks 4 tasks · 1 h</span></div>
 <div>${ic('form','color:var(--violet)')} New request via form in <b>Helpdesk iDesk v3</b><br><span style="color:var(--ink-3);font-size:12px">"Tambah kategori ticket Produksi" · 2 h</span></div></div></div></div></div>`;
 return shell(body,{active:'mywork'});
}
function formScreen(){
 const q=(n,t,map)=>`<div class="fq"><span class="grip">${ic('grip')}</span><div><b style="font-weight:600">${n}</b><div style="font-size:11.5px;color:var(--ink-3)">${t}</div></div><span class="map">→ ${map}</span></div>`;
 const tabs=header('table').replace('<div class="vt add','<div class="vt on">'+ic('form')+'Request form</div><div class="vt add').replace('vt on">'+ic('table'),'vt">'+ic('table'));
 return shell(tabs+`<div class="tb"><span style="font-weight:650">Form builder</span><span class="sp"></span><span class="tog on"><i></i>Accepting requests</span><span class="chip">${ic('link')}Copy link</span><span class="chip">${ic('eye')}Who can submit: anyone in SJA</span></div>
 <div class="body"><div class="fv"><div><p style="margin:0 0 10px;color:var(--ink-2);font-size:12.5px">Each answer fills a column. Every submission becomes a new task in <b>Intake</b> with status <b>Not started</b>, and the submitter gets updates when it changes.</p>
 ${q('What do you need?','Short text · required','Task name')}${q('Details','Long text','Description')}${q('Which plant?','Choice: Sepanjang, Karawang, Head office','Plant')}${q('Needed by','Date','Due')}${q('Screenshot / file','Upload','Files')}
 <button class="btn ghost" style="color:var(--accent)">${ic('plus')}Add question</button>
 <div class="f" style="margin-top:12px"><label>New requests are assigned to</label><div class="pick">${av('BG','sm')}Bagas <span class="ph2">· and notified</span></div></div></div>
 <div class="pubform"><div style="font-size:12px;color:var(--ink-3);margin-bottom:8px">Preview — what requesters see</div><h3>Request for ERP team</h3><p>Ask for a change, report a problem, or request access. We reply within 2 working days.</p>
 <div class="f"><label>What do you need? *</label><div class="in">Add field "Batch No." on receiving</div></div><div class="f"><label>Details</label><div class="in ta">Supplier kopi sekarang kirim batch number…</div></div>
 <div class="f2"><div class="f"><label>Which plant?</label><div class="in">Sepanjang ${ic('chev','margin-left:auto')}</div></div><div class="f"><label>Needed by</label><div class="in">${ic('cal')}29 Nov</div></div></div><button class="btn pri" style="width:100%;justify-content:center;height:38px">Send request</button></div></div></div>`);
}
function closeScreen(){
 const m=`<div class="scrim"><div class="modal" style="width:820px"><div class="mh"><h2>Close project</h2><span style="color:var(--ink-3);font-size:12.5px">Annual Gathering 2026</span><span class="sp"></span><button class="btn ghost">${ic('x')}</button></div>
 <div style="padding:18px 20px"><div class="close-hero"><div style="display:flex;gap:18px;align-items:center"><div class="ring"><div><b>82%</b>on time</div></div>
 <div style="font-size:13px;color:var(--ink-2);line-height:1.8"><b style="color:var(--ink);font-size:15px">Finished 2 days after the plan</b><br>41 of 41 tasks done · 5 were late<br>Longest delay: <b>Vendor contract</b> (+6 days)<br>Budget column: Rp 182 jt of Rp 190 jt</div></div>
 <div class="card" style="box-shadow:none"><h4>Before you close</h4><div style="padding:6px 16px">
 <div class="lesson">${ic('check','color:var(--accent)')}All tasks are done</div><div class="lesson">${ic('check','color:var(--accent)')}Files stay on the NAS, read-only</div><div class="lesson">${ic('alert','color:var(--warn)')}2 open comments — they'll be kept</div></div></div></div>
 <div class="f" style="margin-top:16px"><label>What should we do differently next time? <span style="font-weight:400;color:var(--ink-3)">(optional, saved to the project & template)</span></label><div class="in ta">Sign vendor contract 3 weeks earlier; book venue before budget approval.</div></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px"><span class="cb" style="background:var(--accent);border-color:var(--accent)"></span>Save as template "Office event" — with groups, statuses, columns & lessons (no people, no dates)</label>
 <label style="display:flex;gap:8px;align-items:center;font-size:13px"><span class="cb" style="background:var(--accent);border-color:var(--accent)"></span>Post a short summary in the project chat</label></div>
 <div class="mf"><span style="font-size:12px;color:var(--ink-3)">Closed projects move to Archived and can be reopened any time.</span><span class="sp"></span><button class="btn">Cancel</button><button class="btn pri">${ic('arch')}Close & archive</button></div></div></div>`;
 return shell(header('dash')+'<div class="body"></div>'+m);
}
function phoneScreen(){
 const ph=(inner)=>`<div class="phone"><div class="scr">${inner}</div></div>`;
 const top=`<div style="padding:44px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line)"><div style="font-size:12px;color:var(--ink-3)">ICT</div><div style="font-size:19px;font-weight:750">ERP Rollout Sepanjang</div>
 <div style="display:flex;gap:6px;margin-top:10px;overflow:hidden">${['Table','Board','Gantt','Calendar','Files'].map((t,i)=>`<span style="padding:5px 11px;border-radius:999px;font-size:12.5px;${i==0?'background:var(--accent);color:#fff;font-weight:650':'background:var(--surface-3);color:var(--ink-2)'}">${t}</span>`).join('')}</div></div>`;
 const it=(n,s,d,late,g)=>`<div style="background:var(--surface);border-radius:13px;padding:11px 12px;border-left:4px solid ${g};display:flex;flex-direction:column;gap:7px"><b style="font-weight:600;font-size:14px">${n}</b><div style="display:flex;gap:8px;align-items:center"><span class="st pill ${s}" style="width:auto;padding:0 10px;display:inline-grid;flex:none">${ST[s]}</span><span style="font-size:12px;${late?'color:var(--danger);font-weight:600':'color:var(--ink-3)'}">${d}</span></div></div>`;
 const list=`<div style="padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden"><div style="font-weight:700;color:#fdab3d;font-size:13px">Build & data migration · 6</div>${it('Data migration — item master','stuck','15 Nov · late',1,'#fdab3d')}${it('Configure warehouse locations','doing','28 Nov',0,'#fdab3d')}${it('Approve printer for labels','wait','16 Nov · late',1,'#fdab3d')}<div style="font-weight:700;color:#579bfc;font-size:13px;margin-top:6px">Go-live · 3</div>${it('Training for warehouse staff','todo','14 Jan',0,'#579bfc')}</div>`;
 const sheet=`<div style="flex:1;background:rgba(0,0,0,.35);display:flex;align-items:flex-end"><div style="background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:10px 16px 24px"><div style="width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 12px"></div><b>Change status</b><div style="display:flex;flex-direction:column;gap:7px;margin-top:10px">${['todo','doing','stuck','wait','review','done'].map(s=>`<div class="st pill ${s}" style="height:40px;border-radius:11px;font-size:14px">${ST[s]}</div>`).join('')}</div></div></div>`;
 return `<div class="phwrap">${ph(top+list)}${ph(`<div style="padding:44px 18px 12px;background:var(--surface)"><b style="font-size:16px">Data migration — item master</b></div>`+sheet)}</div>`;
}

const CAP={
 table:[['NEW','Monday-style Table',`Groups (phases) with a colour bar, <b>full-width coloured status cells</b> (click → pick), owner avatars, timeline bar, progress, summary row per group showing the status mix. "+ Add task" at the bottom of every group; "+" at the end of the header adds a column (Status, People, Date, Number, Dropdown, Files, Progress…).`],
  ['NEW','Project header',`Health chip (On track / At risk / Off track, set by the lead), one coloured progress bar for the whole project, "2 late" in red. Same buttons as today: Members, Chat, ⋯, New task.`],
  ['NEW','Left rail',`<b>My work</b> on top (with late count), then Favourites and projects grouped by department with their % done. Archived at the bottom.`],
  ['NOW → NEW','What stays',`Task drawer, evidence on NAS, autosave, comments, Reports, Workload, saved views — unchanged. Statuses are now per project but every status still maps to one of the 4 stages.`]],
 picker:[['NEW','"+ View" picker',`Opened from the "+ View" tab. Grouped like ClickUp, with a search box, "Only me" (private view) and "Pin to tabs". Views already in this project are dimmed with "Added". NEW = views that don't exist yet.`],
  ['PHASE','What gets built when',`<b>Phase 1:</b> picker, Table/Board/List/Timeline/Calendar/Workload/Reports (existing), <b>Gantt, Doc (Notes page), Whiteboard (existing board), Form, Files</b>.<br><b>Phase 2:</b> Dashboard, Activity, Team, Gallery.`],
  ['SKIP','Left out on purpose','Mind map, Map, Embed, Survey, Website, App — little use for office projects.']],
 board:[['NEW','Board with custom statuses','One column per status of this project (e.g. "Waiting vendor"). Each card shows its group colour, due date (red when late), files and owner. Drag between columns = change status, with the existing evidence prompt when moving to Done.']],
 gantt:[['NEW','Gantt (MS Project-lite)',`WBS numbers (toggle), duration and % done on the left; bars with progress fill; group summary brackets; milestone diamonds; weekends shaded; Today line.`],
  ['NEW','Dependencies & critical path','Drag from a bar\'s dot to link (finish → start, with optional lag). Red = critical path: any delay here delays go-live.'],
  ['NEW','Auto-move with confirm','Moving a task that others depend on shows the toast: "4 tasks will move too. Go-live moves to 5 Feb" → Only this task / Move all.'],
  ['NEW','Baseline','"Set baseline" freezes the plan; thin grey lines under bars show plan vs actual.']],
 new:[['NEW','Template Center','Same pattern as the Whiteboard Template Center: categories left, cards in the middle (with how often used), full preview on the right — groups with weeks, statuses, views, roles and columns.'],
  ['NEW','SJA templates','ICT implementation, Helpdesk/system rollout, Office event, Machine maintenance (repeating), Audit/ISO, Procurement, Onboarding, Product launch, Marketing campaign + Blank. "My templates" and "Shared with my dept" from Save as template.']],
 setup:[['NEW','Steps 2 + 3 in one screen','Name, goal, department, colour, start and finish date → task dates spread automatically over working days. Visibility: only members / department / everyone.'],
  ['NEW','Roles instead of picking people per task','Template roles (Project lead, IT engineer, Key user). Pick people per role → their tasks are assigned. Suggestions from the same departments (no NIK, same search as Notes @mention).'],
  ['NEW','One notification','Members get a single "You were added to ERP Rollout" notification, not one per task. Project opens on Overview with a starter checklist.']],
 status:[['NEW','Your own statuses','Add, rename, recolour (palette), drag to reorder, delete (asks where tasks go). Each status has a <b>stage</b>: Not started / Working / Review / Done — Reports, burndown, late reminders and "Done" evidence keep working.']],
 mywork:[['NEW','My work','Everything assigned to me across all projects: Late / Today / This week / Later, with project colour and status. Right card "Waiting on me": mentions, someone marking my task Stuck, new form requests. Also a Calendar toggle.']],
 form:[['NEW','Request form (optional per project)','Build questions, map each to a column. A submission = a new task in the "Intake" group, assigned to the chosen person. Link can be shared to anyone in SJA; requester gets status updates. <b>No approval step</b> — as requested.']],

const R={table:()=>tableScreen(),picker:()=>tableScreen(true),board:boardScreen,gantt:ganttScreen,new:tplModal,setup:setupModal,status:statusModal,mywork:myWork,form:formScreen,close:closeScreen,phone:phoneScreen};
function show(s){
 document.querySelectorAll('.mk button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
 const el=document.getElementById('screens');el.innerHTML=R[s]();el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
 document.getElementById('cap').innerHTML=(CAP[s]||[]).map(([t,h,p])=>`<div><span class="tag ${t==='SKIP'?'old':''}">${t}</span><h3>${h}</h3>${p}</div>`).join('');
 try{localStorage.setItem('pmv2',s)}catch(e){}
}
document.querySelectorAll('.mk button[data-s]').forEach(b=>b.onclick=()=>show(b.dataset.s));
document.getElementById('theme').onclick=e=>{const d=document.documentElement;const dk=d.dataset.theme==='dark';d.dataset.theme=dk?'light':'dark';e.target.textContent=dk?'Dark':'Light'};
document.addEventListener('click',e=>{const t=e.target.closest('.vt.add');if(t)show('picker');const tg=e.target.closest('.tog');if(tg){if(tg.textContent.includes('Critical')){crit=!crit;show('gantt')}else tg.classList.toggle('on')}
 const tc=e.target.closest('.tcard');if(tc){document.querySelectorAll('.tcard').forEach(x=>x.classList.remove('on'));tc.classList.add('on')}
 const sg=e.target.closest('.seg button');if(sg){sg.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));sg.classList.add('on')}});
let start='table';try{start=localStorage.getItem('pmv2')||'table'}catch(e){}
show(R[start]?start:'table');
</script>
