<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPop — Directory navigation proposal</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#f3f4f6;--surface:#fff;--fill:#f1f2f4;--ink:#202124;--muted:#85878e;--line:#e9eaee;--accent:#278d60;--soft:#e8f4ed;--blue:#5276c7;--purple:#8670b5}
[data-theme=dark]{--bg:#151618;--surface:#212225;--fill:#2b2d31;--ink:#f0f1f3;--muted:#999da6;--line:#35373d;--accent:#66c99a;--soft:#23392e}
*{box-sizing:border-box}body{margin:0;background:#e4e5e8;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}svg{width:17px;height:17px;flex-shrink:0}.controls{padding:12px 24px;display:flex;gap:8px;align-items:center;background:var(--surface);border-bottom:1px solid var(--line)}.controls strong{margin-right:14px}.controls button,.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}.controls .active{background:var(--ink);color:var(--surface)}.controls .theme{margin-left:auto}.frame{margin:28px auto;width:min(1380px,calc(100% - 48px));background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 18px 65px #00000012;border:1px solid #00000008}.header{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);gap:12px}.header h1{font-size:25px;letter-spacing:-.6px;margin:0}.subtitle{color:var(--muted);margin-top:3px;font-size:13px}.header .right{margin-left:auto;display:flex;gap:10px}.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted)}.search input{background:none;border:0;outline:none;min-width:0;width:100%;color:var(--ink)}.header .search{width:290px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;padding:20px 24px}.sidebar{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 10px;align-self:start}.sidehead{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 12px}.sidehead strong{font-size:14px}.iconbtn{border:0;background:none;padding:4px;color:var(--muted)}.sidebar .search{background:var(--fill);margin:0 6px 12px;border:0;font-size:12px}.tree{display:grid;gap:3px}.node{position:relative;border:0;border-radius:8px;background:none;display:flex;align-items:center;text-align:left;gap:7px;padding:8px;width:100%;min-height:35px;font-size:13px}.node:hover{background:var(--fill)}.node.active{background:var(--soft);color:var(--accent);font-weight:600}.node .label{flex:1;min-width:0;line-height:1.3}.node .count{color:var(--muted);font-size:11px;flex:none}.node .chev{width:12px;height:12px;color:var(--muted)}.node .site{color:var(--blue)}.node .dept{color:var(--purple)}.node .unit{color:var(--muted)}.children{margin-left:15px;padding-left:9px;border-left:1px solid var(--line)}.children .children{margin-left:11px}.sidefoot{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:12px}.sidefoot input{accent-color:var(--accent)}.sidefoot span{margin-left:auto}.content{min-width:0}.crumbs{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;padding:2px 1px 14px}.crumbs button{border:0;background:none;padding:0;color:inherit}.crumbs button:hover{color:var(--accent)}.crumbs svg{width:12px}.crumbs strong{color:var(--ink);font-weight:500}.summary{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px 20px;margin-bottom:14px}.summary .large-icon{height:45px;width:45px;display:grid;place-items:center;background:#f0ebf8;color:var(--purple);border-radius:13px}.summary h2{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}.summary .desc{color:var(--muted);font-size:12px}.summary .head{display:flex;align-items:center;gap:8px;margin-left:auto}.head .txt{font-size:12px}.head .txt small{display:block;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:12px;font-weight:600;flex:none;position:relative}.avatar.online:after{content:'';position:absolute;bottom:-1px;right:-1px;border:2px solid var(--surface);width:9px;height:9px;background:#36b96d;border-radius:50%}.summary .btn{font-size:12px;margin-left:6px}.filters{display:flex;align-items:center;gap:8px;margin-bottom:13px}.seg{display:inline-flex;gap:2px;background:#e7e8eb;padding:3px;border-radius:10px}.seg button{border:0;border-radius:8px;background:none;padding:6px 10px;font-size:12px;color:var(--muted)}.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0000000d}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#35b974;margin-right:5px}.filters .btn{font-size:12px;padding:7px 10px}.filters .sp{flex:1}.people{background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden}.table-head,.person{display:grid;grid-template-columns:minmax(200px,1.5fr) minmax(150px,1fr) 60px 90px 95px;align-items:center;gap:12px;padding:12px 18px}.table-head{font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}.person{border-bottom:1px solid var(--line);min-height:62px}.person:hover{background:var(--fill)}.identity{display:flex;align-items:center;gap:10px;min-width:0}.identity b{font-size:13px;font-weight:550}.identity small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.dept-text{font-size:12px;color:var(--muted)}.dept-chip{display:inline-block;max-width:100%;padding:3px 8px;border-radius:6px;background:var(--fill);color:var(--ink-2,var(--ink));font-size:12px;line-height:1.35}.ext{font-size:12px;font-variant-numeric:tabular-nums}.status{font-size:11px;color:var(--muted)}.actions{display:flex;gap:4px;justify-content:flex-end}.actions button{border:0;background:none;color:var(--accent);padding:5px}.actions .star{color:var(--muted)}.group-title{padding:10px 18px;background:var(--fill);font-size:11px;font-weight:600;color:var(--muted);display:flex;gap:8px}.group-title span{font-weight:400}.foot{display:flex;align-items:center;padding:12px 18px;font-size:11px;color:var(--muted);gap:12px}.foot button{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600}.hint{margin:18px auto 26px;max-width:1100px;font-size:13px;color:#65686e;line-height:1.5;text-align:center}.findhint{padding:7px 8px;font-size:11px;color:var(--muted)}.mobile-only{display:none}.phone{width:390px;height:810px;border-radius:24px;margin:28px auto;background:var(--bg);overflow:hidden;border:1px solid var(--line);position:relative;box-shadow:0 18px 65px #00000018}.phone .header{padding:16px}.phone .header h1{font-size:23px}.phone .body{padding:14px}.phone .search{margin-bottom:12px}.phone .btn{font-size:13px}.phone .toolbar{display:flex;gap:8px;margin-bottom:14px}.phone .toolbar .btn:first-child{flex:1;justify-content:space-between}.phone .person-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;margin:8px 0}.phone .person-card .identity{flex:1}.phone .sheet-backdrop{position:absolute;inset:0;background:#00000035;display:none}.phone .sheet{position:absolute;left:0;right:0;bottom:0;height:620px;border-radius:20px 20px 0 0;background:var(--surface);padding:8px 14px 18px;display:none}.phone.sheet-open .sheet,.phone.sheet-open .sheet-backdrop{display:block}.handle{width:34px;height:4px;background:var(--line);border-radius:5px;margin:0 auto 15px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin:0 5px 14px}.sheet-head h3{margin:0;font-size:18px}.sheet-head button{border:0;background:var(--fill);width:28px;height:28px;border-radius:50%}.phone .sheet .tree{max-height:490px;overflow:auto}.stage{display:none}.stage.on{display:block}@media(max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)}.table-head,.person{grid-template-columns:minmax(170px,1.5fr) minmax(120px,1fr) 50px 80px}.actions{display:none}.summary{flex-wrap:wrap}.summary .head{margin-left:0}}[data-theme=dark] .seg{background:var(--fill)}[data-theme=dark] .large-icon{background:#302839}
</style></head>
<body>
<nav class="controls"><strong>Directory · Navigation proposal</strong><button class="active" data-stage="all">1 · All people</button><button data-stage="dept">2 · Department</button><button data-stage="search">3 · Find department</button><button data-stage="phone">4 · Phone</button><button class="theme">Dark mode</button></nav>
<div id="all" class="stage on"></div><div id="dept" class="stage"></div><div id="search" class="stage"></div><div id="phone" class="stage"></div>
<script>
const icon=n=>`<i data-lucide="${n}"></i>`;
function node(label,count,type,active=false,expand=null){return `<button class="node ${active?'active':''}" title="${label}">${expand!==null?`<i class="chev" data-lucide="chevron-${expand?'down':'right'}"></i>`:'<span style="width:12px;flex:none"></span>'}<i class="${type}" data-lucide="${type==='site'?'factory':type==='dept'?'network':type==='unit'?'users':'users-round'}"></i><span class="label">${label}</span><span class="count">${count}</span></button>`}
function tree(mode){const deep=mode!=='all';return `<div class="tree">${node('All people','4,882','all',mode==='all')}${mode==='search'?'<div class="findhint">2 matches · paths expanded</div>':''}${node('SJA Sepanjang','337','site',false,deep)}${deep?`<div class="children">${mode!=='search'?node('BOD, Director & Secretary','2','dept',false,false):''}${node('DAFT','76','dept',false,true)}<div class="children">${node('Finance, Tax & Accounting','56','dept',mode==='dept',true)}<div class="children">${node('Accounting','28','unit')}${node('Finance','14','unit')}${node('Tax','12','unit')}${node('Head','1','unit')}</div>${mode!=='search'?node('General Affairs','18','dept',false,false):''}</div>${mode!=='search'?node('Human Capital','24','dept',false,false)+node('ICT','12','dept',false,false)+node('Operational','162','dept',false,false):node('Operational','162','dept',false,true)+'<div class="children">'+node('Plant Accounting','8','unit')+'</div>'}</div>`:''}</div>`}
function sidebar(mode){return `<aside class="sidebar"><div class="sidehead"><strong>Organization</strong><button class="iconbtn" title="Collapse all">${icon('fold-vertical')}</button></div><div class="search">${icon('search')}<input placeholder="Find a department…" value="${mode==='search'?'Accounting':''}"></div>${tree(mode)}<div class="sidefoot"><input type="checkbox">Show empty<span>4 hidden</span></div></aside>`}
const persons=[['AM','A. Maluslik','Accounting','1124',true],['AR','A’inur Rohmah','Accounting','1131',false],['AN','Aan Suryani','Finance','1140',false],['BD','Budi Dharma','Finance','—',true],['DS','Dewi Sartika','Tax','1152',false],['FN','Fajar Nugroho','Tax','—',false]];
function person(p,all){return `<div class="person" role="button" tabindex="0"><div class="identity"><span class="avatar ${p[4]?'online':''}">${p[0]}</span><span><b>${p[1]}</b>${all?'<small>SJA Sepanjang</small>':''}</span></div><span class="dept-text"><span class="dept-chip">Finance, Tax &amp; Accounting › ${p[2]}</span></span><span class="ext">${p[3]}</span><span class="status">${p[4]?'<span class="dot"></span>Online':'Offline'}</span><span class="actions"><button title="Message">${icon('message-circle')}</button><button title="Call">${icon('phone')}</button><button class="star" title="Favorite">${icon('star')}</button></span></div>`}
function people(all){let rows=all?persons.map(p=>person(p,true)).join(''):['Accounting','Finance','Tax'].map(g=>`<div class="group-title">${g}<span>${g==='Accounting'?'28':g==='Finance'?'14':'12'} people</span></div>`+persons.filter(p=>p[2]===g).map(p=>person(p,false)).join('')).join('');return `<section class="people"><div class="table-head"><span>Name</span><span>Department</span><span>Ext.</span><span>Status</span><span style="text-align:right">Actions</span></div>${rows}<div class="foot"><span>${all?'120 of 4,882 people':'56 people · Includes subunits'}</span><button>${all?'Show 120 more':'All members shown'}</button></div></section>`}
function filters(){return `<div class="filters"><div class="seg"><button class="on">All</button><button><span class="dot"></span>Online</button><button>Busy</button><button>Away</button><button>Offline</button></div><span class="sp"></span><button class="btn">${icon('arrow-down-wide-narrow')}Online first</button><button class="btn">${icon('star')}Favorites</button></div>`}
function desktop(mode){const all=mode==='all';return `<div class="frame"><header class="header"><div><h1>Directory</h1><div class="subtitle">Find a colleague, start a conversation</div></div><div class="right"><div class="search">${icon('search')}<input placeholder="Search name or extension…"></div><button class="btn">${icon('download')}Export</button></div></header><div class="layout">${sidebar(mode)}<main class="content"><nav class="crumbs"><button>All people</button>${!all?icon('chevron-right')+'<button>SJA Sepanjang</button>'+icon('chevron-right')+'<button>DAFT</button>'+icon('chevron-right')+'<strong>Finance, Tax & Accounting</strong>':''}</nav>${filters()}${people(all)}</main></div></div><div class="hint">${all?'Sites start collapsed. Empty sites stay hidden unless “Show empty” is enabled. No extra “Not assigned” node.':mode==='search'?'Search retains matching branches and their ancestors. Clearing it restores your previous navigation.':'Direct to the people list: no summary card. Department keeps its existing Department › Unit chip. Click the label to filter, the chevron to expand.'}</div>`}
for(const m of ['all','dept','search'])document.getElementById(m).innerHTML=desktop(m);
document.getElementById('phone').innerHTML=`<div class="phone"><header class="header"><div><h1>Directory</h1><div class="subtitle">Find a colleague</div></div><button class="iconbtn" style="margin-left:auto">${icon('star')}</button></header><div class="body"><div class="search">${icon('search')}<input placeholder="Search name or extension…"></div><div class="toolbar"><button class="btn" id="departments">${icon('network')}Departments${icon('chevron-down')}</button><button class="btn">${icon('arrow-down-wide-narrow')}Online first</button></div><div class="seg"><button class="on">All</button><button>Online</button><button>Busy</button><button>Away</button></div>${persons.map(p=>`<div class="person-card"><span class="avatar ${p[4]?'online':''}">${p[0]}</span><span class="identity"><span><b>${p[1]}</b><small>${p[2]} · ${p[3]}</small></span></span><button class="iconbtn">${icon('message-circle')}</button></div>`).join('')}</div><div class="sheet-backdrop"></div><div class="sheet"><div class="handle"></div><div class="sheet-head"><h3>Departments</h3><button id="close-sheet">${icon('x')}</button></div><div class="search">${icon('search')}<input placeholder="Find a department…"></div>${tree('dept')}<div class="sidefoot"><input type="checkbox">Show empty</div></div></div><div class="hint">Tap Departments to preview the bottom sheet. Selecting a department closes it and filters the people list.</div>`;
lucide.createIcons();document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('on',s.id===b.dataset.stage));document.querySelectorAll('[data-stage]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('.theme').onclick=e=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.target.textContent=dark?'Light mode':'Dark mode'};document.getElementById('departments').onclick=()=>document.querySelector('.phone').classList.add('sheet-open');document.getElementById('close-sheet').onclick=()=>document.querySelector('.phone').classList.remove('sheet-open');document.querySelector('.sheet-backdrop').onclick=()=>document.querySelector('.phone').classList.remove('sheet-open');
</script></body></html>
