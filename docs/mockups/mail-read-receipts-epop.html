<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPop · Mail — Read receipts, recipients &amp; EPop archive layout (Apple style)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   Tokens — same as meeting-scheduling-v3.html
   ============================================================ */
:root{
  --frame:#123528; --frame-2:#1b4635; --frame-ink:#e9f1ec; --frame-ink-2:#9fb9ab; --frame-line:rgba(255,255,255,.09);
  --content:#f5f5f7; --card:#ffffff; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08);
  --sep:rgba(60,60,67,.14); --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --ink-4:#aeaeb2;
  --green:#2e9e5b; --green-soft:rgba(46,158,91,.12); --sel:#F0F9F3; --red:#ff3b30; --blue:#0a84ff; --orange:#ff9f0a;
  --glass:rgba(255,255,255,.72); --pop:0 24px 60px -18px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.08);
  --ease:cubic-bezier(.32,.72,0,1);
  --mail-green:#3a7d1f;
}
.dark{
  --frame:#0a1f17; --frame-2:#143326; --content:#000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --sep:rgba(84,84,88,.6); --ink:#f5f5f7; --ink-2:#d1d1d6; --ink-3:#98989d; --ink-4:#636366;
  --green:#30d158; --green-soft:rgba(48,209,88,.14); --sel:rgba(48,209,88,.1); --glass:rgba(44,44,46,.72);
  --mail-green:#7cc35a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-.011em;color:var(--ink);background:#0b0b0c;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg.lucide{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid rgba(10,132,255,.55);outline-offset:2px;border-radius:10px}
.tnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- mockup chrome ---------- */
.mock-top{position:fixed;z-index:300;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0b0b0c;border-bottom:.5px solid rgba(255,255,255,.1)}
.mock-top .lbl{color:#8e8e93;font-size:12px;font-weight:650;white-space:nowrap;margin-right:4px}
.mock-top .lbl b{color:#f5f5f7}
.mock-tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.08)}
.mock-tabs button{color:#d1d1d6;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:9px;white-space:nowrap}
.mock-tabs button em{font-style:normal;opacity:.5;margin-right:5px}
.mock-tabs button.on{background:#fff;color:#1d1d1f}
.mock-sp{flex:1}
.mock-tg{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:10px;color:#d1d1d6;font-size:12px;font-weight:600;background:rgba(255,255,255,.08);white-space:nowrap}
.mock-tg svg{width:14px;height:14px}
.mock-tg.on{background:#fff;color:#1d1d1f}
.mock-tg:disabled{opacity:.3;cursor:default}
.ann{position:fixed;z-index:250;left:10px;bottom:84px;width:236px;padding:12px 13px;border-radius:14px;background:rgba(255,251,230,.97);color:#4d3d0f;font-size:11.5px;line-height:1.48;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ann > b{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12.5px}
.ann > b button{font-size:11px;font-weight:600;color:#8a6d1c}
.ann ul{padding-left:15px}
.ann .foot{margin-top:8px;padding-top:8px;border-top:.5px solid rgba(77,61,15,.18);font-size:11px;color:#6b5718}
.ann .vars{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-top:8px;border-top:.5px solid rgba(77,61,15,.18)}
.ann .vars button{height:24px;padding:0 9px;border-radius:999px;background:rgba(77,61,15,.1);font-size:11px;font-weight:650;color:#4d3d0f}
.ann .vars button.on{background:#4d3d0f;color:#fff8dc}
.ann.min ul,.ann.min .vars,.ann.min .foot{display:none}
#root{position:fixed;inset:52px 0 0 0;overflow:hidden}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;grid-template-rows:64px minmax(0,1fr);height:100%;background:var(--frame);color:var(--frame-ink)}
.side{grid-row:1/span 2;display:flex;flex-direction:column;padding:16px 0 14px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 12px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#d9a46a,#8a5a3c);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.nav{flex:1;overflow:auto;scrollbar-width:none}
.grp{padding:8px 0 4px}
.grp + .grp{border-top:1px solid var(--frame-line);margin-right:14px}
.grp-h{display:flex;align-items:center;gap:8px;padding:2px 10px 6px;font-size:12.5px;font-weight:700;color:#fff}
.grp-h span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.grp-h span svg{width:12px;height:12px;color:#fff}
.item{position:relative;display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;margin:0 14px 1px 0;border-radius:11px;font-size:14.5px;font-weight:550;color:var(--frame-ink);cursor:pointer}
.item svg{width:19px;height:19px}
.item:hover{background:var(--frame-2)}
.item.active{margin-right:0;border-radius:13px 0 0 13px;background:var(--content);color:var(--ink);font-weight:700}
.item.active::before,.item.active::after{content:"";position:absolute;right:0;width:16px;height:16px;pointer-events:none}
.item.active::before{top:-16px;border-bottom-right-radius:13px;box-shadow:6px 6px 0 6px var(--content)}
.item.active::after{bottom:-16px;border-top-right-radius:13px;box-shadow:6px -6px 0 6px var(--content)}
.g-work svg{color:#6fd3a3}.g-comm svg{color:#8ab6f5}.g-res svg{color:#f2b56b}.g-adm svg{color:#c3b5f5}
.item.active svg{color:var(--green)!important}
.item .nb{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ff453a;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:10px;margin:8px 14px 0 0;padding:8px;border-radius:13px;border:1px solid var(--frame-line)}
.me .av0{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#d9a46a,#8a5a3c);display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.me b{display:block;font-size:13.5px}.me small{color:var(--frame-ink-2);font-size:12px}
.top{display:flex;align-items:center;gap:14px;padding:0 24px 0 18px}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.022em;color:#fff}
.top .search{margin-left:auto;width:340px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:9px;padding:0 13px;color:#bcd0c5;font-size:14px}
.top .search kbd{margin-left:auto;font:inherit;font-size:12px;opacity:.7}
.top .ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#dbe7e0}
.panel{position:relative;background:var(--content);border-radius:18px 0 0 0;overflow:hidden;min-height:0;color:var(--ink)}

/* ---------- mail 3-column ---------- */
.mail-area{display:grid;grid-template-columns:220px 340px minmax(0,1fr);gap:16px;padding:14px 20px 20px;height:100%}
.mcard{background:var(--card);border-radius:16px;box-shadow:0 0 0 .5px var(--sep),0 1px 2px rgba(0,0,0,.04);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.compose{margin:14px 14px 8px;height:38px;border-radius:11px;background:var(--green);color:#fff;font-weight:650;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px}
.compose svg{width:16px;height:16px}
.fh{padding:10px 18px 4px;font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:1px}
.fh small{font-size:12px;color:var(--ink-3);font-weight:500}
.tree{padding:2px 8px;overflow:auto;flex:1}
.tn{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink)}
.tn svg{width:16px;height:16px;color:var(--ink-3)}
.tn .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tn .n.acc{color:var(--green);font-weight:700}
.tn.on{background:var(--green-soft);font-weight:650}
.tn.on svg{color:var(--green)}
.tsite{padding:12px 10px 4px;font-size:11.5px;font-weight:650;color:var(--ink-3)}
.lbl-dot{width:9px;height:9px;border-radius:50%;margin:0 3px}

.lhead{display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:56px;border-bottom:1px solid var(--sep)}
.lhead b{font-size:14px}
.lhead small{color:var(--ink-3);font-size:12px}
.lhead .sp{flex:1}
.ibtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.ibtn:hover{background:var(--fill)}
.ibtn svg{width:16px;height:16px}
.rows{overflow:auto;flex:1}
.row{padding:10px 14px 10px 13px;border-bottom:1px solid var(--sep);border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--fill-2)}
.row.unread{border-left-color:var(--green)}
.row.sel{background:var(--sel);border-left-color:var(--green)}
.r1{display:flex;align-items:center;gap:6px;min-width:0}
.r1 .from{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .from{font-weight:750}
.r1 .tm{font-size:12px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:5px}
.r1 .tm svg{width:13px;height:13px}
.r1 .tm .arc{color:var(--ink-3);display:inline-grid;place-items:center}
.r1 .rr{color:var(--green)}
.r2{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.r3{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .cnt{font-size:11px;font-weight:650;color:var(--ink-3);background:var(--fill);border-radius:6px;padding:0 5px;margin-left:4px}
[data-tip]{position:relative}
[data-tip].tip-on::after{content:attr(data-tip);position:absolute;right:-6px;top:calc(100% + 6px);white-space:nowrap;background:#1d1d1f;color:#fff;font-size:11.5px;font-weight:550;padding:5px 8px;border-radius:7px;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.25)}

/* ---------- reading pane ---------- */
.dbar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--sep);flex:none}
.reply{height:32px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;border-radius:9px;background:var(--green);color:#fff;font-size:13px;font-weight:600}
.reply svg{width:14px;height:14px}
.ghost{height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;border-radius:9px;font-size:13px;color:var(--ink-2)}
.ghost:hover{background:var(--fill)}
.ghost svg{width:14px;height:14px}
.dbar .sp{flex:1}
.dscroll{overflow:auto;flex:1;min-height:0;padding:18px 22px 40px}
.subj{font-size:21px;font-weight:700;letter-spacing:-.022em;line-height:1.25;margin:0 0 14px;max-width:760px}
.subj .tagx{display:inline-flex;vertical-align:3px;margin-left:8px;height:22px;padding:0 8px;border-radius:7px;align-items:center;gap:5px;font-size:11.5px;font-weight:650;color:var(--ink-3);background:var(--fill)}
.subj .tagx svg{width:12px;height:12px}

.thr{display:flex;flex-direction:column;gap:8px}
.tmsg{border-radius:14px;box-shadow:0 0 0 .5px var(--sep);background:var(--card)}
.tmsg.col{cursor:pointer}
.tmsg.col:hover{background:var(--fill-2)}
.th{display:flex;align-items:center;gap:11px;padding:11px 14px}
.th .who{flex:1;min-width:0}
.th .nm{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .snip{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .when{font-size:12px;color:var(--ink-3);white-space:nowrap;display:flex;gap:6px;align-items:center}
.th .when svg{width:14px;height:14px}
.th .when .ck{color:var(--green)}
.th .when .ck.part{color:var(--ink-3)}
.open-h{padding:16px 18px 6px;display:flex;gap:12px;align-items:flex-start}
.open-h .who{flex:1;min-width:0}
.open-h .nm{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.open-h .nm small{font-weight:500;color:var(--ink-3);font-size:12.5px}
.open-h .dt{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.av{--s:28px;width:var(--s);height:var(--s);min-width:var(--s);border-radius:calc(var(--s)*.28);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:calc(var(--s)*.38);letter-spacing:0;line-height:1}
.av.grp{background:var(--fill)!important;color:var(--ink-2)}
.av.grp svg{width:calc(var(--s)*.55);height:calc(var(--s)*.55)}

/* recipients line */
.rcp{margin-top:6px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);position:relative}
.rl{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap}
.rl > em{font-style:normal;color:var(--ink-3);width:26px;flex:none}
.rl .names{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rl .gchip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:6px;background:var(--fill);font-weight:550;color:var(--ink-2)}
.rl .gchip svg{width:12px;height:12px;color:var(--ink-3)}
.more-b{flex:none;height:22px;padding:0 8px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:12px}
.more-b:hover{filter:brightness(.97)}
.more-b.on{background:var(--green);color:#fff}
.rl .bccnote{color:var(--ink-3);font-size:11.5px;margin-left:6px;display:inline-flex;gap:4px;align-items:center}
.rl .bccnote svg{width:12px;height:12px}

/* receipts row (chat .seen-by feel) */
.rcpt-wrap{position:relative;padding:4px 18px 10px 58px;display:flex;flex-wrap:wrap;align-items:center;row-gap:4px}
.seen{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 8px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--fill-2)}
button.seen:hover{background:var(--fill)}
.seen.on{background:var(--green-soft);color:var(--green)}
.seen .cc{width:16px;height:16px;color:var(--green)}
.seen .cc.grey{color:var(--ink-3)}
.seen.muted{background:transparent;color:var(--ink-3);font-weight:500;padding-left:0;cursor:default}
.seen.muted svg{width:14px;height:14px;color:var(--ink-4)}
.seen .tn2{font-variant-numeric:tabular-nums}
.stk{display:inline-flex;align-items:center}
.stk .av{box-shadow:0 0 0 1.5px var(--card)}
.stk .av + .av{margin-left:-5px}
.seen .chev{width:13px;height:13px;opacity:.6}
.seen-hint{font-size:11.5px;color:var(--ink-3);margin-left:8px}

/* popovers */
.pop{position:absolute;z-index:40;background:var(--card);border-radius:16px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden;animation:pin .18s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(-4px)}}
.dark .pop{background:#2c2c2e;box-shadow:0 30px 70px -20px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.12)}
.ph{flex:none;display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.ph b{font-size:15px;letter-spacing:-.015em;flex:1}
.xb{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-3)}
.xb svg{width:13px;height:13px;stroke-width:2.4}
.seg{flex:none;display:flex;padding:2px;border-radius:10px;background:var(--fill);margin:0 14px 10px}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;font-weight:550;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button svg{width:14px;height:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.dark .seg button.on{background:#636366}
.srch{flex:none;margin:0 14px 8px;height:34px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--ink-3)}
.srch svg{width:15px;height:15px}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13.5px}
.srch input::placeholder{color:var(--ink-3)}
.plist{overflow:auto;flex:1;padding:0 6px 10px}
.psec{padding:10px 10px 4px;font-size:11.5px;font-weight:650;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.psec svg{width:13px;height:13px}
.psec .n{margin-left:auto;font-weight:600}
.pr{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;min-width:0}
.pr:hover{background:var(--fill-2)}
.pr .t{flex:1;min-width:0}
.pr .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .st{font-size:12px;color:var(--ink-3);white-space:nowrap;text-align:right;display:flex;align-items:center;gap:4px}
.pr .st svg{width:13px;height:13px}
.pr .st.rd{color:var(--green)}
.pr .st.rd b{font-weight:600;color:var(--ink-2)}
.gr{width:100%;text-align:left}
.gr .meter{width:46px;height:5px;border-radius:3px;background:var(--fill);overflow:hidden;flex:none}
.gr .meter i{display:block;height:100%;background:var(--green);border-radius:3px}
.gr .cv{width:15px;height:15px;color:var(--ink-3);transition:transform .2s}
.gr.open .cv{transform:rotate(90deg)}
.gkids{margin-left:22px;border-left:1px solid var(--sep);padding-left:4px}
.pfoot{padding:9px 14px 12px;font-size:11.5px;color:var(--ink-3);border-top:.5px solid var(--sep);display:flex;gap:6px;align-items:flex-start}
.pfoot svg{width:13px;height:13px;flex:none;margin-top:1px}

/* recipients panel */
.rpanel{width:540px;max-height:520px}
.rp-body{overflow:auto;padding:0 10px 12px}
.rp-sec{padding:8px 6px 6px;font-size:12px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between}
.rp-sec small{font-weight:550;color:var(--ink-3)}
.ppl{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.ppl .pr{padding:5px 6px}
.ppl .tg{font-size:10.5px;font-weight:700;color:var(--ink-3);background:var(--fill);border-radius:5px;padding:1px 5px}
.site{margin:4px 0 8px;padding:8px 10px 10px;border-radius:12px;background:var(--fill-2)}
.site h5{font-size:12px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:7px}
.site h5 svg{width:13px;height:13px;color:var(--ink-3)}
.site h5 small{margin-left:auto;font-weight:550;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:8px;background:var(--card);box-shadow:0 0 0 .5px var(--sep);font-size:12.5px;font-weight:550;white-space:nowrap}
.dark .gc{background:#3a3a3c}
.gc i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--c);color:#fff}
.gc i svg{width:12px;height:12px}
.gc small{color:var(--ink-3);font-weight:500;font-size:11.5px}

/* ---------- message body: EPop archive reading column ---------- */
.bodywrap{position:relative;padding:4px 18px 18px}
.fmt-tg{position:absolute;top:2px;right:18px;z-index:5;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 4px 0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--fill-2)}
.fmt-tg .sw{width:30px;height:18px;border-radius:9px;background:var(--ink-4);position:relative;transition:background .2s}
.fmt-tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.fmt-tg.on{color:var(--green)}
.fmt-tg.on .sw{background:var(--green)}
.fmt-tg.on .sw::after{transform:translateX(12px)}
.arch-note{max-width:760px;margin:0 auto 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.arch-note svg{width:14px;height:14px}
.mbody{max-width:760px;margin:0 auto;font-size:15px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.mbody p{margin:0 0 .85em}
.mbody .h-green{color:var(--mail-green);font-weight:700;font-size:17px;line-height:1.35;margin:0 0 .7em;letter-spacing:-.01em}
.mbody .kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;margin:0 0 .9em;padding:12px 14px;border-radius:12px;background:var(--fill-2)}
.mbody .kv dt{color:var(--ink-3)}
.mbody .kv dd{font-weight:600}
.mbody .tagline{color:var(--mail-green);font-weight:700}
.mbody .sig{color:var(--ink-2);font-size:14px}
.mbody .sig b{color:var(--ink)}
.poster{position:relative;margin:4px 0 16px;border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:16/9;width:100%;
  background:
    radial-gradient(circle at 78% 62%, #6b3f22 0 13%, transparent 13.5%),
    radial-gradient(ellipse 15% 4% at 78% 74%, #3b2414 0 90%, transparent 92%),
    radial-gradient(circle at 78% 58%, rgba(255,240,210,.0) 0 9%, transparent 9.5%),
    radial-gradient(ellipse 30% 22% at 12% 18%, #8fd16a 0 40%, transparent 41%),
    radial-gradient(ellipse 22% 16% at 22% 86%, #4c9a35 0 40%, transparent 41%),
    radial-gradient(ellipse 18% 30% at 92% 12%, #5fae3f 0 40%, transparent 41%),
    linear-gradient(150deg,#e8f4d8 0%,#cfe8b4 38%,#9fcf7c 70%,#4f8f34 100%)}
.poster .pt{position:absolute;left:6%;top:14%;width:58%;color:#1f4d12}
.poster .pt small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:#2e6b1a}
.poster .pt b{display:block;font-size:24px;line-height:1.08;font-weight:850;letter-spacing:-.02em;margin:6px 0}
.poster .pt span{display:inline-block;font-size:11.5px;font-weight:700;background:#1f4d12;color:#eaf6dc;border-radius:999px;padding:3px 10px}
.poster .cup{position:absolute;left:69%;top:44%;width:19%;height:34%;border-radius:6px 6px 40% 40%;background:linear-gradient(180deg,#fff,#efe6d8);box-shadow:inset -6px 0 0 rgba(0,0,0,.05)}
.poster .cup::before{content:"";position:absolute;left:8%;right:8%;top:6%;height:18%;border-radius:50%;background:#5a3418}
.poster .cup::after{content:"";position:absolute;right:-22%;top:24%;width:26%;height:36%;border:5px solid #efe6d8;border-left:0;border-radius:0 40% 40% 0}
.poster .leaf{position:absolute;width:16%;height:8%;border-radius:0 100% 0 100%;background:#3d8a2a;transform:rotate(-28deg)}
.poster .zoom{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:600;backdrop-filter:blur(8px)}
.poster .zoom svg{width:13px;height:13px}
.qtg{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--fill-2);color:var(--ink-3);font-size:12.5px;font-weight:600;margin-top:4px}
.qtg svg{width:13px;height:13px}
.quote{margin-top:10px;padding:2px 0 2px 14px;border-left:2px solid var(--ink-4);color:var(--ink-2);font-size:14px}
.quote .qh{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}

/* original formatting (raw EPop look) */
.mbody.orig{max-width:none;margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:13px;line-height:1.25;color:#000;background:#fff;padding:16px;border-radius:10px;box-shadow:inset 0 0 0 1px #ddd}
.mbody.orig p{margin:0 0 10px}
.mbody.orig .h-green{font-size:34px;line-height:1.1;color:#3a7d1f;font-family:"Arial Black",Arial,sans-serif;font-weight:900}
.mbody.orig .kv{background:none;padding:0;display:block}
.mbody.orig .kv dt,.mbody.orig .kv dd{display:inline;color:#000;font-weight:400}
.mbody.orig .kv dd::after{content:"";display:block}
.mbody.orig .tagline{font-size:20px}
.mbody.orig .poster{width:1100px;max-width:none;border-radius:0;cursor:default}
.mbody.orig .poster .zoom{display:none}
.mbody.orig .quote{border-left:6px solid #3a7d1f;padding-left:12px;color:#000;font-size:13px}
.origwrap{overflow-x:auto;max-width:100%}
.orig-note{font-size:12px;color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.orig-note svg{width:13px;height:13px;color:var(--orange)}

/* ---------- phone ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;background:#e9e9ee;overflow:hidden}
.dark .stage{background:#111}
.phones{display:flex;gap:48px;align-items:flex-start}
.pcap{text-align:center;margin-top:14px;font-size:13px;font-weight:650;color:#3a3a3c}
.dark .pcap{color:#d1d1d6}
.phone{width:414px;height:868px;border-radius:60px;background:#000;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 0 0 2px #2c2c2e;position:relative}
.scr{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--card);color:var(--ink)}
.isl{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000;z-index:60}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-size:15.5px;font-weight:650;z-index:55}
.sbar .si{display:flex;gap:6px;align-items:center}
.sbar .si svg{width:17px;height:17px}
.hbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:70}
.pv{position:absolute;inset:50px 0 0 0;overflow:auto;scrollbar-width:none}
.pnav{display:flex;align-items:center;gap:6px;padding:6px 12px 4px}
.pnav .back{display:flex;align-items:center;gap:1px;color:var(--green);font-size:16px;font-weight:500}
.pnav .back svg{width:22px;height:22px}
.pnav .sp{flex:1}
.pnav .pb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--green)}
.pnav .pb svg{width:20px;height:20px}
.scr .subj{font-size:19px;padding:4px 16px 0;margin-bottom:8px}
.scr .open-h{padding:8px 16px 4px}
.scr .rcpt-wrap{padding:4px 16px 10px 16px}
.scr .bodywrap{padding:4px 16px 120px}
.scr .fmt-tg{position:static;margin:0 0 10px}
.scr .mbody{font-size:15px}
.scr .poster .pt b{font-size:17px}
.scr .rl .names{max-width:210px}
.ptb{position:absolute;left:0;right:0;bottom:0;height:84px;padding:10px 26px 0;display:flex;justify-content:space-between;background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-top:.5px solid var(--sep);z-index:50;color:var(--green)}
.ptb svg{width:24px;height:24px}
.pdim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:52}
.bsheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 92px);border-radius:28px 28px 0 0;z-index:53;background:var(--card);display:flex;flex-direction:column;animation:up .35s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.dark .bsheet{background:#1c1c1e}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--ink-4);margin:7px auto 0;opacity:.7;flex:none}
.bsheet .plist{padding-bottom:8px}
.bsheet .pfoot{padding-bottom:28px}
.bsheet .pr{padding:9px 8px}
.bsheet .rp-body{padding-bottom:34px}
.bsheet .ppl{grid-template-columns:1fr}
.mass-big{padding:14px 18px 34px;text-align:center}
.mass-big .ring{width:120px;height:120px;border-radius:50%;margin:6px auto 12px;background:conic-gradient(var(--green) 0 41.2%, var(--fill) 41.2% 100%);display:grid;place-items:center}
.mass-big .ring div{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;font-weight:800;letter-spacing:-.02em}
.dark .bsheet .mass-big .ring div{background:#1c1c1e}
.mass-big p{font-size:13px;color:var(--ink-3);max-width:290px;margin:0 auto}
</style>
</head>

    <section class="mcard" id="readerCard"><div class="dbar"><button class="reply">${ic('reply')}Reply</button>
      <button class="ghost">${ic('replyall')}Reply all</button><button class="ghost">${ic('fwd')}Forward</button><span class="sp"></span>
      <button class="ibtn">${ic('archive')}</button><button class="ibtn">${ic('trash')}</button><button class="ibtn">${ic('star')}</button><button class="ibtn">${ic('more')}</button></div>
      <div class="dscroll" id="dscroll">${reader('desk')}</div></section></div>`);
}

/* ============================================================
   Phone
   ============================================================ */
function phoneScr(withSheet) {
  const sheet = withSheet
    ? (screen === 'old'
        ? `<div class="pdim"></div><div class="bsheet"><span class="grab"></span>${rcpPanelInner()}</div>`
        : `<div class="pdim"></div><div class="bsheet"><span class="grab"></span>${sheetInner('phone')}</div>`)
    : '';
  return `<div class="phone"><div class="scr"><div class="isl"></div>
    <div class="sbar"><span>9:41</span><span class="si">${ic('signal')}${ic('wifi')}${ic('battery')}</span></div>
    <div class="pv"><div class="pnav"><button class="back">${ic('chevL')}${screen === 'sender' ? 'Sent' : screen === 'old' ? 'Arsip EPop' : 'Inbox'}</button><span class="sp"></span>
      <button class="pb">${ic('archive')}</button><button class="pb">${ic('trash')}</button><button class="pb">${ic('more')}</button></div>
      ${reader('phone')}</div>
    <nav class="ptb">${ic('reply')}${ic('replyall')}${ic('fwd')}${ic('pen')}</nav>
    ${sheet}<span class="hbar"></span></div></div>`;
}
function phoneView() {
  const cap2 = screen === 'old' ? 'Recipients · bottom sheet' : screen === 'mass' ? 'Mass mail · count only' : 'Read receipts · bottom sheet';
  return `<div class="stage"><div class="phones">
    <div>${phoneScr(false)}<div class="pcap">Reading pane · receipts row</div></div>
    <div>${phoneScr(true)}<div class="pcap">${cap2}</div></div></div></div>`;
}

/* ============================================================
   Annotations
   ============================================================ */
const ANN = {
  sender:['Sender view — you replied to all',['Receipts row under the header: ✓✓ Read by 12 of 41 + avatar stack; click opens the sheet.','Your own Bcc is visible to you only — never to others.','Collapsed thread items show only a small ✓✓ (green = everyone read).','Variants below: single recipient read / delivered, external address.'],
    [['group','41 recipients'],['single-read','1 · Read'],['single-del','1 · Delivered'],['external','External']]],
  recipient:['Recipient view — same receipts for everyone',['Receipts are visible to all recipients, not just the sender.','To/Cc collapse to one line each; +38 opens the full list grouped People / Groups by site.','Read sheet: Read by · 12 / Not yet · 29, search, groups expand to members.','EPop body: 760px column, 15/1.6, colours + bold kept, quote collapsed.'],[]],
  mass:['Mass mail — as a recipient',['Only the count: Read by 412 of 1000. No names, no avatars.','The sheet shows a progress ring and explains why names are hidden.'],[]],
  old:['Old mail — EPop archive',['Read status not tracked before 14 Oct.','List rows: no “Arsip EPop” badge; small archive icon next to the date (tooltip “Imported from EPop”).','Toggle “Original formatting” to see the raw EPop layout (giant heading, thick green quote bar, full-width image).'],[]],
};

/* ============================================================
   Render
   ============================================================ */
function tg(id, on, icn, label, dis) { const b = $(id); b.className = 'mock-tg' + (on ? ' on' : ''); b.disabled = !!dis; b.innerHTML = ic(icn) + label; }
function render() {
  document.documentElement.className = theme === 'dark' ? 'dark' : '';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.s === screen));
  const sheetOk = screen !== 'old' && !(screen === 'sender' && S.variant !== 'group');
  tg('#sheetTg', S.sheet && sheetOk, 'cc', 'Read sheet', !sheetOk);
  tg('#rcpTg', S.rcp && screen !== 'mass', 'users', 'Recipients panel', screen === 'mass' || (screen === 'sender' && S.variant !== 'group'));
  tg('#fmtTg', S.orig, 'type', 'Original formatting', screen === 'sender');
  tg('#phoneTg', phone, phone ? 'monitor' : 'smartphone', phone ? 'Desktop' : 'Phone (390)');
  tg('#themeTg', theme === 'dark', theme === 'dark' ? 'sun' : 'moon', theme === 'dark' ? 'Light' : 'Dark');
  const [t, items, vars] = ANN[screen];
  $('#ann').className = 'ann' + (annMin ? ' min' : '');
  $('#ann').innerHTML = `<b>${t}<button id="annTg">${annMin ? 'Show' : 'Hide'}</button></b><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
    ${vars.length ? `<div class="vars">${vars.map(([k, l]) => `<button data-var="${k}" class="${S.variant === k ? 'on' : ''}">${l}</button>`).join('')}</div>` : ''}
    <div class="foot"><b>Read</b> = opened in the reading pane, tab focused, ≥2 s. Mark as read never counts.</div>`;
  $('#ann').style.display = phone ? 'none' : '';
  $('#root').innerHTML = phone ? phoneView() : desktop();
  if (phone) fitPhones();
}
function fitPhones() {
  const ph = document.querySelector('.phones'); if (!ph) return;
  ph.style.zoom = 1; const st = ph.parentElement;
  const z = Math.min(1, (st.clientWidth - 40) / ph.scrollWidth, (st.clientHeight - 40) / ph.scrollHeight);
  ph.style.zoom = z.toFixed(3);
}
window.addEventListener('resize', () => phone && fitPhones());

document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); document.querySelectorAll('.tip-on').forEach(x => x !== t && x.classList.remove('tip-on')); if (t) t.classList.add('tip-on'); });
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('#tabs button'); if (tab) { screen = tab.dataset.s; S.quote = false; history.replaceState(null, '', '#' + screen); render(); return; }
  if (t.closest('#themeTg')) { theme = theme === 'light' ? 'dark' : 'light'; render(); return; }
  if (t.closest('#phoneTg')) { phone = !phone; render(); return; }
  if (t.closest('#sheetTg')) { S.sheet = !S.sheet; if (S.sheet) S.rcp = false; render(); return; }
  if (t.closest('#rcpTg')) { S.rcp = !S.rcp; if (S.rcp) S.sheet = false; render(); return; }
  if (t.closest('#fmtTg')) { S.orig = !S.orig; render(); return; }
  if (t.closest('#annTg')) { annMin = !annMin; render(); return; }
  const v = t.closest('[data-var]'); if (v) { S.variant = v.dataset.var; S.sheet = false; S.rcp = false; render(); return; }
  const tb = t.closest('[data-tab]'); if (tb) { S.tab = tb.dataset.tab; keepScroll(render); return; }
  const a = t.closest('[data-act]'); if (a) {
    const k = a.dataset.act;
    if (k === 'sheet') { S.sheet = !S.sheet; if (S.sheet) S.rcp = false; }
    if (k === 'rcp') { S.rcp = !S.rcp; if (S.rcp) S.sheet = false; }
    if (k === 'orig') S.orig = !S.orig;
    if (k === 'quote') S.quote = !S.quote;
    if (k === 'ict') S.ictOpen = !S.ictOpen;
    keepScroll(render); return;
  }
  if ((S.sheet || S.rcp) && !t.closest('.pop') && !phone) { S.sheet = false; S.rcp = false; keepScroll(render); }
});
function keepScroll(fn) { const d = $('#dscroll'), y = d ? d.scrollTop : 0; const pl = $('.plist'), py = pl ? pl.scrollTop : 0; fn(); if ($('#dscroll')) $('#dscroll').scrollTop = y; if ($('.plist')) $('.plist').scrollTop = py; }
window.addEventListener('hashchange', () => { screen = location.hash.slice(1) || 'recipient'; render(); });
if (!ANN[screen]) screen = 'recipient';
render();
</script>
</body>
</html>
