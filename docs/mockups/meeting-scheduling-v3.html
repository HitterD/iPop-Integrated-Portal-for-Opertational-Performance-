    <div class="stc"><h5>Adding a whole group asks first</h5><div class="ctoast"><span class="gi" style="background:#2e9e5b">${ic('msgs')}</span><span><b>Add 13 people from ICT IPOP?</b><span>4 are already invited</span></span><button class="tb">Cancel</button><button class="tb p">Add 13</button></div></div>
    <div class="stc"><h5>Over the room size</h5><div class="warn">${ic('alert')}<span style="flex:1"><b>21 people — Kalosi fits 20</b><span>Remove one person, or move to a bigger room.</span>
      <div class="cap-m"><i style="width:100%"></i></div>
      <div class="wb"><button class="rchip r-toraja"><i class="sw"></i>Move to Toraja<em>· free</em></button><button class="btn gray sm">Keep in Kalosi</button></div></span></div></div>
    <div class="stc"><h5>Added people</h5><div class="group" style="padding:12px">${pickerCollapsed(['alphin', 'beny', 'yudi', 'jason'], ['jason'])}</div></div>
  </div>`;
  return shell('calls', 'Calls &amp; Meetings', `<div class="pkpage">${left}${right}</div>`);
}

/* ============================================================
   6 · New event sheet
   ============================================================ */
const KINDS = [['none', 'k-event', 'calendar', 'Event', 'Just a time on the calendar'], ['voice', 'k-voice', 'headphones', 'Voice call', 'Audio only, join from anywhere'],
  ['room', 'r-kalosi', 'video', 'Meeting room', 'One of 5 rooms · video, share, record'], ['person', 'k-person', 'pin', 'In person', 'A place, no call link']];
const RFB = {robusta:['Free', 0], arabika:['Busy 13:00–14:30', 1], kalosi:['Free', 0], kapal:['Busy 12:00–13:30', 1], toraja:['Free', 0]};
function eventSheet(bottom) {
  const k = S.kind;
  const tiles = KINDS.map(([v, cls, icn, b, s]) => `<button class="ktile ${k === v ? 'on' : ''}" data-kind="${v}"><span class="kt ${cls}">${ic(icn)}</span><b>${b}</b><span>${s}</span></button>`).join('');
  let extra = '';
  if (k === 'room') {
    const id = bottom ? 'pe' : 'ev';
    if (!TL[id] || TL[id].room !== S.room) TL[id] = {room:S.room, s:780, e:840};
    extra = `<div class="gh">Room · for Wed 14 Oct, 13:00–14:00</div><div class="rtiles">${Object.keys(ROOMS).map(r => `<button class="rtile r-${r} ${RFB[r][1] ? 'busy' : ''} ${S.room === r ? 'on' : ''}" data-room="${r}">${bean()}<b>${ROOMS[r]}</b><small>up to 20</small><span class="fs">${RFB[r][0]}</span></button>`).join('')}</div>
      ${timeline(id, S.room)}<div class="js-clash"></div>`;
  }
  if (k === 'voice') extra = `<div class="kinfo k-voice"><span class="kt k-voice">${ic('headphones')}</span><span>Everyone gets a <b>Join call</b> button in the invite and the reminder. Audio only, from PC or phone.</span></div>`;
  if (k === 'person') extra = `<label class="fl"><span>Where</span><div class="tf">${ic('pin')}&nbsp; ICT office, 2nd floor</div></label>`;
  const wd = 'Wed 14 Oct';
  return `<section class="sheet2 wide ${bottom ? 'bottom' : ''}" role="dialog" aria-label="New event">
    ${bottom ? '<div class="grab"></div><div class="ios-h"><button>Cancel</button><b>New event</b><button class="s">Save</button></div>'
      : `<div class="sh-h"><span class="sw k-event">${ic('calplus')}</span><span><b>New event</b><small>In your calendar · Bagastyo</small></span><button class="x">${ic('x')}</button></div>`}
    <div class="sh-b">
      <label class="fl"><span>Title</span><div class="tf focus">Vendor onboarding · Fortinet</div></label>
      <div class="gh" style="margin-top:2px">Kind</div><div class="ktiles">${tiles}</div>
      ${extra}
      <div class="ig frm">
        <div class="ir"><span class="tile t-red">${ic('calendar')}</span><span class="t"><b>Starts</b></span><span class="rv"><button class="pill">${wd}</button><button class="pill time js-s">13:00</button></span></div>
        <div class="ir"><span class="tile t-red" style="opacity:0"></span><span class="t"><b>Ends</b></span><span class="rv"><button class="pill">${wd}</button><button class="pill time js-e">14:00</button></span></div>
        <div class="ir"><span class="tile t-orange">${ic('clock')}</span><span class="t"><b>All day</b></span><button class="toggle" role="switch" aria-checked="false" data-tg></button></div>
        <div class="ir"><span class="tile t-gray">${ic('repeat')}</span><span class="t"><b>Repeat</b></span><span class="selv">Never${ic('chevUD')}</span></div>
        <div class="ir"><span class="tile t-purple">${ic('bell')}</span><span class="t"><b>Alert</b></span><span class="selv">10 minutes before${ic('chevUD')}</span></div>
        <div class="ir"><span class="tile t-blue">${ic('eye')}</span><span class="t"><b>Who can see it</b><span>Others with access see the title, or Busy if Private</span></span><span class="seg3" data-seg><button class="on">Normal</button><button>${ic('lock')}Private</button></span></div>
      </div>
      <div class="ig frm" style="margin-top:12px">
        <div class="ir top"><span class="tile t-green">${ic('userplus')}</span><span class="t"><b>Participants</b>${pickerCollapsed(['beny', 'alphin', 'jason'], ['jason'])}</span></div>
        <div class="ir top"><span class="tile t-orange">${ic('file')}</span><span class="t"><b>Agenda</b><div class="tf area" style="margin-top:6px">Demo of FortiGate 120G, licence terms, rollout to Sepanjang and Karawang.</div></span></div>
      </div>
    </div>
    ${bottom ? '' : `<div class="sh-f"><span class="spacer"></span><button class="btn gray">Cancel</button><button class="btn filled">Save</button></div>`}
  </section>`;
}
function scrEvent() {
  return shell('cal', 'Calendar', `<div class="calp nodetail">${rail()}${calMain('week')}</div><div class="scrim">${eventSheet()}</div>`, true);
}

/* ============================================================
   Phone mode
   ============================================================ */
const sbar = (light) => `<div class="sbar ${light ? 'light' : ''}"><span class="tnum">9:50</span><span class="si">${ic('signal')}${ic('wifi')}${ic('battery')}</span></div><div class="isl"></div>`;
const ptab = on => `<nav class="ptab">${[['chat', 'msg', 'Chat'], ['calls', 'video', 'Calls'], ['cal', 'calendar', 'Calendar'], ['mail', 'mail', 'Mail'], ['more', 'grid', 'More']].map(([k, i, l]) => `<span class="${on === k ? 'on' : ''}">${ic(i)}${l}</span>`).join('')}</nav>`;
function scrPhone() {
  const list = `<div class="phone"><div class="scr">${sbar()}<div class="pv">
      <div class="pnav"><span class="sp"></span><button class="pb">${ic('search')}</button><button class="pb">${ic('headphones')}</button></div>
      <div class="ptitle">Calls &amp; Meetings</div>
      <div class="pseg"><div class="segmented"><button>Recents</button><button class="on">Scheduled</button><button>Rooms</button></div></div>
      <div class="plist">${GROUPS.slice(0, 3).map(([h, sub, ids]) => `<div class="day-h">${h}${sub ? `<span>${sub}</span>` : ''}</div><div class="group">${ids.map(i => card(i, false)).join('')}</div>`).join('')}</div>
    </div><button class="pfab">${ic('calplus')}Schedule</button>${ptab('calls')}<div class="hbar"></div></div></div>`;
  const det = `<div class="phone"><div class="scr">${sbar()}<div class="pv">
      <div class="pnav"><button class="back">${ic('chevL')}Scheduled</button><span class="sp"></span><button class="pb">${ic('more')}</button></div>
      <div class="pd">${detail('wict')}</div></div><div class="hbar"></div></div></div>`;
  const book = `<div class="phone"><div class="scr">${sbar(true)}<div class="pv">
      <div class="ptitle" style="padding-top:44px">Meeting Rooms</div><div class="prooms">${roomsGrid(true)}</div></div>
      <div class="pdim"></div>${bookSheet('pb', true)}<div class="hbar"></div></div></div>`;
  const evs = `<div class="phone"><div class="scr">${sbar(true)}<div class="pv">
      <div class="ptitle" style="padding-top:44px">Calendar</div><div class="pv-cal">
      ${[['k-voice', 'Vendor sync · Cisco Meraki', '09:00–10:00 · Voice call'], ['r-kalosi', 'Weekly ICT', '10:00–11:00 · Kalosi'], ['k-person', 'SAP access review', '13:30–14:30 · ICT office']].map(([c, t, s]) => `<div class="pc ${c}"><span class="bar"></span><span><b>${t}</b><span>${s}</span></span></div>`).join('')}</div></div>
      <div class="pdim"></div>${eventSheet(true)}<div class="hbar"></div></div></div>`;
  const w = (c, h) => `<div class="pw">${h}<span class="pcap">${c}</span></div>`;
  return `<div class="pstage"><div class="phones">${w('1 · Scheduled list', list)}${w('1 · Meeting detail', det)}${w('2 · Book Kalosi (bottom sheet, timeline scrolls sideways)', book)}${w('6 · New event (bottom sheet)', evs)}</div></div>`;
}

/* ============================================================
   Annotations + variants
   ============================================================ */
const NOTES = {
  sched:['1 · Scheduled tab', ['Grouped Today / Tomorrow / This week / Later; Past 30 days collapsed with Show more.', 'Kind badge on every card: room colour + name, indigo Voice call, teal In person.', 'Click any card to see its detail. Join opens 10 min before; later ones show it disabled.', 'Schedule ▾ asks Voice call or Meeting room.'], [['menu', 'Schedule menu open']]],
  book:['2 · Book Kalosi', ['Same sheet for Use now and Book. Drag the coloured block or its edges; quick chips set the time.', '"Now" turns the button into Book and join.', 'Clash: red outline, reason and one-tap "Try" for the next free slot of the same length.'], [['fit', 'Fits'], ['clash', 'Clash']]],
  repeat:['3 · Repeat check', ['Shown after choosing a repeat, before anything is booked.', 'Each clash: Skip, or Move to a free room for that date. The button counts what will be booked.', '60-day limit applies to the first date; series up to 12 times.'], []],
  cal:['4 · Calendar', ['Events coloured by kind: room colour + room name, indigo voice, teal in person; other sources keep their colours.', 'Legend sits above My calendars.', 'Detail panel is the same component as Scheduled.', 'Busy-only colleagues: tidy popover with Ask to see details, Find another time, Chat.'], [['week', 'Week'], ['month', 'Month'], ['busy', 'Busy popover']]],
  picker:['5 · Invite people', ['Opens with suggestions before typing: frequent, own department, chat groups, departments.', 'Free/busy dot for the chosen time on every row; busy people raise Find a time.', 'Groups ask before adding many; warns above room size.'], [['focus', 'Before typing'], ['fin', 'Typing “fin”'], ['toast', 'Add all → confirm']]],
  event:['6 · New event', ['Kind tiles: Event / Voice call / Meeting room / In person.', 'Meeting room shows 5 room tiles with Free/Busy for the chosen time and the same timeline.', 'Private shows only Busy to others.'], []],
  phone:['Phone (390 pt)', ['Scheduled list and detail are separate screens.', 'Booking and New event are bottom sheets; the timeline scrolls sideways.'], []],
};
let screen = location.hash.slice(1) || 'sched', theme = 'light', phone = false, annMin = false;
const $ = s => document.querySelector(s);
function annVariant(key) {
  if (screen === 'sched') return key === 'menu' ? S.menu : false;
  if (screen === 'cal') return key === 'busy' ? S.busy : S.cal === key;
  if (screen === 'picker') return key === 'toast' ? !!S.confirm : (!S.confirm && S.variant.picker === key);
  return S.variant[screen] === key;
}
function render() {
  const root = $('#root'); root.className = theme;
  const name = phone ? 'phone' : screen;
  root.innerHTML = ({sched:scrSched, book:scrBook, repeat:scrRepeat, cal:scrCal, picker:scrPicker, event:scrEvent, phone:scrPhone})[name]();
  document.querySelectorAll('#tabs button').forEach(b => { b.classList.toggle('on', !phone && b.dataset.s === screen); });
  $('#phoneTg').innerHTML = (phone ? ic('monitor') + 'Desktop' : ic('smartphone') + 'Phone'); $('#phoneTg').classList.toggle('on', phone);
  $('#themeTg').innerHTML = theme === 'light' ? ic('moon') + 'Dark' : ic('sun') + 'Light';
  const [t, items, vars] = NOTES[name];
  $('#ann').className = 'ann' + (annMin ? ' min' : '');
  $('#ann').innerHTML = `<b>${t}<button id="annTg">${annMin ? 'Show' : 'Hide'}</button></b><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>${vars.length ? `<div class="vars">${vars.map(([k, l]) => `<button data-var="${k}" class="${annVariant(k) ? 'on' : ''}">${l}</button>`).join('')}</div>` : ''}`;
  paintTL(root); bindTL(root);
  const bp = root.querySelector('#bpop'), be = root.querySelector('[data-busy]');
  if (bp && be) { const c = root.querySelector('.calm').getBoundingClientRect(), r = be.getBoundingClientRect();
    bp.style.left = (r.right - c.left + 10) + 'px'; bp.style.top = Math.max(0, r.top - c.top - 8) + 'px'; }
  fitPhones();
  if (S.confirm) { const di = root.querySelector('.drop-in'), g = [...root.querySelectorAll('.dsec')].find(x => x.textContent.startsWith('Chat groups')); if (di && g) di.scrollTop = g.offsetTop - 6; }
  root.querySelectorAll('.sheet2.bottom .tl-scroll').forEach(sc => { const sel = sc.querySelector('[data-sel]'); sc.scrollLeft = Math.max(0, sel.offsetLeft - 90); });
}
function fitPhones() {
  const ph = document.querySelector('.phones'); if (!ph) return;
  ph.style.zoom = 1; const st = ph.parentElement;
  const z = Math.min(1, (st.clientWidth - 40) / ph.scrollWidth, (st.clientHeight - 40) / ph.scrollHeight);
  ph.style.zoom = z.toFixed(3);
}
window.addEventListener('resize', fitPhones);
function setVar(k) {
  if (screen === 'sched') S.menu = !S.menu;
  else if (screen === 'cal') { if (k === 'busy') S.busy = !S.busy; else S.cal = k; }
  else if (screen === 'picker') { if (k === 'toast') { S.confirm = true; S.variant.picker = 'focus'; } else { S.confirm = false; S.variant.picker = k; } }
  else if (screen === 'book') { S.variant.book = k; delete TL.bk; }
  render();
}
document.addEventListener('click', e => {
  const t = e.target;
  const tr = t.closest('[data-try]'); if (tr) { const [id, s, en] = tr.dataset.try.split(':'); TL[id].s = +s; TL[id].e = +en; paintTL($('#root')); return; }
  const tab = t.closest('#tabs button'); if (tab) { screen = tab.dataset.s; phone = false; S.menu = false; history.replaceState(null, '', '#' + screen); render(); return; }
  if (t.closest('#themeTg')) { theme = theme === 'light' ? 'dark' : 'light'; render(); return; }
  if (t.closest('#phoneTg')) { phone = !phone; render(); return; }
  if (t.closest('#annTg')) { annMin = !annMin; render(); return; }
  const v = t.closest('[data-var]'); if (v) { setVar(v.dataset.var); return; }
  const go = t.closest('[data-go]'); if (go && !phone) {
    const g = go.dataset.go; S.menu = false;
    if (g === 'event-voice') { S.kind = 'voice'; screen = 'event'; } else { if (g === 'event') S.kind = 'room'; screen = g; }
    history.replaceState(null, '', '#' + screen); render(); return;
  }
  if (t.closest('#schedBtn')) { S.menu = !S.menu; render(); return; }
  if (S.menu && !t.closest('.menu')) { S.menu = false; render(); return; }
  if (t.closest('#pastTg')) { S.pastOpen = !S.pastOpen; render(); return; }
  if (t.closest('[data-close-busy]')) { S.busy = false; render(); return; }
  if (t.closest('[data-busy]') && !t.closest('[data-stop]')) { S.busy = !S.busy; render(); return; }
  const ev = t.closest('[data-ev]'); if (ev && !phone) { S.sel = ev.dataset.ev; const sc = $('.panel') && $('.panel').scrollTop; render(); if ($('.panel')) $('.panel').scrollTop = sc; return; }
  const cv = t.closest('#calSeg [data-v]'); if (cv) { const x = cv.dataset.v; S.cal = x === 'month' ? 'month' : 'week'; render(); return; }
  const kd = t.closest('[data-kind]'); if (kd) { const keep = phone; S.kind = kd.dataset.kind; const sb = t.closest('.sh-b'), sc = sb && sb.scrollTop; render(); const nb = document.querySelectorAll('.sh-b'); if (keep && nb.length) nb[nb.length - 1].scrollTop = sc; return; }
  const rm = t.closest('[data-room]'); if (rm) { S.room = rm.dataset.room; const sb = t.closest('.sh-b'), sc = sb && sb.scrollTop; render(); const nb = document.querySelectorAll('.sh-b'); if (sc && nb.length) nb[nb.length - 1].scrollTop = sc; return; }
  const rp = t.closest('[data-rep] button'); if (rp) { S.rep[rp.parentElement.dataset.rep] = rp.dataset.v; render(); return; }
  const tg = t.closest('[data-tg]'); if (tg) { tg.setAttribute('aria-checked', tg.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); return; }
  const sg = t.closest('[data-seg] button'); if (sg) { sg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sg)); return; }
  const ad = t.closest('[data-add]'); if (ad) { const k = ad.dataset.add; ADDED.has(k) ? ADDED.delete(k) : ADDED.add(k); render(); return; }
  const al = t.closest('[data-all]'); if (al) { if (al.dataset.all === 'ict') S.confirm = true; else S.added = al.dataset.all; render(); return; }
  const ts = t.closest('[data-toast]'); if (ts) { if (ts.dataset.toast === 'yes') S.added = 'ict'; S.confirm = false; render(); return; }
  const qc = t.closest('.seg2'); if (qc) return;
});
window.addEventListener('hashchange', () => { screen = location.hash.slice(1) || 'sched'; render(); });
render();

</script>
</body>
