<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPop · Calls & Meetings — Meeting Rooms (Apple style, v2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ============================================================
   Tokens — Apple system colours on iPop's forest shell
   ============================================================ */
:root{
  --frame:#123528; --frame-2:#1b4635; --frame-ink:#e9f1ec; --frame-ink-2:#9fb9ab; --frame-line:rgba(255,255,255,.09);
  --content:#f5f5f7; --card:#ffffff; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08);
  --sep:rgba(60,60,67,.14); --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --ink-4:#aeaeb2;
  --green:#2e9e5b; --green-sys:#34c759; --red:#ff3b30; --blue:#0a84ff; --orange:#ff9f0a; --indigo:#5e5ce6;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.55);
  --pop:0 24px 60px -18px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.08);
  --ease:cubic-bezier(.32,.72,0,1);
}
.dark{
  --frame:#0a1f17; --frame-2:#143326; --content:#000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --sep:rgba(84,84,88,.6); --ink:#f5f5f7; --ink-2:#d1d1d6; --ink-3:#98989d; --ink-4:#636366;
  --green:#30d158; --glass:rgba(44,44,46,.72); --glass-line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-.011em;color:var(--ink);background:var(--frame)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.lucide{width:18px;height:18px;stroke-width:1.8;flex:none}
:focus-visible{outline:3px solid rgba(10,132,255,.55);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- mockup chrome ---------- */
.mock-nav{position:fixed;z-index:200;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:14px;
  background:rgba(28,28,30,.86);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mock-nav button{color:#d1d1d6;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:10px;white-space:nowrap}
.mock-nav button.on{background:#fff;color:#1d1d1f}
.mock-nav .sep{width:1px;background:rgba(255,255,255,.15);margin:4px 4px}
.ann{position:fixed;z-index:190;right:16px;bottom:70px;width:280px;padding:12px 14px;border-radius:14px;background:rgba(255,251,230,.96);
  color:#4d3d0f;font-size:12px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer}
.ann b{display:block;margin-bottom:4px;font-size:12.5px}
.ann ul{padding-left:16px}

/* ============================================================
   Shell (forest frame, content panel, tab-style active item)
   ============================================================ */
.shell{display:grid;grid-template-columns:248px 1fr;grid-template-rows:64px 1fr;height:100vh;background:var(--frame);color:var(--frame-ink)}
.side{grid-row:1/span 2;display:flex;flex-direction:column;padding:16px 0 14px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 12px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#d9a46a,#8a5a3c);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.nav{flex:1;overflow:auto;scrollbar-width:none}
.grp{padding:8px 0 4px}
.grp + .grp{border-top:1px solid var(--frame-line);margin-right:14px}
.grp-h{display:flex;align-items:center;gap:8px;padding:2px 10px 6px;font-size:12.5px;font-weight:700;color:#fff}
.grp-h span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.grp-h span svg{width:12px;height:12px;color:#fff}
.item{position:relative;display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;margin:0 14px 1px 0;border-radius:11px;font-size:14.5px;font-weight:550;color:var(--frame-ink)}
.item svg{width:19px;height:19px}
.item:hover{background:var(--frame-2)}
.item.active{margin-right:0;border-radius:13px 0 0 13px;background:var(--content);color:var(--ink);font-weight:700}
.item.active::before,.item.active::after{content:"";position:absolute;right:0;width:16px;height:16px;pointer-events:none}
.item.active::before{top:-16px;border-bottom-right-radius:13px;box-shadow:6px 6px 0 6px var(--content)}
.item.active::after{bottom:-16px;border-top-right-radius:13px;box-shadow:6px -6px 0 6px var(--content)}
.g-work svg{color:#6fd3a3}.g-comm svg{color:#8ab6f5}.g-res svg{color:#f2b56b}.g-adm svg{color:#c3b5f5}
.item.active svg{color:var(--green)!important}
.me{display:flex;align-items:center;gap:10px;margin:8px 14px 0 0;padding:8px;border-radius:13px;border:1px solid var(--frame-line)}
.me .av{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#d9a46a,#8a5a3c);display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.me b{display:block;font-size:13.5px}.me small{color:var(--frame-ink-2);font-size:12px}
.top{display:flex;align-items:center;gap:14px;padding:0 24px 0 18px}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.022em;color:#fff}
.top .search{margin-left:auto;width:340px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:9px;padding:0 13px;color:#bcd0c5;font-size:14px}
.top .ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#dbe7e0}
.top .ib:hover{background:rgba(255,255,255,.1)}
.panel{background:var(--content);border-radius:18px 0 0 0;overflow:auto;min-height:0;color:var(--ink)}
.page{max-width:1180px;margin:0 auto;padding:22px 32px 110px}

/* ============================================================
   Toolbar (segmented control + actions)
   ============================================================ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.segmented{display:inline-flex;padding:2px;border-radius:10px;background:var(--fill)}
.segmented button{display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.segmented button svg{width:15px;height:15px}
.segmented button em{font-style:normal;color:var(--ink-3);font-size:12.5px}
.segmented button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.plain{color:var(--ink-2)} .btn.plain:hover{background:var(--fill-2)}
.btn.tinted{background:rgba(46,158,91,.12);color:var(--green)}
.btn.filled{background:var(--green);color:#fff}
.btn.filled:hover{filter:brightness(1.06)}

/* ============================================================
   Room tiles — the one bold element: roast-tone rooms
   ============================================================ */
.section-h{display:flex;align-items:baseline;gap:12px;margin:0 2px 14px}
.section-h h2{font-size:22px;font-weight:700;letter-spacing:-.025em}
.section-h p{color:var(--ink-3);font-size:14px}
.rooms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:40px}
.room{--a:#000;--b:#000;position:relative;height:292px;border-radius:22px;overflow:hidden;color:#fff;isolation:isolate;
  background:radial-gradient(120% 90% at 10% 0%,var(--a) 0%,var(--b) 72%);box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 30px -18px var(--b);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.room:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 40px -20px var(--b)}
.room::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 50% at 100% 100%,rgba(255,255,255,.14),transparent 70%)}
.bean{position:absolute;right:-26px;top:38px;width:150px;height:150px;opacity:.16;z-index:-1;transform:rotate(-24deg)}
.room-head{padding:16px 16px 0;padding-right:92px;min-height:70px}
.room-head h3{font-size:21px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.room-head small{display:block;font-size:12.5px;opacity:.78;font-weight:500;margin-top:2px}
.cap{position:absolute;top:16px;right:14px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:650;
  background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
.cap.live::before,.cap.is-rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.25)}
.cap.is-rec{background:rgba(255,59,48,.92)} .cap.is-rec::before{background:#fff;box-shadow:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.glass{position:absolute;left:8px;right:8px;bottom:8px;padding:12px;border-radius:16px;background:rgba(255,255,255,.16);
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:.5px solid rgba(255,255,255,.28)}
.who{display:flex;align-items:center;gap:8px;min-height:30px}
.faces{display:flex}
.faces b{width:30px;height:30px;border-radius:50%;margin-left:-8px;border:1.5px solid rgba(255,255,255,.85);display:grid;place-items:center;font-size:10px;letter-spacing:-.02em;font-weight:700;color:#fff}
.faces b:first-child{margin-left:0}
.who span{font-size:13px;font-weight:600}
.who span em{font-style:normal;opacity:.75;font-weight:500}
.empty-seat{display:flex;align-items:center;gap:7px;font-size:13px;opacity:.85}
.empty-seat svg{width:16px;height:16px}
.line{font-size:12px;opacity:.82;margin:6px 0 10px;display:flex;gap:6px;align-items:flex-start;line-height:1.35;min-height:32px}
.line svg{width:13px;height:13px;margin-top:2px;opacity:.9}
.join{width:100%;height:36px;border-radius:999px;background:#fff;color:#1d1d1f;font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.join svg{width:16px;height:16px}
.join:hover{background:#f2f2f7}
.join.full{background:rgba(255,255,255,.22);color:rgba(255,255,255,.85);cursor:default}
.room-tools{position:absolute;top:50px;right:12px;display:flex;flex-direction:column;gap:6px}
.r-robusta{--a:#9a6849;--b:#3d251a}
.r-arabika{--a:#e2a965;--b:#8e5228}
.r-kalosi{--a:#86bf8b;--b:#255a3e}
.r-kapal{--a:#f37758;--b:#9c2318}
.r-toraja{--a:#8b98ea;--b:#2b3683}
.mini-vid{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;opacity:.8;margin-top:6px}
.mini-vid svg{width:13px;height:13px}

/* ---------- inset grouped list (recordings) ---------- */
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}
.rec{display:grid;grid-template-columns:132px 1fr auto;gap:16px;align-items:center;padding:12px 16px 12px 12px;position:relative}
.rec + .rec::before{content:"";position:absolute;top:0;left:160px;right:0;height:.5px;background:var(--sep)}
.thumb{width:132px;height:74px;border-radius:10px;position:relative;overflow:hidden;background:radial-gradient(120% 120% at 0% 0%,var(--a),var(--b))}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center}
.thumb .play i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.thumb .play svg{width:15px;height:15px;fill:#fff}
.thumb .dur{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.rec-t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em}
.rec-t span{display:block;color:var(--ink-3);font-size:13px;margin-top:1px}
.rec-t .room-chip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink-2);font-weight:550}
.rec-t .room-chip i{width:10px;height:10px;border-radius:3px;background:var(--b)}
.rec-a{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px}
.round{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--green);background:rgba(46,158,91,.1)}
.round:hover{background:rgba(46,158,91,.18)}
.round svg{width:17px;height:17px}
.processing{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3)}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--fill);border-top-color:var(--ink-3);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot-note{color:var(--ink-3);font-size:12.5px;margin:8px 16px 0}

/* ---------- alert (room full) ---------- */
.scrim{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(0,0,0,.28);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.alert{width:340px;border-radius:18px;overflow:hidden;background:rgba(246,246,248,.86);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:var(--pop);color:#1d1d1f;text-align:center;animation:pop .32s var(--ease)}
@keyframes pop{from{transform:scale(1.08);opacity:0}}
.alert-body{padding:22px 20px 14px}
.alert .sym{width:54px;height:54px;border-radius:14px;margin:0 auto 12px;display:grid;place-items:center;color:#fff}
.alert .sym svg{width:28px;height:28px}
.alert h3{font-size:17px;font-weight:700;letter-spacing:-.02em}
.alert p{font-size:13px;color:#3c3c43;margin-top:4px;line-height:1.4}
.alt{margin:14px 0 2px;background:#fff;border-radius:12px;text-align:left;overflow:hidden}
.alt button{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:10px 12px;position:relative}
.alt button + button::before{content:"";position:absolute;top:0;left:51px;right:0;height:.5px;background:rgba(60,60,67,.18)}
.alt .sw{width:28px;height:28px;border-radius:8px;background:radial-gradient(120% 120% at 0% 0%,var(--a),var(--b))}
.alt b{font-size:14px;font-weight:600;display:block}
.alt small{font-size:12px;color:#6e6e73}
.alt em{margin-left:auto;font-style:normal;color:var(--blue);font-weight:600;font-size:14px}
.alert-actions{display:flex;border-top:.5px solid rgba(60,60,67,.25)}
.alert-actions button{flex:1;height:44px;font-size:16px;color:var(--blue)}
.alert-actions button + button{border-left:.5px solid rgba(60,60,67,.25)}
.alert-actions .strong{font-weight:650}

/* ============================================================
   In the room — FaceTime-like
   ============================================================ */
.meet{position:fixed;inset:0 0 56px 0;background:#0b0b0c;color:#f5f5f7;overflow:hidden}
.meet-bg{position:absolute;inset:0;background:radial-gradient(60% 60% at 15% 0%,rgba(226,169,101,.20),transparent 60%),radial-gradient(50% 50% at 100% 100%,rgba(48,209,88,.08),transparent 60%)}
.m-top{position:absolute;top:0;left:0;right:0;height:72px;display:flex;align-items:center;gap:12px;padding:0 22px;z-index:5}
.m-room{display:flex;align-items:center;gap:11px}
.m-room .sw{width:34px;height:34px;border-radius:10px;background:radial-gradient(120% 120% at 0% 0%,#e2a965,#8e5228)}
.m-room b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.m-room small{display:block;color:#a1a1a6;font-size:12.5px;font-variant-numeric:tabular-nums}
.m-right{margin-left:auto;display:flex;gap:8px}
.gbtn{height:36px;padding:0 13px;border-radius:999px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#f5f5f7;
  background:rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.12)}
.gbtn:hover{background:rgba(255,255,255,.16)}
.gbtn svg{width:16px;height:16px}
.reccap{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:999px;background:rgba(255,59,48,.16);
  border:.5px solid rgba(255,59,48,.5);color:#ff8a80;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.reccap::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s ease-in-out infinite}
.stage{position:absolute;top:72px;left:22px;right:22px;bottom:118px;display:grid;grid-template-columns:1fr 228px;gap:14px}
.screen{position:relative;border-radius:18px;overflow:hidden;background:#1c1c1e;display:grid;place-items:center}
.doc{width:92%;aspect-ratio:16/9;max-height:92%;background:#fff;border-radius:8px;display:grid;grid-template-columns:24% 1fr;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.doc .l{background:#f2f2f7;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.doc .l i{height:9px;border-radius:5px;background:#dcdce1}
.doc .r{padding:22px;display:flex;flex-direction:column;gap:12px}
.doc .r h4{color:#1d1d1f;font-size:18px;letter-spacing:-.02em}
.bars{flex:1;display:flex;align-items:flex-end;gap:12px;padding:12px 6px 0;border-bottom:1px solid #e5e5ea}
.bars i{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(#5ec58a,#2e9e5b)}
.kpis{display:flex;gap:10px}
.kpis div{flex:1;background:#f5f5f7;border-radius:10px;padding:8px 10px;color:#1d1d1f;font-size:11px}
.kpis b{display:block;font-size:17px}
.who-shares{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 6px;border-radius:999px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(12px);font-size:12.5px;font-weight:600}
.who-shares .mono{width:20px;height:20px;font-size:9px}
.filmstrip{display:flex;flex-direction:column;gap:10px;overflow:auto;padding-right:2px}
.tile{position:relative;flex:none;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#2c2c2e;display:grid;place-items:center;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.tile.speaking{box-shadow:inset 0 0 0 2.5px #30d158}
.mono{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:18px;color:#fff;
  background:linear-gradient(180deg,#a1a1a6,#7c7c80)}
.tile .nm{z-index:2;position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(12px);font-size:12px;font-weight:600}
.tile .nm svg{width:13px;height:13px}
.tile .nm .off{color:#ff6961}
.cam{background:radial-gradient(70% 60% at 50% 35%,var(--wall,#6f5a4b),#2a211c)}
.cam::before{content:"";position:absolute;left:50%;top:22%;width:30%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:var(--skin,#c99a78);filter:blur(.4px)}
.cam::after{content:"";position:absolute;left:50%;bottom:-6%;width:62%;height:42%;border-radius:50% 50% 0 0;transform:translateX(-50%);background:var(--shirt,#3f5f8f)}
.cam .mono{display:none}
.more{flex:none;height:52px;border-radius:14px;background:#1c1c1e;display:grid;place-items:center;color:#a1a1a6;font-size:13px;font-weight:600}

/* grid view (no share) */
.stage.grid{grid-template-columns:1fr}
.gridwrap{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:12px}
.gridwrap .tile{aspect-ratio:auto}
.gridwrap .mono{width:84px;height:84px;font-size:30px}

/* control capsule */
.dock{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:flex-start;gap:6px;padding:10px 14px 8px;border-radius:26px;
  background:rgba(44,44,46,.72);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:.5px solid rgba(255,255,255,.14);
  box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:6}

        <button class="ctl"><i><svg class="lucide" data-lucide="switch-camera"></svg></i>Flip</button>
        <button class="ctl"><i><svg class="lucide" data-lucide="message-circle"></svg></i><span class="badge">2</span>Chat</button>
        <button class="ctl leave"><i><svg class="lucide" data-lucide="phone-off"></svg></i>Leave</button>
      </div>
    </div><div class="p-cap">In the room &middot; Flip switches front/back camera</div></div>
    <div class="phone"><div class="scr">
      <div class="notch"></div>
      <div class="p-chat">
        <h4><i data-lucide="chevron-left"></i>Meeting chat</h4>
        <div class="msgs">
          <div class="m"><span class="mono" style="background:#c47b45">SA</span><div class="bub"><b>Sari<time>14:03</time></b><p>Agenda is in the invite.</p></div></div>
          <div class="m"><span class="mono" style="background:#3f7d5a">BD</span><div class="bub"><b>Budi<time>14:04</time></b><p>Joining from Karawang, audio only.</p></div></div>
          <div class="m mine"><span class="mono" style="background:#c08a4a">BG</span><div class="bub"><b>You<time>14:05</time></b><p>Okay, starting in 1 minute.</p></div></div>
        </div>
        <div class="composer"><div class="in">Message everyone&hellip;<i data-lucide="smile"></i></div><button class="send"><i data-lucide="arrow-up"></i></button></div>
      </div>
    </div><div class="p-cap">Chat opens full screen on a phone</div></div>
  </div>
</template>

<script>
const notes = {
  rooms: ['Rooms tab (booking only)', ['Free room: "Use now" (instant booking) + small Book button.', 'Booked & you are invited: Join (also 10 min early: "Join early").', 'Booked, not invited: Locked capsule + "Enter with password".', 'Recordings: only people who were there; Delete only for the recorder + organizer.']],
  usenow: ['Use now', ['Books the room from now for 30/60/90 min (default 60), refused if it clashes with the next booking.', 'You become the organizer; optional invitees get the iPop invite with the Join link.']],
  pw: ['Enter with password', ['6 digits from the iPop invite. Invited people never see this; their Join link already lets them in.']],
  cal: ['Meeting detail in Calendar', ['Password shown only to the organizer and invitees; Copy, and New password for the organizer.', 'Same password is in the invite and the reminder notification.']],
  meet: ['In the meeting', ['Chat panel on the right like Zoom; unread badge on Chat; saved with the server recording when one runs.', 'Screen share in Full HD up to 60 fps, with the shared audio playing (green "Sharing audio").', 'Camera 720p/30.']],
  ending: ['Time running out', ['5 minutes before the end: banner; organizer can Extend 15 min when the slot after is free.', 'If the next booking starts, everyone is moved out at that time.']],
  player: ['Recording player', ['Full HD video with the meeting chat next to it, each message stamped with its time in the video.', 'Delete in the player too (recorder + organizer).']],
  del: ['Delete recording (2 steps)', ['Delete button, then this confirmation. The NAS file is removed right away.']],
  tpl: ['Server recording layout, 1080p', ['iPop own layout instead of the LiveKit default: shared screen large and sharp, cameras on the right without cropping faces, names on every tile.', 'No share: neat grid; camera off shows initials + name, not grey icons.', 'Corner badge: room, meeting title, date and time.']],
  phone: ['Phone', ['Flip button switches front/back camera (only shown when the phone has two).', 'Own picture-in-picture, compact dock, chat full screen.', 'Camera on phones needs https://ipop.santos.co.id.']],
};
const $ = s => document.querySelector(s);
let theme = 'light';
function shell(tpl, nav, title) {
  const s = $('#t-shell').content.cloneNode(true);
  s.querySelector('.page').append($(tpl).content.cloneNode(true));
  s.querySelector(nav).classList.add('active');
  s.querySelector('.ttl').textContent = title;
  return s;
}
function tplFrame(el, mode) {
  el.className = 'rt' + (mode === 'grid' ? ' grid4' : '');
  const badge = '<div class="badge2"><span class="sw"></span><b>Arabika</b><span>Production review &middot; 12 Oct 2026, 10:14</span></div>';
  if (mode === 'grid') {
    el.innerHTML = badge +
      '<div class="t cam speaking" style="--wall:#7b5e48;--skin:#d2a27f;--shirt:#2f6a4a"><span class="mono">SA</span><span class="nm">Sari Andini</span></div>' +
      '<div class="t cam" style="--wall:#4d5a78;--skin:#b98563;--shirt:#8c3b2e"><span class="mono">RW</span><span class="nm">Rina Wulandari</span></div>' +
      '<div class="t"><span class="mono" style="background:#3f7d5a">BD</span><span class="nm">Budi Darmawan</span></div>' +
      '<div class="t"><span class="mono" style="background:#b0412d">DN</span><span class="nm">Dani Nugroho</span></div>';
  } else {
    el.innerHTML = badge +
      '<div class="main"><div class="doc"><div class="l"><i></i><i style="width:70%"></i><i></i><i style="width:55%"></i><i></i></div><div class="r"><h4>Output October</h4><div class="kpis"><div><b>1,284 t</b>Roasted</div><div><b>97.2%</b>On spec</div><div><b>3</b>Line stops</div></div><div class="bars"><i style="height:45%"></i><i style="height:62%"></i><i style="height:58%"></i><i style="height:80%"></i><i style="height:71%"></i><i style="height:92%"></i></div></div></div></div>' +
      '<div class="strip">' +
      '<div class="t cam speaking" style="--wall:#7b5e48;--skin:#d2a27f;--shirt:#2f6a4a"><span class="mono">SA</span><span class="nm">Sari</span></div>' +
      '<div class="t"><span class="mono" style="background:#3f7d5a">BD</span><span class="nm">Budi &middot; sharing</span></div>' +
      '<div class="t cam" style="--wall:#4d5a78;--skin:#b98563;--shirt:#8c3b2e"><span class="mono">RW</span><span class="nm">Rina</span></div>' +
      '<div class="t"><span class="mono" style="background:#b0412d">DN</span><span class="nm">Dani</span></div></div>';
  }
}
function render(name) {
  const root = $('#root'); root.innerHTML = ''; root.className = theme;
  if (['rooms', 'usenow', 'pw', 'del'].includes(name)) root.append(shell('#t-rooms', '.nav-calls', 'Calls & Meetings'));
  if (name === 'cal') root.append(shell('#t-rooms', '.nav-calls', 'Calendar'));
  if (name === 'usenow') root.append($('#t-usenow').content.cloneNode(true));
  if (name === 'pw') root.append($('#t-pw').content.cloneNode(true));
  if (name === 'cal') root.append($('#t-cal').content.cloneNode(true));
  if (name === 'del') root.append($('#t-del').content.cloneNode(true));
  if (name === 'meet' || name === 'ending' || name === 'player') {
    root.append($('#t-meet').content.cloneNode(true));
    root.querySelector('.recslot').innerHTML = '<span class="reccap">Recording &middot; Bagastyo &middot; 03:41</span>';
    if (name === 'ending') {
      root.querySelector('.timeslot').innerHTML = '<span class="timechip"><svg class="lucide" data-lucide="timer"></svg>Ends in 4:52</span>';
      root.querySelector('.meet').insertAdjacentHTML('beforeend', '<div class="banner"><svg class="lucide" data-lucide="timer"></svg><span>This booking ends at 11:00. The room is free after that.</span><button class="bb">Extend 15 min</button><button class="bb g">OK</button></div>');
      root.querySelector('.meet').insertAdjacentHTML('beforeend', '<div class="toast2"><svg class="lucide" data-lucide="volume-x"></svg>This window shares no sound. To share audio, choose a Tab or Entire screen.</div>');
    }
    if (name === 'player') {
      root.append($('#t-player').content.cloneNode(true));
      tplFrame(root.querySelector('.player .rt'), 'share');
    }
  }
  if (name === 'tpl') {
    root.append($('#t-tpl').content.cloneNode(true));
    const f = root.querySelector('#rtframe'); tplFrame(f, 'share');
    root.querySelectorAll('.rt-cap button').forEach(b => b.onclick = () => { root.querySelectorAll('.rt-cap button').forEach(x => x.classList.toggle('on', x === b)); tplFrame(f, b.dataset.l); lucide.createIcons(); });
  }
  if (name === 'phone') root.append($('#t-phone').content.cloneNode(true));
  const [t, items] = notes[name];
  const ann = $('#ann'); ann.style.display = '';
  ann.innerHTML = `<b>${t}</b><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
  document.querySelectorAll('.mock-nav [data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === name));
  lucide.createIcons();
}
let current = location.hash.slice(1) || 'rooms';
document.querySelectorAll('.mock-nav [data-s]').forEach(b => b.onclick = () => { current = b.dataset.s; history.replaceState(null, '', '#' + current); render(current); });
$('#theme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; $('#theme').textContent = theme === 'light' ? 'Dark' : 'Light'; render(current); };
$('#ann').onclick = () => $('#ann').style.display = 'none';
window.addEventListener('hashchange', () => { current = location.hash.slice(1) || 'rooms'; render(current); });
render(current);
</script>
</body>
</html>
